<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 主题/语言：默认随系统，宿主（3D 房子）可用 <html data-theme> / ?lang= 覆盖。
     必须放在样式之前 —— 它同步写 data-theme，首帧就是对的颜色，不会闪一下。 -->
<script src="../../_env.js"></script>
<script src="../../_pager.js"></script>
<script src="../../_from.js" defer></script>
<title>接触印相 · CONTACT SHEET — 一间摄影房</title>
<meta name="description" content="一条悬在暗房里的接触印相带：十二帧按真实画幅（3:4 / 4:3 / 16:9）排在透视深处，滚轮或拖动沿带走，点一帧把它抬起来看大图与展签。照片来自 Pixabay，构建时抓取。纯 CSS 3D + canvas，没有一张占位图。">
<style>
@font-face{
  font-family:'MapleUI';
  src:url('/fonts/maple-ui.woff2') format('woff2');
  font-weight:400 500;font-display:swap;
}
:root{
  /* ── 页面（跟随主题） ───────────────────────────────────────────── */
  --bg:#08090c;
  --ink:#eef1f6;
  --dim:#8b93a3;
  --dim-2:#565c6a;
  --line:rgba(150,170,200,.16);
  --line-2:rgba(150,170,200,.32);
  --chip:rgba(10,13,19,.62);
  --veil:8,9,12;
  /* ── 暗房里的东西：**不跟随主题** ──────────────────────────────────
     相纸是相纸、胶片是胶片。换主题换的是这间屋子的墙，不是照片。 */
  --paper:#F4ECDC;
  --paper-ink:#1d1a17;
  --paper-dim:#6b6154;
  --film:#12141a;
  --film-edge:#1c2029;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:'MapleUI',ui-sans-serif,system-ui,'PingFang SC','Hiragino Sans GB',sans-serif;
}
html[data-theme="light"]{
  --bg:#F7EDDE;
  --ink:#211D1A;
  --dim:#6a5c4f;
  --dim-2:#98866f;
  --line:rgba(120,92,66,.26);
  --line-2:rgba(120,92,66,.48);
  --chip:rgba(255,250,242,.76);
  --veil:247,237,222;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  transition:background-color .5s ease,color .5s ease;
}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:0}

/* ══ 顶栏 ═══════════════════════════════════════════════════════ */
.top{
  position:fixed;left:0;right:0;top:0;z-index:20;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:22px 26px 0;pointer-events:none;
}
.brand{pointer-events:auto}
.brand__name{font:500 15px/1 var(--sans);letter-spacing:.14em;color:var(--ink)}
.brand__name i{font-style:normal;color:var(--dim-2);margin:0 6px}
.brand__meta{
  margin-top:7px;font:400 10px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);
}
/* 顶栏正中：这是哪一卷 */
.roll{position:absolute;left:50%;top:24px;transform:translateX(-50%);text-align:center;pointer-events:none}
.roll__no{font:400 10px/1 var(--mono);letter-spacing:.22em;color:var(--dim-2)}
.roll__name{margin-top:6px;font:500 12px/1 var(--sans);letter-spacing:.06em;color:var(--dim)}

/* ══ 印相带（透视容器） ══════════════════════════════════════════
   perspective 在这一层；里面只有一条 .strip 在深度里平移。 */
.stage{
  position:fixed;inset:0;z-index:2;
  overflow:hidden;
  perspective:1500px;perspective-origin:50% 46%;
  touch-action:none;          /* 拖动带走，别滚页面 */
  cursor:grab;
}
.stage.is-drag{cursor:grabbing}
/* 挂线层：铺满视口、不吃鼠标、在带子后面 */
.rig{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:1;pointer-events:none;
  color:var(--ink);
  /* 深色下细线要几乎看不见才自然；浅色下反而要更淡 */
  opacity:.5;
}
html[data-theme="light"] .rig{opacity:.42}
.rig line{
  stroke:currentColor;stroke-width:1;
  vector-effect:non-scaling-stroke;
}
/* 横梁：比吊线亮一点，让人看出"这是根杆子" */
.rig line[id^="rail"]{stroke-width:1.2;stroke-opacity:.42}
/* 吊线：纯色、很淡。**不要用渐变** —— 第一版用了从梁到帧顶的 rodFade，
   结果线的末端（正好落在帧顶，本该"抓住"照片的地方）几乎全透明，
   看起来像线没接上。 */
.rig line[id^="wire"]{stroke-width:1;stroke-opacity:.30}

.strip{
  position:absolute;left:50%;top:50%;
  width:0;height:0;
  /* 顶栏压着 60px、底部 HUD 又占了 50px —— 视觉中心比几何中心略高一点，
     所以整条带子往上挪 10px，帧才在"中间"而不是"偏下"。 */
  margin-top:-10px;
  transform-style:preserve-3d;
  will-change:transform;
}
/* 每一帧：absolute 定位在 .strip 上，用 --tx/--tz 摆位置 */
.frame{
  position:absolute;
  border:0;padding:0;background:none;
  /* 🔴 absolute 默认按**左上角**定位 ⇒ 每帧都往右下偏了半个身位，整条带子
     看着"飘"到右下去。锚点收到自身中心：left/top 由 buildFrames() 写成
     负的半个宽高（`margin:-50%` 不行 —— 百分比参照的是 .strip 的宽，而它是 0）。 */
  transform-origin:50% 50%;
  cursor:pointer;outline:none;
  -webkit-tap-highlight-color:transparent;
  will-change:transform,opacity;
}
/* 相纸：白边 + 底下留宽一点，像真的接触印相。
   🔴 它是 <span>，**必须显式 display:block**：inline 元素吃不到 width/height:100%，
   结果相纸按内容撑开、从画面里溢出去（实测白边跑到照片上方 26px）。
   用 absolute + inset:0 把相纸**钉死**在帧的盒子里，不依赖内容尺寸。 */
.frame__sheet{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:9px 9px 26px;
  background:var(--paper);
  box-shadow:0 30px 70px -34px rgba(0,0,0,.85), 0 2px 0 rgba(255,255,255,.06) inset;
  transition:transform .42s cubic-bezier(.22,1,.28,1),box-shadow .42s ease;
}
/* 🔴 浅色下墙也是暖纸（#F7EDDE），相纸 #F4ECDC 几乎同色 ⇒ 印相"陷"进背景里，
   看不出是一张张纸。给它一道极细的深边 + 更实的投影，纸才立起来。
   深色下不需要这道边（墙是黑的，纸自己就跳出来了）。 */
html[data-theme="light"] .frame__sheet{
  background:#FFFCF6;
  box-shadow:0 1px 0 rgba(120,92,66,.16) inset, 0 0 0 1px rgba(120,92,66,.14),
             0 26px 54px -30px rgba(103,74,48,.5);
}
.frame:hover .frame__sheet{transform:translateY(-4px);box-shadow:0 40px 80px -30px rgba(0,0,0,.9)}
.frame.is-active .frame__sheet{outline:1px solid rgba(255,255,255,.5);outline-offset:-1px}
/* 画面：填满相纸里除展签以外的部分 */
.frame__pic{
  display:block;flex:1 1 auto;min-height:0;width:100%;
  background:#0d0f14 center/cover no-repeat;
  /* 没加载出来之前是这块底色 —— 不是"占位图"，是真的在等字节 */
  filter:saturate(1.02);
}
/* 展签（相纸下那条边）：编号 + 画幅 */
.frame__tag{
  position:absolute;left:11px;right:11px;bottom:7px;
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font:400 8.5px/1 var(--mono);letter-spacing:.1em;
  color:var(--paper-dim);
}
.frame__tag b{font-weight:400;color:var(--paper-ink)}
.frame.is-active .frame__tag b{color:#8a5a2b}
html[data-theme="light"] .frame.is-active .frame__tag b{color:#8a5a2b}

/* 帧序号：贴在最前面的那帧右上角 */
.frame__idx{
  position:absolute;right:-2px;top:-2px;
  font:400 8px/1 var(--mono);letter-spacing:.08em;
  color:rgba(255,255,255,.5);
  transform:translate(0,-14px);
}

/* ══ 底部 HUD ═══════════════════════════════════════════════════ */
.hud{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 20px;gap:20px;pointer-events:none;
}
.hud__hint{
  font:400 10px/1.6 var(--mono);letter-spacing:.08em;color:var(--dim);
  pointer-events:none;
}
/* 浅色下 --dim-2 在暖纸上几乎看不见（实测像一行脏点），换 --dim */
html[data-theme="light"] .hud__hint{color:var(--dim)}
.counter{
  display:flex;align-items:baseline;gap:5px;pointer-events:auto;
  font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--dim);
}
.counter b{font-weight:400;font-size:15px;color:var(--ink);letter-spacing:.02em}
/* 进度：一条极细的刻度，画的是"你在这条带子的哪儿" */
.rail{position:relative;width:132px;height:1px;background:var(--line);margin:0 0 7px}
.rail__dot{
  position:absolute;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
  border-radius:50%;background:var(--ink);transition:left .18s ease;
}

/* ══ 大图浮层 ═══════════════════════════════════════════════════ */
.view{
  position:fixed;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;
  padding:56px 60px;
  background:rgba(var(--veil),.9);
  backdrop-filter:blur(14px) saturate(.9);
  opacity:0;pointer-events:none;
  transition:opacity .32s ease;
}
.view.is-on{opacity:1;pointer-events:auto}
.view__box{
  position:relative;display:flex;flex-direction:column;
  /* 🔴 用 align-items:center + 宽度由内容决定，**不要**给 max-width:1100px ——
     竖幅照片只有 500px 宽，盒子却是 1100 ⇒ 照片贴左、右边一片空白，
     而描述/tags 又是块级、会压到相纸上（第一版就这样）。
     宽度交给"最宽的那个孩子"（相纸或描述），大家在中间对齐。 */
  align-items:center;
  width:fit-content;max-width:100%;max-height:100%;
  transform:translateY(10px) scale(.99);
  transition:transform .38s cubic-bezier(.22,1,.28,1);
}
.view.is-on .view__box{transform:none}
/* 相纸：**包住图片**（width:fit-content），不是撑满整行。
   `box-sizing:content-box` 让 padding 加在图片外面 —— 这样 44px 的白边
   不会被图片挤掉（border-box 下图片会把 padding 吃掉）。 */
.view__sheet{
  position:relative;min-height:0;width:fit-content;flex:0 1 auto;
  box-sizing:content-box;
  padding:16px 16px 44px;
  background:var(--paper);
  box-shadow:0 60px 120px -50px rgba(0,0,0,.95);
}
.view__pic{
  display:block;
  /* 🔴 max-height 必须**连展签（44px）和浮层上下留白一起算**，
     否则竖幅照片会把相纸撑到最大，展签被照片盖住（实测压在字上）。
     扣掉的 300 = 顶栏 60 + 标题/副标题 60 + 相纸 padding 60 + 展签 44 + 余量。 */
  max-width:min(78vw, 1080px);
  max-height:calc(100vh - 330px);
  width:auto;height:auto;
  background:#0d0f14;
}
.view__cap{
  position:absolute;left:18px;right:18px;bottom:13px;
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  font:400 9px/1 var(--mono);letter-spacing:.12em;color:var(--paper-dim);
}
.view__cap b{max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view__cap b{font-weight:400;color:var(--paper-ink)}
/* 文字说明放浮层右侧？不 —— 这个房间的规矩是"照片自己说话"，
   说明就压在相纸下沿那条边上，跟真展签一样。上面再补一行标题。 */
.view__title{
  /* 和相纸同宽、同一条左边线 —— 标题才像"这张照片的标题"，
     而不是浮在盒子左上角的一句独立文字。 */
  box-sizing:border-box;
  width:100%;max-width:640px;
  margin:0 0 10px;font:500 17px/1.35 var(--sans);letter-spacing:.01em;
  color:var(--ink);
}
.view__sub{
  width:100%;max-width:640px;box-sizing:border-box;
  margin:-4px 0 12px;font:400 10px/1.5 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);
}
.view__desc{
  box-sizing:border-box;
  width:100%;max-width:640px;
  margin:16px 0 0;font:400 12.5px/1.7 var(--sans);color:var(--dim);
}
.view__tags{
  box-sizing:border-box;
  width:100%;max-width:640px;
  display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;
}
.view__tags span{
  font:400 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:5px 7px;
}
.view__actions{
  box-sizing:border-box;width:100%;max-width:640px;
  display:flex;align-items:center;gap:14px;margin-top:16px;
}
.view__link{
  font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-2);
  padding-bottom:4px;transition:border-color .2s ease,color .2s ease;
}
.view__link:hover{border-color:var(--ink)}
.view__x{
  position:absolute;right:0;top:-38px;
  appearance:none;border:0;background:none;cursor:pointer;
  font:400 10px/1 var(--mono);letter-spacing:.14em;color:var(--dim);
  padding:6px 0;transition:color .2s ease;
}
.view__x:hover{color:var(--ink)}
/* 左右翻 */
.view__nav{
  position:absolute;top:50%;transform:translateY(-50%);
  appearance:none;border:0;background:none;cursor:pointer;
  width:46px;height:64px;display:grid;place-items:center;
  color:var(--dim);transition:color .2s ease;
}
.view__nav:hover{color:var(--ink)}
.view__nav[disabled]{opacity:.2;cursor:default}
.view__nav--prev{left:-52px}
.view__nav--next{right:-52px}

/* ══ 加载态 ═════════════════════════════════════════════════════ */
.boot{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;
  background:var(--bg);transition:opacity .5s ease;
}
.boot.is-off{opacity:0;pointer-events:none}
.boot__bar{width:120px;height:1px;background:var(--line);overflow:hidden}
.boot__bar i{display:block;height:100%;width:40%;background:var(--ink);
  animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* ══ 窄屏 ═══════════════════════════════════════════════════════ */
@media (max-width:820px){
  .top{padding:16px 18px 0}
  /* 🔴 窄屏三行挤在一行：品牌名 + ROLL 01 + 标题互相压（实测 ROLL 01 落在
     "接触印相 / CONTACT" 右边、标题又折成两行）。
     窄屏**不要**顶栏正中的那卷名字 —— 底部计数器已经说了"第几张"，
     标题在小屏上信息量最低，让位给照片。 */
  .roll{display:none}
  .hud{padding:0 18px calc(14px + env(safe-area-inset-bottom));flex-direction:column;align-items:flex-start;gap:10px}
  .hud__hint{font-size:9.5px}
  /* 窄屏底部信息按两行排：提示在上，进度在下（原来挤成一行、计数器跑出屏宽） */
  .counter{width:100%}
  .rail{width:calc(100% - 84px)}
  .view{padding:44px 16px 28px}
  .view__sheet{padding:11px 11px 34px}
  .view__pic{max-height:calc(100vh - 300px)}
  .view__nav{display:none}          /* 窄屏靠滑动翻页 */
  .view__x{top:-32px}
}
@media (prefers-reduced-motion:reduce){
  .frame__sheet,.view__box,.view{transition-duration:.01ms}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="stage" id="stage">
  <!-- 挂线：顶上两根横梁 + 从梁上垂下来吊住印相带的两根细线。
       它们**随带子一起移动**（JS 每帧改吊点 x），所以"带子是挂着的"有依据。
       纯 SVG，因为这是矢量线条：用 GLSL 画一条 1px 的直线要抗锯齿 + 收边，
       不值得；用 DOM 画又会被 .stage 的 perspective 影响。 -->
  <svg class="rig" id="rig" aria-hidden="true">
    <defs>
      <linearGradient id="rodFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="currentColor" stop-opacity=".55"/>
        <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- 一根横梁（两根挨太近会读成一条粗线，试过） -->
    <line id="railB" x1="0" y1="0" x2="0" y2="0"/>
    <!-- 两根吊线 -->
    <line id="wireL" x1="0" y1="0" x2="0" y2="0"/>
    <line id="wireR" x1="0" y1="0" x2="0" y2="0"/>
  </svg>
  <div class="strip" id="strip"></div>
</div>

<div class="top">
  <div class="brand">
    <div class="brand__name" id="brandName">接触印相<i>/</i>CONTACT</div>
    <div class="brand__meta" id="brandMeta">12 帧 · 精选</div>
  </div>
  <div class="roll">
    <div class="roll__no" id="rollNo">ROLL 01</div>
    <div class="roll__name" id="rollName">—</div>
  </div>
</div>

<div class="hud">
  <div class="hud__hint" id="hint">滚轮 / 拖动沿带走 · ↑↓ 或 ←→ 换帧 · 点一帧看大图</div>
  <div class="counter">
    <div class="rail"><div class="rail__dot" id="railDot"></div></div>
    <b id="curNo">01</b><span>/</span><span id="curTotal">12</span>
  </div>
</div>

<div class="view" id="view" aria-hidden="true">
  <div class="view__box">
    <button class="view__x" id="viewX" type="button">关闭 ESC</button>
    <div class="view__title" id="viewTitle">—</div>
    <div class="view__sub" id="viewSub">—</div>
    <button class="view__nav view__nav--prev" id="viewPrev" type="button" aria-label="上一张">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12.5 4 6.5 10l6 6"/></svg>
    </button>
    <div class="view__sheet">
      <img class="view__pic" id="viewPic" alt="">
      <div class="view__cap"><span id="viewCapNo">—</span><span id="viewCapMeta">—</span></div>
    </div>
    <button class="view__nav view__nav--next" id="viewNext" type="button" aria-label="下一张">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7.5 4l6 6-6 6"/></svg>
    </button>
    <p class="view__desc" id="viewDesc" style="margin-top:16px"></p>
    <div class="view__tags" id="viewTags"></div>
    <div class="view__actions">
      <a class="view__link" id="viewLink" href="#" target="_blank" rel="noopener noreferrer">在 Pixabay 上看 ↗</a>
    </div>
  </div>
</div>

<div class="boot" id="boot"><div class="boot__bar"><i></i></div></div>

<script>
/* ============================================================================
 * 接触印相 · CONTACT SHEET
 *
 * 一间摄影房的空间语言：**一条印相带**。
 * 为什么不是卡片墙、不是环、不是隧道 —— 房间之间不能撞车：
 *   career  = 纵向隧道（序列）
 *   craft   = 环形展板（并列）
 *   posts   = 一条长卷（长度）
 *   ai      = 弧形卡片墙（收藏）
 *   music   = 一件实物（时间）
 *   gallery = **一条带子**（连续性）—— 照片之间没有先后，但一卷胶片是连续拍下来的，
 *             帧与帧紧挨着，扫过去才看得出"同一个人的眼睛"。
 *
 * 三个设计决定：
 *   1. **每帧按真实画幅排**（3:4 竖 / 4:3 / 16:9 横），不是统一比例的方格。
 *      统一方格 = 把照片当成缩略图；真实画幅才对得起"照片"这件事。
 *   2. **带子在深度里起伏**（每帧一点点 z 偏移 + 倾斜），所以拖动时是"翻过去"，
 *      不是"横向滚动"。透视由 .stage 的 perspective 给。
 *   3. **点一帧 = 把它从带上抬起来**：大图 + 展签（标题/画幅/日期/tags）。
 *      相纸永远是纸的，只有屋子跟着深浅色变 —— 浅色不是把深色反相。
 * ========================================================================== */

const $ = (id) => document.getElementById(id);
let theme = stageEnv.theme, lang = stageEnv.lang;

/* ---------------------------------------------------------------- 文案 */
const I18N = {
  zh: {
    title: '接触印相 · CONTACT SHEET — 一间摄影房',
    desc: '一条悬在暗房里的接触印相带：十二帧按真实画幅（3:4 / 4:3 / 16:9）排在透视深处，滚轮或拖动沿带走，点一帧把它抬起来看大图与展签。照片来自 Pixabay，构建时抓取。纯 CSS 3D + canvas，没有一张占位图。',
    brand: '接触印相<i>/</i>CONTACT',

    close: '关闭 ESC',
    link: '在 Pixabay 上看',
    frames: (n) => `${String(n).padStart(2, '0')} 帧`,

  en: {

    desc: 'A contact strip hung in the darkroom: twelve frames at their true aspect ratios (3:4 / 4:3 / 16:9) arranged in depth. Wheel or drag to travel along it, click a frame to lift it and read the label. Photos from Pixabay, fetched at build time. Pure CSS 3D + canvas.',
    brand: 'CONTACT',
    roll: 'ROLL 01',
    rollName: (n) => `${n} frames · one roll`,
    meta: 'ZEO · PHOTOGRAPHY',
    hint: 'Wheel / drag to travel · ↑↓ or ←→ to step · click a frame',
    close: 'Close ESC',
    link: 'View on Pixabay',
    frames: (n) => `${String(n).padStart(2, '0')} frames`,
  },
};
let L = I18N[lang];

/* ---------------------------------------------------------------- 数据来源
 * 构建产物：npm run data:photos ⇒ public/data/pixabay-aispin.json
 * 页面**不碰** pixabay 接口 / 不爬页面 —— 只读这份同源静态 JSON。
 * 拉不到就退回到一组"没有内容"的占位帧（明确告诉用户，而不是假装有作品）。
 */
const DATA_URL = '../../../data/pixabay-aispin.json';

/* ---------------------------------------------------------------- 状态 */
const stageEl = $('stage');
const stripEl = $('strip');
const rigEl = $('rig');
const viewEl = $('view');
let FRAMES = [];         // { id, title, desc, tags, url, src, w, h, ... }
let cur = 0;
let travel = 0;          // 连续位置（帧），cur = Math.round(travel)
let target = 0;

/* ---------------------------------------------------------------- 布局常量
 * 带子是**斜着挂在空间里**的：每帧按序号沿 x 前进、沿 z 起伏、微微转一点。
 * 数值不是随手挑的 —— 要保证相邻两帧在屏幕上不重叠（重叠就变成"卡片堆"了）。
 */
const LAY = {
  /* 帧间空隙（px）。接触印相的帧是**紧挨着**的 —— 但这里必须留够：
     帧有 rotateY，转过去的角会伸到盒宽之外；而且远帧 z 更小 ⇒ 透视把它**放大**
     （近大远小反过来读就是"远处也占地方"）。留 14px 时实测相邻帧压在一起，
     12 帧里能看到 4 处重叠。60px 才在 1280 宽下完全不叠。 */
  air: 60,
  bob: 26,         // 竖直起伏的幅度：带子是波浪，不是直线
  depth: 105,      // 每远一帧就往后退多少 z（透视自己会缩小它）
  tilt: 6,         // 每远一帧转多少 yaw
};

/* 视口参数：由 resize 写 */
let VW = 0, VH = 0;

/* ---------------------------------------------------------------- 暗房
 * 背景不是"铺一层渐变"——那只是壁纸，撑不起空间。
 * 这里是**一间房**，用三层叠出来：
 *   ① GLSL 画的房间本身：透视地面（地砖往远处收）、后墙、从顶上打下来的一束光锥、
 *      空气里的尘埃（随带子移动产生视差）、暗角。
 *   ② SVG 画的**挂线**：顶上两根横梁 + 两条从梁上垂下来吊住印相带的细线，
 *      它们随带子一起移动 —— 于是"带子是挂着的"这件事有了依据。
 *   ③ 帧自己的 z 递退 + .stage 的 perspective：印相带在房间的深度里。
 * 三层各管一件事，缺一层都能明显看出"平"。
 */
let gl, glProg, glU = {}, glCanvas;
const VERT = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;

const FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform float uLight;   /* 0 = 暗房（深色）, 1 = 明室（浅色） */
uniform float uTravel;  /* 带子走到第几帧（连续），用来做视差 */

/* 一个便宜但够用的哈希噪声 */
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a = hash(i), b = hash(i+vec2(1,0));
  float c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  /* 以画面中心为原点的纵横比校正坐标 */
  vec2 p = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;

  /* ── 地平线 ──
     深色：0.02，地面只占画面下方一条，剩下的空间留给光锥和尘。
     🔴 浅色：**-1.2，等于没有地面**。试过 -0.30（一条深色地板压在底部）
     和 0.055（一片亮格子地毯）、浅地砖 0.80 / 0.76 两档压暗 —— 都不行：
     浅色下这块地面要么太亮压照片、要么太暗像一条黑边。明室的照片应该
     "挂在墙上"，而不是"摆在地上"，所以干脆不要地面。 */
  float horizon = mix(0.02, -1.2, uLight);

  /* ───────── 后墙 ─────────
     暗房不是全黑：墙要有一点点来自光锥的反射，远到近有个极缓的梯度。 */
  vec3 wallDark  = vec3(0.055, 0.048, 0.050);
  /* 墙 0.94（不是纸色的 0.968）：比相纸白一档还不够，墙必须**比纸暗**，
     印相才浮得起来。相纸浅色下是 #FFFCF6 ≈ 0.996。 */
  vec3 wallLight = vec3(0.930, 0.896, 0.846);
  vec3 wall = mix(wallDark, wallLight, uLight);
  /* 墙面质感：暗房里是显影液的水渍，明室里是纸张的纤维。
     浅色下单纯一层噪声会显脏，所以再叠一组**极细的竖纹**（纤维方向），
     让它读成"纸"而不是"灰"；深色下只要低频斑驳就够。 */
  float blot = noise(p * 2.6 + vec2(uTravel * 0.02, 0.0)) * 0.5
             + noise(p * 6.1) * 0.25;
  float fiber = noise(vec2(p.x * 46.0, p.y * 3.2)) * 0.5
              + noise(vec2(p.x * 128.0, p.y * 7.0)) * 0.25;
  float grain = mix(blot, blot * 0.55 + fiber * 0.45, uLight);
  wall *= 1.0 + (grain - 0.375) * mix(0.35, 0.16, uLight);
  /* 后墙比画面顶端更深一点（离光锥远） */
  wall *= mix(1.0, 0.72, smoothstep(0.05, 0.62, p.y));

  vec3 col = wall;

  /* ───────── 地面 ─────────
     p.y < horizon 的部分是地面。用 1/(horizon - y) 做透视压缩：
     越靠近地平线，砖缝越密 —— 这就是"地在前方延伸"的全部秘密。 */
  if (p.y < horizon) {
    float d = horizon - p.y;                    /* 0 在地平线，越大越近 */
    float z = 1.0 / max(d, 0.0015);             /* 深度 */
    /* 纵向往远处收的砖缝 */
    /* 缝要**细**。第一版 smoothstep(0.62,1.0) ⇒ 缝占格子宽度的 19%，
       浅色下就成了"白色磨砂玻璃上的粗灰条"。收到 0.90 起 ⇒ 只有 5%。 */
    float rows = z * 0.85;
    float ribR = smoothstep(0.90, 1.0, abs(fract(rows) - 0.5) * 2.0);
    /* 横向缝：等距的线，被透视压扁 */
    float cols = p.x * z * 0.42;
    float ribC = smoothstep(0.93, 1.0, abs(fract(cols) - 0.5) * 2.0);
    float seam = max(ribR, ribC);
    /* 缝本身会随距离变细：远到一定程度就交给雾气，不然会有摩尔纹 */
    seam *= smoothstep(46.0, 6.0, z);

    /* 浅色地面别用 0.885 —— 那比墙（0.962）暗不了多少，但砖缝一加就成了一片
       亮格子地毯，把照片压住了。压到 0.80，让地面明显比墙暗一档。 */
    vec3 floorDark  = vec3(0.030, 0.026, 0.028);
    vec3 floorLight = vec3(0.760, 0.722, 0.666);
    vec3 floorCol = mix(floorDark, floorLight, uLight);
    /* 靠近地平线的地面要更暗/更亮地"糊"过去，别出现一条硬线 */
    floorCol *= 1.0 - mix(0.55, 0.80, uLight) * smoothstep(mix(0.16, 0.30, uLight), 0.0, d);
    /* 深色下缝是**亮**的（光从缝里透出来），浅色下缝只能是**暗**的细线 */
    floorCol *= 1.0 - seam * mix(0.0, 0.16, uLight);
    floorCol *= 1.0 + seam * mix(1.05, 0.0, uLight);
    /* 地面和墙在地平线处融合 —— 用 0.012 的窄带做抗锯齿 */
    float blend = smoothstep(0.0, 0.012, d);
    col = mix(wall, floorCol, blend);
  }

  /* ───────── 光锥 ─────────
     顶上一盏灯斜着打下来，照亮带子所在的那一带。
     用"两个三角形的交"做一个软锥：不要硬边，硬边像贴纸。 */
  vec2 lampAt = vec2(-0.02 + uTravel * 0.004, 0.78);   /* 灯在天花板偏后 */
  vec2 dir = p - lampAt;
  /* 锥角：往下 26° 左右张开 */
  float ang = atan(dir.x, -dir.y);          /* 0 = 正下方 */
  float cone = exp(-ang * ang * 22.0);
  /* 沿灯到地面的距离衰减 */
  float reach = exp(-length(dir) * 1.15);
  float beam = cone * reach;

  /* 灯本身（一个很柔的亮点，别做成"太阳"） */
  float bulb = exp(-length(p - lampAt) * 26.0);

  /* 光色：暗房是安全灯（偏红），明室是白炽灯的暖白 */
  vec3 lampCol = mix(vec3(0.95, 0.44, 0.28), vec3(1.0, 0.93, 0.80), uLight);
  /* 浅色下这团灯曾经把后墙洗成一块白（0.962 的纸色 + 0.30 的光 ⇒ 溢出）。
     明室的灯只要"看得出有光源"就够，不要真的照亮整面墙。 */
  col += lampCol * beam * mix(0.30, 0.07, uLight);
  col += lampCol * bulb * mix(0.55, 0.14, uLight);

  /* ───────── 尘埃 ─────────
     空间感最便宜的来源：空气里看得见的浮尘。但**尺度必须很小**：
     第一版 size=0.06~0.15、阈值 0.82，结果是一屏十几像素的虚团，
     读起来是"下雪"不是"浮尘"，还把照片压住了。
     现在：格子更密、点更小、只留 6% 的格子，并且**只在光锥里才亮**
     —— 这才是"看得见空气"，而不是"画了一堆圆"。 */
  /* ⚠️ 两组就够，别三组：三组各自 6% 的命中率叠起来是 ~17% 的格子有尘，
     一屏几十颗，还是"雪"。两组 + 0.975 阈值 ⇒ ~5%。
     而且尘**必须靠光锥点亮**：暗处那 95% 的格子不应该有任何贡献。 */
  float dust = 0.0;
  for (int k = 0; k < 2; k++) {
    float fk = float(k);
    float sc = 40.0 + fk * 34.0;
    vec2 off = vec2(uTravel * (0.11 + fk * 0.09), uTime * (0.008 + fk * 0.005));
    vec2 q = p * sc + off;
    vec2 cell = floor(q);
    vec2 f = fract(q) - 0.5;
    float rnd = hash(cell + fk * 17.0);
    if (rnd > 0.975) {
      float size = 0.28 + 0.20 * (rnd - 0.975) / 0.025;
      dust += smoothstep(size, 0.0, length(f)) * (0.3 + 0.7 * rnd);
    }
  }
  float dustLit = 0.04 + beam * 2.6 + bulb * 0.4;
  vec3 dustCol = mix(vec3(1.0, 0.88, 0.76), vec3(0.38, 0.30, 0.22), uLight);
  col += dustCol * dust * mix(0.26, 0.14, uLight) * dustLit;

  /* ───────── 顶光 ─────────
     浅色明室里没有光锥，但得有"光从上面来"这件事，否则整面墙是均匀的纸，
     更空。用一条从顶部往下衰减的柔光带。深色下这层关掉（有光锥就够）。 */
  float topLight = exp(-(0.52 - p.y) * 2.6) * uLight;
  col += vec3(1.0, 0.97, 0.90) * topLight * 0.055;

  /* ───────── 暗角 ───────── */
  /* 浅色下暗角要更狠（0.30 → 0.46）：地面是竖着延伸到画面底边的，
     不压的话右下角一片发白，照片就"泡"在光里。 */
  float vig = 1.0 - mix(0.62, 0.46, uLight) * smoothstep(0.34, 1.12, length(p * vec2(0.90, 1.0)));
  col *= vig;

  /* ───────── 胶片颗粒 ─────────
     固定图案会"爬"，所以带时间偏移，但只偏移一点（大片颗粒会闪）。 */
  float g = hash(gl_FragCoord.xy + fract(uTime) * 61.0);
  col += (g - 0.5) * mix(0.026, 0.013, uLight);

  gl_FragColor = vec4(col, 1.0);
}`;

function initGL() {
  glCanvas = $('gl');
  gl = glCanvas.getContext('webgl', { antialias: false, alpha: false });
  if (!gl) return;
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  glProg = gl.createProgram();
  gl.attachShader(glProg, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(glProg);
  gl.useProgram(glProg);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(glProg, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  glU.res = gl.getUniformLocation(glProg, 'uRes');
  glU.time = gl.getUniformLocation(glProg, 'uTime');
  glU.light = gl.getUniformLocation(glProg, 'uLight');
  glU.travel = gl.getUniformLocation(glProg, 'uTravel');
  resizeGL();
}

function resizeGL() {
  if (!gl) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
  if (glCanvas.width !== w || glCanvas.height !== h) {
    glCanvas.width = w; glCanvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

/* ---------------------------------------------------------------- 造帧
 * 每帧一个 <button>（可聚焦、可 Enter），里面是相纸 + 画面 + 展签。
 * 画面用 CSS background —— 不预加载、不用 <img>，滚到哪儿加载到哪儿，
 * 12 张图加起来几 MB，一上来全 load 会把首屏拖死。
 */
function ratioOf(f) {
  if (f.w && f.h) return f.w / f.h;
  return 3 / 2;
}
/* 真实画幅收进两个"档"：竖的封顶 3:4、横的封顶 16:9。
 * 不收的话 8064×6048 那种会占掉半屏，带子的节奏就断了。 */
function framedRatio(f) {
  const r = ratioOf(f);
  if (r < 0.75) return 0.75;
  if (r > 1.78) return 1.78;
  return r;
}

/* 基准尺寸按视口高矮给一档：窄屏（竖着拿的手机）帧太小会像缩略图，
   撑不满屏宽的一半。用一个换算系数，不要写两套布局。 */
const BASE_H = Math.round(Math.min(230, Math.max(178, innerHeight * 0.29)));
const BASE_W = Math.round(BASE_H * 1.39);

function buildFrames() {
  stripEl.innerHTML = '';
  FRAMES.forEach((f, i) => {
    const r = framedRatio(f);
    /* 竖幅定高、横幅定宽 —— 这样"竖的照片高、横的照片宽"，视觉重量才均衡 */
    const h = BASE_H;
    const w = Math.round(h * r);
    const el = document.createElement('button');
    el.className = 'frame';
    el.type = 'button';
    el.dataset.i = String(i);
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    /* 锚点 = 自身中心（见 .frame 的注释） */
    el.style.left = (-w / 2) + 'px';
    el.style.top = (-h / 2) + 'px';
    el.setAttribute('aria-label', `${i + 1}. ${f.title || '照片'}`);
    el.innerHTML =
      `<span class="frame__sheet">` +
        `<span class="frame__pic" style="background-image:url('${f.preview || f.image}')"></span>` +
        `<span class="frame__tag"><b>${String(i + 1).padStart(2, '0')}</b>` +
        `<span>${ratioLabel(r)}</span></span>` +
      `</span>`;
    /* 拖动结束浏览器会补一次 click —— 先问一句，别让"手滑"变成误点。
       阈值 8px 和 `_pager.js` 的 clickSlop 一致；350ms 之外算"另一次意图"。 */
    el.addEventListener('click', () => {
      if (dragMoved > 8 && performance.now() - dragEndAt < 350) return;
      openView(i);
    });
    stripEl.appendChild(el);
  });
}

function ratioLabel(r) {
  if (Math.abs(r - 0.75) < 0.01) return '3:4';
  if (Math.abs(r - 1) < 0.01) return '1:1';
  if (Math.abs(r - 4 / 3) < 0.01) return '4:3';
  if (Math.abs(r - 1.78) < 0.01) return '16:9';
  return `${r.toFixed(2)}:1`;
}

/* ---------------------------------------------------------------- 摆位
 * 每帧：沿 x 前进（按各自的宽度累加，不是固定间距 —— 横片占更多位置）、
 * 沿 z 起伏、按序号倾斜。焦点帧略微放大并提到最近。
 */
/* 一帧在"带子坐标"上的宽度份额：自已半宽 + 下一帧半宽 + 空隙。
   帧宽不等（竖 3:4 / 横 16:9），所以位置表不能用固定步长。 */
function stepAt(i, frames) {
  const a = frames[i].offsetWidth || BASE_W;
  const b = (frames[i + 1] || frames[0]).offsetWidth || BASE_W;
  return (a + b) / 2 + LAY.air;
}

/** 整圈周长 */
function circumference(frames) {
  let s = 0;
  for (let i = 0; i < frames.length; i++) s += stepAt(i, frames);
  return s;
}

/** 带子坐标 → 屏幕 x（相对视口中心）。
 *  带子是**环**：`u` 以"帧"为单位，可以是小数、可以为负、可以超过 n。
 *  先把 u 折回 [0, n)，再沿环累加步长 —— 不走"最近一侧"那套判断，
 *  那套在跨过接缝时会出现 ±半圈 的跳变（第一版就跳了）。 */
function stripX(u, frames, C) {
  const n = frames.length;
  let m = ((u % n) + n) % n;          // [0, n)
  let x = 0;
  let i = 0;
  while (m >= 1) { x += stepAt(i, frames); m -= 1; i = (i + 1) % n; }
  x += stepAt(i, frames) * m;
  return x;
}

function layout(dt) {
  const frames = [...stripEl.children];
  if (!frames.length) return;

  /* 平滑跟到目标 */
  const k = 1 - Math.exp(-dt / 130);
  travel += (target - travel) * k;
  if (Math.abs(target - travel) < 0.0008) travel = target;

  cur = Math.round(travel);
  const rect = stageEl.getBoundingClientRect();
  VW = rect.width; VH = rect.height;

  const n = frames.length;
  const C = circumference(frames);
  const ox = stripX(travel, frames, C);   // 视口中心此刻对着带子上的哪个 x

  frames.forEach((el, i) => {
    /* 环上的**最短**位移（帧为单位）—— 决定远近、倾斜、透明度 */
    let d = i - travel;
    while (d > n / 2) d -= n;
    while (d < -n / 2) d += n;

    /* 屏幕 x：沿环算，并且挑"离 ox 最近的那个等价位置"（差 ±一整圈） */
    let x = stripX(i, frames, C) - ox;
    if (x > C / 2) x -= C;
    if (x < -C / 2) x += C;

    /* 起伏：波浪，不是直线 */
    const y = Math.sin((i + travel * 0.3) * 0.8) * LAY.bob;
    /* 深度：离焦点越远越退后（最多退 320px），焦点最近 */
    const z = -Math.min(320, Math.abs(d) * LAY.depth);
    /* 倾斜：远处斜，近处正（上限 ±18°，再多就成了"卡片扇"） */
    const ry = Math.max(-18, Math.min(18, -d * LAY.tilt));
    /* 焦点放大：用一个窄的高斯，避免"整条带子都在缩放" */
    const focus = Math.exp(-(d * d) * 1.35);
    const sc = 1 + 0.06 * focus;
    const op = Math.max(0.3, 1 - Math.abs(d) * 0.14);

    el.style.transform =
      `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, ${z.toFixed(1)}px) ` +
      `rotateY(${ry.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
    el.style.opacity = op.toFixed(3);
    el.style.zIndex = String(1000 - Math.round(Math.abs(d) * 10));
    el.classList.toggle('is-active', i === ((cur % n) + n) % n);
  });

  paintRig(frames, xsFromLoop(frames));
  paintHUD();
}

/** 每帧的"带子坐标 x"（相对视口中心的屏幕 x），给挂线用。
 *  复用 layout 里的那套环计算 —— 不要另写一份，否则线会飘。 */
function xsFromLoop(frames) {
  const n = frames.length;
  const C = circumference(frames);
  const ox = stripX(travel, frames, C);
  const out = [];
  for (let i = 0; i < n; i++) {
    let x = stripX(i, frames, C) - ox;
    if (x > C / 2) x -= C;
    if (x < -C / 2) x += C;
    out.push(x);
  }
  return out;
}

/** 挂线：两根横梁 + 两根从梁上吊住**当前焦点帧**的细线。
 *  只吊焦点帧（不是每帧都吊）—— 每帧都吊会变成"晾衣绳"，画面立刻乱。
 *  吊点的 x 跟着焦点帧走，所以走带子时线跟着滑，空间就活了。 */
function paintRig(frames, xs) {
  if (!rigEl) return;
  const i = Math.max(0, Math.min(frames.length - 1, cur));
  /* 焦点帧在屏幕上的中心（视口坐标） */
  const cx = VW / 2 + xs[i];
  /* 焦点帧顶部（它是 translate 到 strip 原点上的） */
  const fh = frames[i].offsetHeight || BASE_H;
  const top = VH / 2 - 10 - fh / 2;

  /* 横梁：贴在帧顶上方 46px，留出吊线的一点长度（太近就看不出是"吊"的） */
  const yB = Math.max(20, top - 46);
  const pad = Math.max(48, VW * 0.06);

  setLine('railB', pad, yB, VW - pad, yB);
  /* 两根吊线挂在焦点帧左右各 26% 宽处，垂到帧顶 */
  const half = Math.max(24, (frames[i].offsetWidth || BASE_W) * 0.26);
  setLine('wireL', cx - half, yB, cx - half, top);
  setLine('wireR', cx + half, yB, cx + half, top);
}

function setLine(id, x1, y1, x2, y2) {
  const el = document.getElementById(id);
  if (!el) return;
  el.setAttribute('x1', x1.toFixed(1));
  el.setAttribute('y1', y1.toFixed(1));
  el.setAttribute('x2', x2.toFixed(1));
  el.setAttribute('y2', y2.toFixed(1));
}

function paintHUD() {
  if (!FRAMES.length) return;
  const i = Math.max(0, Math.min(FRAMES.length - 1, cur));
  $('curNo').textContent = String(i + 1).padStart(2, '0');
  $('curTotal').textContent = String(FRAMES.length).padStart(2, '0');
  $('railDot').style.left = `${(i / Math.max(1, FRAMES.length - 1)) * 100}%`;
  const f = FRAMES[i];
  if (f) $('rollName').textContent = f.title || L.rollName(FRAMES.length);
}

/* ---------------------------------------------------------------- 主循环 */
let last = performance.now();
function frame(now) {
  const dt = Math.min(64, now - last);
  last = now;
  layout(dt);
  if (gl && glProg) {
    gl.uniform2f(glU.res, glCanvas.width, glCanvas.height);
    gl.uniform1f(glU.time, now * 0.001);
    gl.uniform1f(glU.light, theme === 'light' ? 1 : 0);
    gl.uniform1f(glU.travel, travel);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- 交互
 * 滚轮 / 拖动 / ←→ ↑↓ / 点帧。
 * 🔴 滚轮**只在这个房间里换帧**：这里没有可滚的内容（整页 overflow:hidden），
 * 所以不存在"和列表抢滚轮"的问题。触屏走 pointer 拖动，不碰 wheel。
 */
/* 滚轮 / 方向键交给 `_pager.js`（判据与文稿房间、实验环、`useWheelPager` 逐字
   相同 —— 全站一份）。
   原来这里是自己写的「一格一帧」：`deltaY` 攒够 340px 走一格，开头加了 90ms
   冷却想兜惯性 —— 但 90ms **比一次触控板手势短得多**，惯性那几十个事件照样
   每个都能推进，实测一划就是 2~3 帧。这条路本身是错的：`wheel` 不是
   "一次手势 = 一个事件"，判据必须看**幅度曲线的形状**（见 `_pager.js` 文件头
   那四条），不能看时间。
   🔴 它也顺手解决了 `setPointerCapture` 的坑：一旦捕获，随后的 click 会派到
   捕获元素上，`.frame` 的点击永远收不到（表现为"点帧不开浮层"）。

   🔴 **拖动不走 pager**，这里自己实现「连续跟手」。
   `_pager.js` 的拖动是"每 stepPx(140) 走一格"——那是折带/环的语义（拖够一格
   翻一页）。摄影房是一条**连续的**带子，拖起来应该像手在扒胶片：位移多少，
   带子就走多少，松手停在哪就是哪。两种语义没法共用一套代码，这正是
   `useWheelPager` 注释里写的"拖动是每个房间自己实现"。 */

const pager = createPager({
  target: stageEl,
  enabled: () => !viewEl.classList.contains('is-on'),
  onStep: (dir) => step(dir),
  /* 拖动**不注册**给 pager（`dragSelector` 不传）——
     见上面那段说明，拖动是连续跟手，不是一格一格。 */
});

/* 连续拖动：位移 → 连续位置（不是离散的帧号）。
   一帧大约 300px（帧宽 + 空隙），所以 300px 的位移正好走一帧。 */
let drag = null;
stageEl.addEventListener('pointerdown', (e) => {
  if (viewEl.classList.contains('is-on')) return;
  if (e.button != null && e.button !== 0) return;
  drag = { x: e.clientX, from: target, moved: 0 };
  stageEl.classList.add('is-drag');
  /* 🔴 不 setPointerCapture：捕获后 click 会派到 stage 上，
     `.frame` 的点击就永远收不到（"点帧不开浮层"）。改挂 window。 */
});
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  drag.moved = Math.max(drag.moved, Math.abs(dx));
  /* 往左拖 = 往后走（带子往左移） */
  target = clamp(drag.from - dx / 300, 0, FRAMES.length - 1);
});
/* 拖动结束后浏览器会补一次 click（落在起手那一帧上）——
   记下"刚才这一下拖了多远 + 什么时候松的手"，让点击判据自己去比时间。
   不用定时器清标记：那种写法要多一个永不停止的 setInterval，
   而且"多久算过去"反过来变成又一条要调的时间常数。 */
let dragMoved = 0;
let dragEndAt = 0;
function endDrag() {
  if (!drag) return;
  dragMoved = drag.moved;
  dragEndAt = performance.now();
  drag = null;
  stageEl.classList.remove('is-drag');
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function step(d) {
  target = clamp(Math.round(target) + d, 0, FRAMES.length - 1);
}

/* 方向键由 `_pager.js` 管（房间内）。这里只补两件它不管的事：
   浮层里的 Esc / 左右翻页，和房间里的 Enter 开图。 */
addEventListener('keydown', (e) => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (viewEl.classList.contains('is-on')) {
    if (e.key === 'Escape') { closeView(); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { stepView(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { stepView(-1); e.preventDefault(); }
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openView(cur); }
});

/* ---------------------------------------------------------------- 大图浮层 */
let viewIdx = -1;
function openView(i) {
  if (!FRAMES.length) return;
  viewIdx = clamp(i, 0, FRAMES.length - 1);
  target = viewIdx;
  renderView();
  viewEl.classList.add('is-on');
  viewEl.setAttribute('aria-hidden', 'false');
}
function closeView() {
  viewEl.classList.remove('is-on');
  viewEl.setAttribute('aria-hidden', 'true');
}
function stepView(d) {
  const next = viewIdx + d;
  if (next < 0 || next >= FRAMES.length) return;
  viewIdx = next;
  target = next;
  renderView();
}
function renderView() {
  const f = FRAMES[viewIdx];
  if (!f) return;
  const img = $('viewPic');
  img.src = f.image || f.preview;
  img.alt = f.title || '';
  /* 浮层里也用真实画幅：JS 把宽高写进去，CSS 只负责"别超屏" */
  if (f.w && f.h) { img.width = f.w; img.height = f.h; }
  else { img.removeAttribute('width'); img.removeAttribute('height'); }

  $('viewTitle').textContent = f.title || '—';
  $('viewSub').textContent = `${String(viewIdx + 1).padStart(2, '0')} / ${String(FRAMES.length).padStart(2, '0')} · ${(f.publishedAt || '').slice(0, 7)}`;
  $('viewDesc').textContent = f.desc || '';
  $('viewCapNo').innerHTML = `<b>${f.title || ''}</b>`;
  $('viewCapMeta').textContent = f.w && f.h ? `${f.w} × ${f.h}` : ratioLabel(framedRatio(f));
  const tags = $('viewTags');
  tags.innerHTML = '';
  (f.tags || []).slice(0, 6).forEach((t) => {
    const s = document.createElement('span');
    s.textContent = t;
    tags.appendChild(s);
  });
  $('viewLink').href = f.url || '#';
  $('viewPrev').disabled = viewIdx === 0;
  $('viewNext').disabled = viewIdx === FRAMES.length - 1;
}
$('viewX').addEventListener('click', closeView);
$('viewPrev').addEventListener('click', () => stepView(-1));
$('viewNext').addEventListener('click', () => stepView(1));
viewEl.addEventListener('click', (e) => { if (e.target === viewEl) closeView(); });

/* 窄屏在浮层里左右滑翻页 */
let swipeX = 0;
viewEl.addEventListener('pointerdown', (e) => { swipeX = e.clientX; });
viewEl.addEventListener('pointerup', (e) => {
  const dx = e.clientX - swipeX;
  if (Math.abs(dx) < 50) return;
  if (e.target.closest('a,button')) return;
  stepView(dx < 0 ? 1 : -1);
});

/* ---------------------------------------------------------------- 文案 */
function applyCopy() {
  document.title = L.title;
  const d = document.querySelector('meta[name="description"]');
  if (d) d.setAttribute('content', L.desc);
  $('brandName').innerHTML = L.brand;
  $('brandMeta').textContent = L.meta;
  $('rollNo').textContent = L.roll;
  $('hint').textContent = L.hint;
  $('viewX').textContent = L.close;
  $('viewLink').textContent = L.link + ' ↗';
  paintHUD();
}
stageEnv.onChange(({ theme: t, lang: l }) => {
  theme = t; lang = l; L = I18N[l];
  applyCopy();
  resizeGL();
});

addEventListener('resize', () => { resizeGL(); });

/* ---------------------------------------------------------------- 启动 */
async function boot() {
  initGL();
  await loadFrames();
  buildFrames();
  applyCopy();
  requestAnimationFrame((t) => { last = t; frame(t); });
  $('boot').classList.add('is-off');
}

async function loadFrames() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    const raw = Array.isArray(data.latestPhotos) ? data.latestPhotos : [];
    if (!raw.length) throw new Error('empty');
    FRAMES = raw.map((p) => ({
      id: p.id,
      title: p.title || '',
      desc: p.description || '',
      tags: p.tags || [],
      url: p.url || p.page || '',
      preview: p.preview || p.image || '',
      image: p.image || p.preview || '',
      w: p.width || null,
      h: p.height || null,
      publishedAt: p.publishedAt || '',
      author: (data.user && data.user.name) || '',
    }));
  } catch (err) {
    /* 拿不到就明说 —— 空白墙比假数据诚实 */
    FRAMES = [];
    const meta = $('brandMeta');
    if (meta) meta.textContent = '暂无作品';
  }
}

window.__gallery = {
  get frames() { return FRAMES; },
  get cur() { return cur; },
  get travel() { return travel; },
  get target() { return target; },
  step, openView, closeView, stepView,
  get viewing() { return viewIdx; },
  get isOpen() { return viewEl.classList.contains('is-on'); },
};

boot();
</script>
</body>
</html>
