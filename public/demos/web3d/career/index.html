<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>履历 · 时空隧道 · Textural</title>
<style>
  :root{ --fg:#e9edf5; --dim:#8792a6; --mute:#5a6478; --accent:#8ba3ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#06070c;color:var(--fg);overflow:hidden;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hud > *{pointer-events:auto}

  .brand{
    position:absolute;top:32px;left:40px;
    display:flex;align-items:center;gap:12px;
    font-weight:800;font-size:15px;letter-spacing:-.01em;
  }
  .brand-mark{
    width:32px;height:32px;border-radius:10px;
    background:linear-gradient(135deg,#4f6bff,#a678ff);
    display:grid;place-items:center;font-size:14px;font-weight:900;
    box-shadow:0 8px 28px rgba(79,107,255,.45);
  }
  .brand small{
    display:block;font-size:10.5px;font-weight:600;color:var(--dim);
    letter-spacing:.12em;text-transform:uppercase;margin-top:3px;
  }

  /* 时间刻度 */
  .timeline{
    position:absolute;top:50%;left:40px;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:14px;
  }
  .timeline button{
    display:flex;align-items:center;gap:10px;
    background:none;border:0;padding:0;cursor:pointer;
    color:var(--mute);font-size:11px;letter-spacing:.12em;
    font-weight:700;font-variant-numeric:tabular-nums;
    transition:color .3s;
  }
  .timeline button::before{
    content:"";width:24px;height:1px;
    background:currentColor;opacity:.5;
    transition:width .4s cubic-bezier(.2,.8,.3,1),opacity .3s;
  }
  .timeline button.on{color:var(--accent)}
  .timeline button.on::before{width:48px;opacity:1}
  .timeline button:hover{color:var(--fg)}

  /* 当前卡片详情 */
  .info{
    position:absolute;right:40px;top:50%;transform:translateY(-50%);
    width:280px;
    padding:24px 26px;
    background:rgba(18,22,34,.62);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    transition:opacity .4s;
  }
  .info-date{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;color:var(--accent);margin-bottom:10px;
    font-variant-numeric:tabular-nums;
  }
  .info-title{
    font-size:22px;font-weight:800;letter-spacing:-.02em;
    line-height:1.15;margin-bottom:8px;
  }
  .info-sub{
    font-size:12.5px;font-weight:600;color:var(--dim);
    margin-bottom:16px;line-height:1.5;
  }
  .info-desc{
    font-size:13px;line-height:1.75;color:#b6c0d2;
    padding-top:14px;border-top:1px solid rgba(255,255,255,.08);
  }

  .hint{
    position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:var(--mute);letter-spacing:.05em;
    display:flex;align-items:center;gap:10px;
  }
  .hint::before{
    content:"";width:32px;height:1px;background:currentColor;opacity:.4;
  }
  .scrollbar{
    position:absolute;bottom:0;left:0;height:2px;
    background:linear-gradient(90deg,#4f6bff,#a678ff);
    transition:width .1s linear;
    box-shadow:0 0 12px rgba(120,150,255,.6);
  }

  /* 左栏：时间刻度 + 项目卡（纵向排） */
  .left-col{
    position:absolute;left:40px;top:104px;bottom:44px;
    width:274px;display:flex;flex-direction:column;gap:22px;
  }
  .timeline{position:static;transform:none}

  /* 项目卡 */
  .projects{
    /* 内容少时贴着内容（不要拉成一根长条），多了才在卡片内部滚 */
    flex:0 1 auto;min-height:0;max-height:100%;
    display:flex;flex-direction:column;
    padding:14px 14px 12px;
    background:rgba(18,22,34,.58);
    backdrop-filter:blur(18px) saturate(170%);
    -webkit-backdrop-filter:blur(18px) saturate(170%);
    border:1px solid rgba(255,255,255,.09);
    border-radius:16px;
  }
  .projects-head{
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);font-weight:700;margin-bottom:10px;
  }
  .projects-head b{color:var(--accent);font-size:11px;letter-spacing:.06em}
  .projects-list{
    overflow-y:auto;display:flex;flex-direction:column;gap:8px;
    padding-right:4px;min-height:0;
  }
  .projects-list::-webkit-scrollbar{width:4px}
  .projects-list::-webkit-scrollbar-thumb{background:rgba(139,163,255,.35);border-radius:2px}
  .projects-empty{font-size:11.5px;color:var(--mute);line-height:1.7;padding:6px 2px}
  .proj{
    display:flex;gap:10px;text-align:left;width:100%;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    border-radius:11px;padding:7px;cursor:pointer;color:inherit;
    font-family:inherit;
    transition:background .22s,border-color .22s,transform .22s;
  }
  .proj:hover{
    background:rgba(139,163,255,.13);
    border-color:rgba(139,163,255,.34);
    transform:translateX(2px);
  }
  .proj-thumb{
    width:56px;height:40px;border-radius:7px;overflow:hidden;flex:0 0 auto;
    background:linear-gradient(135deg,#1a2134,#28304a);
    display:grid;place-items:center;
    font-size:8.5px;color:#4f5a70;letter-spacing:.04em;text-align:center;line-height:1.3;
  }
  .proj-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  /* 竖图缩略图同理：留完整形状，别裁成一条 */
  .proj-thumb.is-fit img{object-fit:contain}
  .proj-meta{min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
  .proj-name{
    font-size:12.5px;font-weight:700;line-height:1.3;color:#e9edf5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .proj-sub{font-size:10.5px;color:var(--mute);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 项目详情（全屏） */
  .modal{
    position:fixed;inset:0;z-index:40;display:none;
    padding:36px;background:rgba(4,6,12,.74);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  /* 用 flex 居中而不是 grid+place-items：grid 的 `place-items:center` 会让
     `width:min(980px,100%)` 里的 100% 去解一个**由内容决定**的网格区域，
     实测卡片只拿到 604px（正好是 aspect-ratio 推出来的宽度）。 */
  .modal.open{display:flex;align-items:center;justify-content:center}
  .modal-card{
    position:relative;width:min(980px,100%);max-height:86vh;overflow:auto;
    /* 滚到底别再往父级传（配合 JS 里的 modalOpen() 守卫，双保险） */
    overscroll-behavior:contain;
    background:rgba(15,19,29,.97);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;box-shadow:0 34px 90px rgba(0,0,0,.62);
  }
  .modal-card::-webkit-scrollbar{width:6px}
  .modal-card::-webkit-scrollbar-thumb{background:rgba(139,163,255,.3);border-radius:3px}
  .modal-close{
    position:absolute;top:14px;right:14px;z-index:2;
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    background:rgba(8,10,16,.72);color:#dfe5f0;font-size:15px;line-height:1;
    border:1px solid rgba(255,255,255,.16);
  }
  .modal-close:hover{background:rgba(139,163,255,.28)}
  .modal-hero{
    /* 🔴 用**高度**封顶，不要 `aspect-ratio` + `max-height` —— 后者会让
       宽高比反过来决定宽度（980 的卡里只画出 604 的图，右边留一块暗带）。
       真实高度由 openProject 按图片宽高比算（300~540），这里只是兜底。 */
    width:100%;height:min(420px,50vh);
    display:grid;place-items:center;
    background:linear-gradient(135deg,#141a29,#222b42);
    color:#4b5568;font-size:12.5px;letter-spacing:.1em;
    transition:height .22s ease;
  }
  /* 截图还没到位时别占着 340px 空着 —— 缩成一条窄横幅，正文自然上移。
     图片一加载完就摘掉这个类（见 openProject）。 */
  .modal-hero.is-empty{height:min(150px,20vh)}
  .modal-hero img{width:100%;height:100%;object-fit:cover;display:block}
  /* 竖图（手机 / 小程序截图）不能用 cover —— 2.88:1 的框里只会剩中间一条。
     改成 contain 完整显示，左右空出来的地方用同一张图放大模糊垫底；
     同时把框子拔高，否则 0.56:1 的截图在 340px 里只有 190px 宽。 */
  .modal-hero.is-fit{
    position:relative;height:min(520px,60vh);overflow:hidden;background:#0a0d16;
  }
  .modal-hero.is-fit::before{
    content:'';position:absolute;inset:-40px;z-index:0;
    background-image:var(--shot);background-size:cover;background-position:center;
    filter:blur(26px) saturate(140%) brightness(.5);opacity:.6;
  }
  /* 🔴 必须 absolute 钉死在框上：`height:100%` 在 grid 的自动行里会退回 auto，
     竖图就把行撑到 1739px（978×1920 等比），contain 按**元素**算 ⇒ 又变成裁切。 */
  .modal-hero.is-fit img{
    position:absolute;inset:0;z-index:1;
    width:100%;height:100%;object-fit:contain;
  }
  .modal-body{padding:26px 32px 34px}
  .modal-date{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .modal-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px;line-height:1.2}
  .modal-sub{font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:4px}
  .modal-sec{margin-top:20px}
  .modal-sec h4{
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin:0 0 8px;
  }
  .modal-sec p{font-size:13.5px;line-height:1.85;color:#b6c0d2;margin:0}
  .modal-sec ul{margin:0;padding-left:18px}
  .modal-sec li{font-size:13.5px;line-height:1.85;color:#b6c0d2;margin-bottom:5px}
  .modal-link{
    display:inline-block;margin-top:22px;font-size:12.5px;font-weight:700;
    color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(139,163,255,.4);
    padding-bottom:2px;
  }

  @media (max-width:900px){
    .info{display:none}
    .brand{top:22px;left:22px}
    .left-col{left:20px;top:84px;bottom:28px;width:min(274px,52vw)}
  }
</style>
</head>
<body>

<div id="stage"></div>

<div class="hud">
  <div class="brand">
    <div class="brand-mark">Z</div>
    <div>Zhiyuan Li<small>Scroll to travel</small></div>
  </div>

  <div class="left-col">
    <div class="timeline" id="timeline"></div>

    <div class="projects">
      <div class="projects-head"><span>项目</span><b id="projects-count">0</b></div>
      <div class="projects-list" id="projects-list"></div>
    </div>
  </div>

  <div class="info" id="info">
    <div class="info-date" id="info-date">2021.06 — 至今</div>
    <div class="info-title" id="info-title">字节跳动</div>
    <div class="info-sub" id="info-sub">抖音体验技术团队 · 高级前端工程师</div>
    <div class="info-desc" id="info-desc">负责抖音创作者工具的前端架构。主导 Web 端视频编辑器的性能优化，首屏从 2.3s 降至 0.8s，内存占用减少 40%。</div>
  </div>

  <div class="hint">滚动穿梭时间隧道 · 点左侧项目看详情</div>
</div>
<div class="scrollbar" id="scrollbar" style="width:0%"></div>

<div class="modal" id="modal">
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="关闭">✕</button>
    <div class="modal-hero" id="modal-hero"></div>
    <div class="modal-body">
      <div class="modal-date" id="modal-date"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-sub" id="modal-sub"></div>
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   Textural 简化版 · 生成卡片纹理
   ============================================================================ */
function hash32(s){
  let h = 2166136261 >>> 0;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function texturalCanvas(w, h, cfg){
  const base = document.createElement('canvas');
  base.width = w; base.height = h;
  const ctx = base.getContext('2d');
  const txt = document.createElement('canvas');
  txt.width = w; txt.height = h;
  const tctx = txt.getContext('2d');

  const seed = hash32((cfg.text || '') + cfg.mode);
  const rnd = mulberry32(seed);
  const hue = cfg.hue ?? (seed % 360);

  // 底
  ctx.fillStyle = `hsl(${hue}, 20%, 6%)`;
  ctx.fillRect(0, 0, w, h);

  // 色团
  for(let i = 0; i < 5; i++){
    const cx = rnd() * w, cy = rnd() * h;
    const r = Math.max(w, h) * (0.35 + rnd() * 0.5);
    const hh = hue + (rnd() - 0.5) * 90;
    const l = 10 + rnd() * 12;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `hsla(${hh}, 52%, ${l}%, .55)`);
    g.addColorStop(1, `hsla(${hh}, 52%, ${l}%, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  // 文字纹理
  const raw = String(cfg.text || '').slice(0, 12);
  const minSide = Math.min(w, h);
  const fs = minSide / 8 * (cfg.scale || 1);
  const alpha = 0.075 * (cfg.intensity ?? 0.6) / 0.6;

  tctx.fillStyle = `hsla(${hue}, 30%, 92%, ${alpha})`;
  tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
  tctx.font = `700 ${fs}px system-ui, "PingFang SC", sans-serif`;

  if(cfg.mode === 'hero'){
    const big = minSide * 1.15 / Math.max(raw.length, 1);
    tctx.font = `700 ${big}px system-ui, "PingFang SC", sans-serif`;
    tctx.fillText(raw, w / 2, h / 2);
  } else {
    const tw = Math.max(tctx.measureText(raw).width, fs * 0.6);
    const gx = tw * 2.1, gy = fs * 2.8;
    tctx.save(); tctx.translate(w / 2, h / 2);
    tctx.rotate((rnd() * 2 - 1) * 0.16);
    const cols = Math.ceil(w / gx) + 6, rows = Math.ceil(h / gy) + 6;
    for(let j = -rows; j <= rows; j++){
      for(let i = -cols; i <= cols; i++){
        const offset = (Math.abs(j) % 2) * gx * 0.5;
        const x = i * gx + offset, y = j * gy;
        const dy = cfg.mode === 'flow' ? Math.sin(i * 0.6 + j * 0.4) * gy * 0.15 : 0;
        tctx.fillText(raw, x, y + dy);
      }
    }
    tctx.restore();
  }

  // 模糊合成
  const blurPx = minSide * 0.035 * (cfg.blur ?? 0.3);
  if(blurPx > 0.5 && 'filter' in ctx){
    ctx.filter = `blur(${blurPx.toFixed(1)}px)`;
    ctx.drawImage(txt, 0, 0);
    ctx.filter = 'none';
  } else {
    ctx.drawImage(txt, 0, 0);
  }
  return base;
}

function wrapText(ctx, text, x, y, maxW, lh, maxLines){
  const chars = text.split('');
  let line = '', count = 0;
  for(let i = 0; i < chars.length; i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, y);
      line = chars[i]; count++; y += lh;
      if(maxLines && count >= maxLines - 1){
        let rest = chars.slice(i).join('');
        while(ctx.measureText(rest + '…').width > maxW && rest.length) rest = rest.slice(0, -1);
        ctx.fillText(rest + '…', x, y);
        return;
      }
    } else line = test;
  }
  if(line) ctx.fillText(line, x, y);
}

/* ============================================================================
   数据
   ============================================================================
   真源：`src/data/experiences.json`（项目已经合并进每段履历的 `projects`），
   本目录下的 `experiences.json` 是它的一份拷贝 —— 站点那边改了记得重拷：
       cp src/data/experiences.json public/demos/web3d/career/experiences.json

   每个项目带一个 `image` 字段（`shots/<项目 id>.png`）。截图还没给，所以加载
   失败时会退化成渐变占位块 —— 把图按这个文件名丢进 `shots/` 就自动生效。
   ============================================================================ */
let RESUME = [];

const fmtMonth = (d) => (d ? `${d.slice(0, 4)}.${d.slice(5, 7)}` : '');

/** experiences.json → 卡片字段（与站点 CareerTunnel 的映射同构）。 */
function mapExperiences(list){
  const items = list
    .filter((x) => x.locale === 'zh')
    .sort((a, b) => String(b.startDate || '').localeCompare(String(a.startDate || '')));
  return items.map((x, i) => {
    const end = i === 0 ? '至今' : fmtMonth(items[i - 1].startDate);
    const title = x.company || '';
    return {
      id: x.id,
      start: fmtMonth(x.startDate),
      end,
      title,
      subtitle: [x.position, x.department].filter(Boolean).join(' · '),
      summary: Array.isArray(x.responsibilities) ? x.responsibilities.join(' ') : '',
      text: [...title][0] || '履',
      hue: (i * 137.508 + 212) % 360,
      mode: ['tile', 'flow', 'tile', 'hero'][i % 4],
      blur: 0.35 + (i % 3) * 0.05,
      scale: 1 + (i % 2) * 0.1,
      intensity: 0.65,
      projects: Array.isArray(x.projects) ? x.projects : [],
    };
  });
}

/* ============================================================================
   绘制卡片纹理（含背景 + 文字）
   ============================================================================ */
function drawCard(item, w, h){
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  // 1. Textural 背景
  const bg = texturalCanvas(w, h, item);
  ctx.drawImage(bg, 0, 0);

  // 2. 顶部日期条
  ctx.save();
  ctx.fillStyle = 'rgba(139,163,255,0.85)';
  ctx.font = '700 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`${item.start} — ${item.end}`, 40, 70);
  ctx.restore();

  // 3. 底部渐变遮罩
  const g = ctx.createLinearGradient(0, h * 0.35, 0, h);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.78)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // 4. 文字信息
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#fff';
  ctx.font = '800 44px system-ui, "PingFang SC", sans-serif';
  ctx.fillText(item.title, 40, h - 210);

  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  ctx.font = '600 19px system-ui, "PingFang SC", sans-serif';
  wrapText(ctx, item.subtitle, 40, h - 172, w - 80, 26, 2);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '400 16px system-ui, "PingFang SC", sans-serif';
  wrapText(ctx, item.summary, 40, h - 110, w - 80, 24, 3);

  // 5. 内描边
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, w - 2, h - 2);

  return canvas;
}

/* ============================================================================
   Three.js · 时空隧道
   ============================================================================ */
const stage = document.getElementById('stage');
const W = window.innerWidth, H = window.innerHeight;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070c, 0.028);

const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 300);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.setClearColor(0x06070c, 1);
stage.appendChild(renderer.domElement);

/* ---- 卡片 ---- */
const CARD_W = 3.4;
const CARD_H = 4.8;
const SPACING = 8.5;
const RADIUS = 3.2;

const cards = [];

/** 数据到位后建卡（原来是模块级 forEach，现在要等 fetch）。 */
function buildCards(){
RESUME.forEach((item, i) => {
  const texCanvas = drawCard(item, 680, 960);
  const tex = new THREE.CanvasTexture(texCanvas);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const geom = new THREE.PlaneGeometry(CARD_W, CARD_H);
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    side: THREE.DoubleSide,
    fog: true
  });
  const mesh = new THREE.Mesh(geom, mat);

  // 螺旋隧道位置
  const angle = i * 1.15;
  const z = -i * SPACING - 5;
  mesh.position.set(
    Math.cos(angle) * RADIUS,
    Math.sin(angle) * RADIUS * 0.55,
    z
  );

  // 朝向隧道中心轴 + 稍微朝外倾
  mesh.lookAt(0, 0, z);
  mesh.rotateZ(Math.sin(angle) * 0.15);

  scene.add(mesh);
  cards.push({ mesh, data: item, idx: i, baseZ: z, angle });
});
  zEnd = -(RESUME.length - 1) * SPACING - 5 + 4;
}

/* ---- 光点 ---- */
const dotCount = 600;
const dotGeom = new THREE.BufferGeometry();
const dotPos = new Float32Array(dotCount * 3);
const dotColors = new Float32Array(dotCount * 3);
for(let i = 0; i < dotCount; i++){
  const a = Math.random() * Math.PI * 2;
  const r = RADIUS * (0.9 + Math.random() * 0.3);
  dotPos[i*3] = Math.cos(a) * r;
  dotPos[i*3+1] = Math.sin(a) * r * 0.55;
  dotPos[i*3+2] = -Math.random() * ((RESUME.length || 8) + 4) * SPACING;

  const c = new THREE.Color().setHSL(0.6 + Math.random() * 0.15, 0.8, 0.6 + Math.random() * 0.3);
  dotColors[i*3] = c.r;
  dotColors[i*3+1] = c.g;
  dotColors[i*3+2] = c.b;
}
dotGeom.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
dotGeom.setAttribute('color', new THREE.BufferAttribute(dotColors, 3));
const dotMat = new THREE.PointsMaterial({
  size: 0.06,
  vertexColors: true,
  transparent: true,
  opacity: 0.7,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: false
});
const dots = new THREE.Points(dotGeom, dotMat);
scene.add(dots);

/* ---- 远景星尘 ---- */
const farCount = 400;
const farGeom = new THREE.BufferGeometry();
const farPos = new Float32Array(farCount * 3);
for(let i = 0; i < farCount; i++){
  farPos[i*3] = (Math.random() - 0.5) * 60;
  farPos[i*3+1] = (Math.random() - 0.5) * 40;
  farPos[i*3+2] = -Math.random() * 260;
}
farGeom.setAttribute('position', new THREE.BufferAttribute(farPos, 3));
const farMat = new THREE.PointsMaterial({
  color: 0x8ba3ff,
  size: 0.08,
  transparent: true,
  opacity: 0.5,
  depthWrite: false,
  fog: false
});
const far = new THREE.Points(farGeom, farMat);
scene.add(far);

/* ============================================================================
   相机控制 · 滚动穿梭
   ============================================================================ */
const zStart = 6;
/** 由 `buildCards()` 按卡片数算出来（数据是异步来的，不能写死）。 */
let zEnd = 0;
let camZ = zStart;
let targetZ = zStart;
let activeIdx = -1;

/* ── 左侧项目列表 ──────────────────────────────────────────────────────
   跟着"当前这张履历"走：滚到哪一段，左边就换成那一段的项目。
   数据里没挂项目的履历给一句说明，不留空白。 */
const projectsListEl = document.getElementById('projects-list');
const projectsCountEl = document.getElementById('projects-count');

/** 截图可能存成 .png / .jpg / .jpeg —— 依次试，全失败才留占位。
 *  🔴 只有 onload 才 append：坏 src 的 <img> 会渲染成一块空白方块并撑布局。 */
function loadShot(src, onOk){
  const alts = [src];
  const m = /\.(png|jpe?g|webp)$/i.exec(src);
  if(m){
    const base = src.slice(0, m.index);
    ['.png', '.jpg', '.jpeg'].forEach((ext) => {
      const s = base + ext;
      if(s !== src) alts.push(s);
    });
  }
  const img = new Image();
  img.alt = '';
  let i = 0;
  img.onload = () => onOk(img);
  img.onerror = () => {
    i += 1;
    if(i < alts.length) img.src = alts[i];
    else img.onerror = null;
  };
  img.src = alts[0];
}

/** 竖图（手机 / 小程序截图）用 contain，横图用 cover。 */
function isPortrait(img){
  return img.naturalWidth / Math.max(1, img.naturalHeight) < 1.25;
}

function projectSub(p){
  const span = [fmtMonth(p.startDate), p.endDate ? fmtMonth(p.endDate) : '至今'].join(' — ');
  return [p.role, span].filter(Boolean).join(' · ');
}

function renderProjects(idx){
  const item = RESUME[idx];
  const list = (item && item.projects) || [];
  projectsCountEl.textContent = String(list.length);
  projectsListEl.innerHTML = '';

  if(!list.length){
    const empty = document.createElement('div');
    empty.className = 'projects-empty';
    empty.textContent = '这段履历没有收录独立项目。';
    projectsListEl.appendChild(empty);
    return;
  }

  list.forEach((p) => {
    const btn = document.createElement('button');
    btn.className = 'proj';
    btn.type = 'button';

    const thumb = document.createElement('div');
    thumb.className = 'proj-thumb';
    // 截图还没到位：先显示占位文字，**加载成功才把 img 插进来** ——
    // 直接 append 一个坏 src 的 img 会渲染成一块空白方块（布局还会被撑）。
    thumb.textContent = '截图待补';
    loadShot(p.image || `shots/${p.id}.png`, (img) => {
      img.alt = p.name;
      thumb.textContent = '';
      if(isPortrait(img)) thumb.classList.add('is-fit');
      thumb.appendChild(img);
    });

    const meta = document.createElement('div');
    meta.className = 'proj-meta';
    const name = document.createElement('div');
    name.className = 'proj-name';
    name.textContent = p.name;
    const sub = document.createElement('div');
    sub.className = 'proj-sub';
    sub.textContent = projectSub(p);
    meta.append(name, sub);

    btn.append(thumb, meta);
    btn.addEventListener('click', () => openProject(p));
    projectsListEl.appendChild(btn);
  });
}

/* ── 项目详情（全屏） ────────────────────────────────────────────────── */
const modalEl = document.getElementById('modal');
const modalHero = document.getElementById('modal-hero');
const modalDate = document.getElementById('modal-date');
const modalTitle = document.getElementById('modal-title');
const modalSub = document.getElementById('modal-sub');
const modalContent = document.getElementById('modal-content');

function section(title, body){
  const wrap = document.createElement('div');
  wrap.className = 'modal-sec';
  const h = document.createElement('h4');
  h.textContent = title;
  wrap.appendChild(h);
  if(Array.isArray(body)){
    const ul = document.createElement('ul');
    body.forEach((t) => {
      const li = document.createElement('li');
      li.textContent = t;
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  } else {
    const p = document.createElement('p');
    p.textContent = body;
    wrap.appendChild(p);
  }
  return wrap;
}

function openProject(p){
  const span = [fmtMonth(p.startDate), p.endDate ? fmtMonth(p.endDate) : '至今'].join(' — ');
  modalDate.textContent = span;
  modalTitle.textContent = p.name;
  modalSub.textContent = [p.role, p.opensource ? '开源项目' : ''].filter(Boolean).join(' · ');

  modalHero.innerHTML = '';
  modalHero.textContent = '项目截图待补';
  modalHero.className = 'modal-hero is-empty';
  modalHero.style.removeProperty('--shot');
  modalHero.style.removeProperty('height');
  loadShot(p.image || `shots/${p.id}.png`, (img) => {
    img.alt = p.name;
    modalHero.textContent = '';
    modalHero.className = 'modal-hero';
    if(isPortrait(img)){
      modalHero.classList.add('is-fit');
      // 左右垫底的模糊层用同一张图（CSS 变量，避免再发一次请求）
      modalHero.style.setProperty('--shot', `url("${img.currentSrc || img.src}")`);
    } else {
      /* 横图：框子高度按图片真实宽高比算，**不再硬裁成 2.88:1**。
         16:9 的图在 980 宽的卡里就是 551 高（封顶 540），比原来的 340 高一半，
         细节能看清；图本身也不用为迁就框子去裁成超宽横幅。 */
      const cw = modalHero.clientWidth || 980;
      const h = Math.round(Math.min(540, Math.max(300, cw * img.naturalHeight / img.naturalWidth)));
      modalHero.style.height = `${h}px`;
    }
    modalHero.appendChild(img);
  });

  modalContent.innerHTML = '';
  if(p.description) modalContent.appendChild(section('背景', p.description));
  if(p.tasks && p.tasks.length) modalContent.appendChild(section('任务', p.tasks));
  if(p.challenges && p.challenges.length) modalContent.appendChild(section('挑战', p.challenges));
  if(p.actions && p.actions.length) modalContent.appendChild(section('行动', p.actions));
  if(p.results && p.results.length) modalContent.appendChild(section('结果', p.results));

  if(p.url){
    const a = document.createElement('a');
    a.className = 'modal-link';
    a.href = p.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = '查看完整文档 ↗';
    modalContent.appendChild(a);
  }

  modalEl.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeProject(){
  modalEl.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeProject);
modalEl.addEventListener('click', (e) => { if(e.target === modalEl) closeProject(); });
window.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeProject(); });

function setActiveIdx(idx){
  if(idx === activeIdx) return;
  activeIdx = idx;

  // 更新 UI
  const item = RESUME[idx];
  if(!item) return;
  document.getElementById('info-date').textContent = `${item.start} — ${item.end}`;
  document.getElementById('info-title').textContent = item.title;
  document.getElementById('info-sub').textContent = item.subtitle;
  document.getElementById('info-desc').textContent = item.summary;

  document.querySelectorAll('.timeline button').forEach((b, i) => {
    b.classList.toggle('on', i === idx);
  });

  renderProjects(idx);
}

/* 🔴 详情弹窗开着时，滚轮 / 触摸 / 方向键都属于弹窗自己（正文要能滚），
   不能再驱动隧道 —— 否则在弹窗里滚一下，后面的时空隧道跟着滑。
   `modalEl` 在上面就声明了，这里直接读它的 class 即可。 */
const modalOpen = () => modalEl.classList.contains('open');

window.addEventListener('wheel', e => {
  if(modalOpen()) return;
  e.preventDefault();
  targetZ -= e.deltaY * 0.008;
  targetZ = Math.max(zEnd, Math.min(zStart, targetZ));
}, { passive: false });

// 触摸
let touchY = 0;
window.addEventListener('touchstart', e => {
  if(modalOpen()) return;
  touchY = e.touches[0].clientY;
}, { passive:true });
window.addEventListener('touchmove', e => {
  if(modalOpen()) return;
  const dy = e.touches[0].clientY - touchY;
  touchY = e.touches[0].clientY;
  targetZ -= dy * 0.03;
  targetZ = Math.max(zEnd, Math.min(zStart, targetZ));
}, { passive: true });

// 键盘
window.addEventListener('keydown', e => {
  if(modalOpen()) return;
  if(e.key === 'ArrowUp' || e.key === 'ArrowLeft')   targetZ += SPACING * 0.8;
  if(e.key === 'ArrowDown' || e.key === 'ArrowRight') targetZ -= SPACING * 0.8;
  targetZ = Math.max(zEnd, Math.min(zStart, targetZ));
});

/* ============================================================================
   时间轴 UI
   ============================================================================ */
const timelineEl = document.getElementById('timeline');
function buildTimeline(){
  timelineEl.innerHTML = '';
  RESUME.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.textContent = item.start;
    btn.addEventListener('click', () => {
      targetZ = -(i * SPACING) - 5 + 4;
      targetZ = Math.max(zEnd, Math.min(zStart, targetZ));
    });
    timelineEl.appendChild(btn);
  });
}

const scrollbar = document.getElementById('scrollbar');

/* ============================================================================
   渲染循环
   ============================================================================ */
let t0 = performance.now();
function tick(){
  const now = performance.now();
  const dt = (now - t0) / 1000;
  t0 = now;

  // 平滑相机
  camZ += (targetZ - camZ) * 0.08;
  camera.position.set(0, 0, camZ);
  camera.lookAt(0, 0, camZ - 10);

  // 星星视差
  dots.position.z = camZ * 0.5;
  far.position.z = camZ * 0.15;

  // 找出最接近相机的卡片
  let closest = 0, closestDist = Infinity;
  cards.forEach((c, i) => {
    const d = Math.abs(c.baseZ - (camZ - 6));
    if(d < closestDist){ closestDist = d; closest = i; }
  });
  setActiveIdx(closest);

  // 卡片悬浮微动
  cards.forEach((c, i) => {
    const ph = i * 1.7;
    c.mesh.position.y += Math.sin(now * 0.0008 + ph) * 0.0008;
    // 面向相机稍微调整
    const dx = camera.position.x - c.mesh.position.x;
    const dz = camera.position.z - c.mesh.position.z;
    const ry = Math.atan2(dx, dz);
    // 只做轻微朝向修正
    c.mesh.rotation.y = c.mesh.rotation.y * 0.98 + (ry * 0.3) * 0.02;
  });

  // 进度条
  const progress = (zStart - camZ) / (zStart - zEnd);
  scrollbar.style.width = (Math.max(0, Math.min(1, progress)) * 100) + '%';

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ============================================================================
   启动：先取数据，再建卡 / 建刻度 / 开循环
   ============================================================================ */
(async function boot(){
  let data = [];
  try{
    const res = await fetch('./experiences.json', { cache: 'no-store' });
    data = await res.json();
  }catch(err){
    console.error('[career] experiences.json 读取失败', err);
  }

  RESUME = mapExperiences(data);
  buildCards();
  buildTimeline();
  setActiveIdx(0);

  t0 = performance.now();
  requestAnimationFrame(tick);
})();

/* ============================================================================
   Resize
   ============================================================================ */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
