/* =====================================================
   ★ 颜色计算：星系本色 + 小幅偏移 → 同色系内区分
   ===================================================== */
function getNodeColor(id) {
  const data = NODES[id];
  const base = new THREE.Color(GALAXIES[data.g].hex);
  const sh = data.shift;
  if (!sh || (sh.h === 0 && sh.l === 0 && sh.s === 0)) return base;
  
  const hsl = {};
  base.getHSL(hsl);
  
  let h = hsl.h + sh.h;
  if (h < 0) h += 1;
  if (h > 1) h -= 1;
  const s = Math.max(0.25, Math.min(1.0, hsl.s + sh.s));
  const l = Math.max(0.20, Math.min(0.85, hsl.l + sh.l));
  
  const c = new THREE.Color();
  c.setHSL(h, s, l);
  return c;
}

function getNodeColorHex(id) {
  return '#' + getNodeColor(id).getHexString();
}

    precision highp float;
    uniform float uTime; uniform vec2 uRes;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
    float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
      float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));

function radialTexture(hex, softness=1.0) {
  const s = 256, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const c = new THREE.Color(hex);
  const r = Math.round(c.r*255), g = Math.round(c.g*255), b = Math.round(c.b*255);
  const grad = ctx.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
  grad.addColorStop(0.0,'rgba(255,255,255,1)');
  grad.addColorStop(0.12*softness, `rgba(${r},${g},${b},0.95)`);
  grad.addColorStop(0.35*softness, `rgba(${r},${g},${b},0.32)`);
  grad.addColorStop(0.65*softness, `rgba(${r},${g},${b},0.08)`);
  grad.addColorStop(1.0, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grad; ctx.fillRect(0,0,s,s);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
  return tex;
}

function createNode(id, data) {
  const nodeColor = getNodeColor(id);
  const nodeColorHex = getNodeColorHex(id);
  const group = new THREE.Group();
  group.position.set(...data.pos3d);
  
  const geo = new THREE.SphereGeometry(data.r3d, 48, 48);
  const mat = new THREE.ShaderMaterial({
    uniforms:{
      uColor:{ value:nodeColor.clone() },
      uTime:{ value:0 },
      uSelected:{ value:0 },
      uHover:{ value:0 },
    },
    vertexShader:`
      varying vec3 vNormal; varying vec3 vViewDir; varying vec3 vPos;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        vViewDir = normalize(-mv.xyz);
        vPos = position;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform vec3 uColor; uniform float uTime;
      uniform float uSelected; uniform float uHover;
      varying vec3 vNormal; varying vec3 vViewDir; varying vec3 vPos;
      void main(){
        vec3 N = normalize(vNormal); vec3 V = normalize(vViewDir);
        float fres = pow(1.0 - max(dot(N,V),0.0), 2.2);
        vec3 L = normalize(vec3(0.55,1.0,0.75));
        float diff = max(dot(N,L),0.0);
        float backLight = max(dot(N,-L),0.0)*0.3;
        vec3 base = uColor * (0.20 + diff*0.55 + backLight);
        vec3 rim = uColor * 2.4 * fres;
        float pulse = 0.92 + 0.08*sin(uTime*1.6 + vPos.y*2.5);
        vec3 col = (base + rim) * pulse;
        col += vec3(1.0) * (uSelected*0.4 + uHover*0.18) * fres;
        col += uColor * uSelected * 0.25;
        gl_FragColor = vec4(col,1.0);
      }`,
  });
  
  const sphere = new THREE.Mesh(geo, mat);
  sphere.userData.nodeId = id;
  group.add(sphere);
  clickables3d.push(sphere);
  
  const glowTex = radialTexture(nodeColorHex, 0.9);
  const glowMat = new THREE.SpriteMaterial({
    map: glowTex, color: nodeColor.clone(), transparent: true,
    opacity: data.nonStandard ? 0.28 : 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.setScalar(data.r3d * (data.nonStandard ? 5.5 : 6.5));
  group.add(glow);
  
  const div = document.createElement('div');
  div.className = 'node-label';
  div.style.color = nodeColorHex;
  const nsMark = data.nonStandard ? '<span class="nl-ns">◇ 非标准</span>' : '';
  div.innerHTML = `<span class="nl-zh">${data.label}</span><span class="nl-en">${data.en}</span>${nsMark}`;
  const lbl = new CSS2DObject(div);
  lbl.position.set(0, data.r3d + 1.15, 0);
  group.add(lbl);
  
  scene.add(group);
  nodeObjects[id] = { group, sphere, glow, mat, data, id, nodeColor };
}

const edgeObjects3d = [];

function createEdge3d(e) {
  const a = new THREE.Vector3(...NODES[e.from].pos3d);
  const b = new THREE.Vector3(...NODES[e.to].pos3d);
  const color = e.color;
  
  let curve;
  if (e.straight) {
    curve = new THREE.LineCurve3(a, b);
  } else {
    const mid = a.clone().lerp(b, 0.5);
    let perp = new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3(0,1,0));
    if (perp.lengthSq() < 0.0001) perp.set(1,0,0);
    perp.normalize();
    const bend = 0.06 * a.distanceTo(b);
    mid.add(perp.multiplyScalar(bend));
    curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  }
  
  const pts = curve.getPoints(64);
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const lineMat = new THREE.LineBasicMaterial({
    color, transparent: true,
    opacity: e.dashed ? (e.lineOpacity ?? 0.10) : 0.16,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  scene.add(new THREE.Line(lineGeo, lineMat));
  
  if (e.flow) {
    const count = e.count ?? 6;
    const pGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(count*3);
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const pMat = new THREE.PointsMaterial({
      size: 0.5, map: radialTexture(color, 0.8), color,
      transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, sizeAttenuation: true, opacity: 0.92,
    });
    const points = new THREE.Points(pGeo, pMat);
    points.frustumCulled = false;
    scene.add(points);
    edgeObjects3d.push({
      curve, positions, count, pGeo,
      speed: e.speed ?? 0.22,
      offsets: Array.from({length:count}, (_,i)=>i/count),
    });
  }
}

pulse.frustumCulled = false;
scene.add(pulse);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered3d = null;
let selected3d = null;

function updatePointer(e) {
  pointer.x = (e.clientX/innerWidth)*2 - 1;
  pointer.y = -(e.clientY/innerHeight)*2 + 1;
}
function pick3d(e) {
  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickables3d, false);
  return hits.length ? hits[0].object : null;
}

renderer.domElement.addEventListener('pointermove', (e) => {
  const hit = pick3d(e);
  if (hit !== hovered3d) {
    hovered3d = hit;
    renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
  }
});

let downX=0, downY=0, downT=0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY; downT = performance.now();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  const dx = e.clientX - downX, dy = e.clientY - downY;
  const d2 = dx*dx + dy*dy;
  const dt = performance.now() - downT;
  if (d2 > 36 || dt > 450) return;
  const hit = pick3d(e);
  if (hit) {
    const id = hit.userData.nodeId;
    selected3d = id;
    showCard(NODES[id], getNodeColorHex(id));
  } else {
    selected3d = null;
    hideCard();
  }
});

const clock = new THREE.Clock();
let paused = false;

function animate3d() {
  if (paused) return;
  requestAnimationFrame(animate3d);
  
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  
  bgMat.uniforms.uTime.value = t;
  
  for (let i = 0; i < galaxyBoundaries.length; i++) {
    const m = galaxyBoundaries[i];
    const s = m.userData.baseScale;
    const ph = m.userData.phase;
    const breath = 1 + Math.sin(t*0.5 + ph)*0.015;
    m.scale.set(s[0]*breath, s[1]*breath, s[2]*breath);
    m.rotation.y += dt*0.03;
    const baseOp = m.userData.isAgent ? 0.055 : 0.09;
    galaxyBoundaryMats[i].opacity = baseOp + Math.sin(t*0.8 + ph)*0.02;
  }
  
  for (const id in nodeObjects) {
    const n = nodeObjects[id];
    n.mat.uniforms.uTime.value = t;
    const selT = id === selected3d ? 1 : 0;
    const hovT = n.sphere === hovered3d ? 1 : 0;
    n.mat.uniforms.uSelected.value += (selT - n.mat.uniforms.uSelected.value)*0.12;
    n.mat.uniforms.uHover.value += (hovT - n.mat.uniforms.uHover.value)*0.18;
    const baseOp = id === selected3d ? 1.0 : (n.data.nonStandard ? 0.35 : 0.5);
    n.glow.material.opacity = baseOp + Math.sin(t*1.4 + n.data.pos3d[1]*0.35)*0.08;
  }
  
  for (const e of edgeObjects3d) {
    const p = e.positions;
    for (let i = 0; i < e.count; i++) {
      let u = (e.offsets[i] + t*e.speed) % 1;
      if (u < 0) u += 1;
      const pt = e.curve.getPointAt(u);
      p[i*3] = pt.x; p[i*3+1] = pt.y; p[i*3+2] = pt.z;
    }
    e.pGeo.attributes.position.needsUpdate = true;
  }
  
  const CYCLE = 8;
  const phase = (t % (CYCLE*2)) / CYCLE;
  let u, colHex;
  if (phase < 1) { u = phase; colHex = 0x60a5fa; }
  else { u = 2 - phase; colHex = 0x4ade80; }
  u = Math.max(0, Math.min(1, u));
  const pt = pulsePath.getPointAt(u);
  pulse.position.copy(pt);
  pulseMat.color.setHex(colHex);
  pulseMat.opacity = Math.min(1, Math.min(u, 1-u)*7);
  pulseMat.size = 1.3 + Math.sin(t*6)*0.25;
  
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* =====================================================
   4. 2D SVG 渲染
   ===================================================== */
let svgBuilt = false;

function buildSVG() {
  if (svgBuilt) return;
  svgBuilt = true;
  
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 1400 1100');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.style.width = '100%';
  svg.style.height = '100%';
  svg.style.display = 'block';
  
  const defs = document.createElementNS(NS, 'defs');
  
  // 星系渐变
  Object.entries(GALAXIES).forEach(([key, g]) => {
    const grad = document.createElementNS(NS, 'radialGradient');
    grad.setAttribute('id', `galaxy-${key}`);
    const c = new THREE.Color(g.hex);
    const r = Math.round(c.r*255), gg = Math.round(c.g*255), b = Math.round(c.b*255);
    grad.innerHTML = `
      <stop offset="0%" stop-color="rgba(${r},${gg},${b},0.10)"/>
      <stop offset="100%" stop-color="rgba(${r},${gg},${b},0.02)"/>
    `;
    defs.appendChild(grad);
  });
  
  // 每个节点一个独立渐变
  Object.keys(NODES).forEach((id) => {
    const hexStr = getNodeColorHex(id);
    const ng = document.createElementNS(NS, 'radialGradient');
    ng.setAttribute('id', `node-${id}`);
    ng.innerHTML = `
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="30%" stop-color="${hexStr}"/>
      <stop offset="100%" stop-color="${hexStr}" stop-opacity="0.7"/>
    `;
    defs.appendChild(ng);
  });
  
  svg.appendChild(defs);
  
  // Agent 边界矩形（背景层）
  const agentG = GALAXIES.agent;
  const [ax,ay,aw,ah,arx] = agentG.rect2d;
  const agentRect = document.createElementNS(NS, 'rect');
  agentRect.setAttribute('x', ax); agentRect.setAttribute('y', ay);
  agentRect.setAttribute('width', aw); agentRect.setAttribute('height', ah);
  agentRect.setAttribute('rx', arx);
  agentRect.setAttribute('fill', 'none');
  agentRect.setAttribute('stroke', agentG.color);
  agentRect.setAttribute('stroke-width', 1.5);
  agentRect.setAttribute('stroke-dasharray', '10 12');
  agentRect.setAttribute('opacity', 0.32);
  svg.appendChild(agentRect);
  
  const agentLabel = document.createElementNS(NS, 'text');
  agentLabel.setAttribute('x', ax + 22);
  agentLabel.setAttribute('y', ay + 24);
  agentLabel.setAttribute('fill', agentG.color);
  agentLabel.setAttribute('font-size', '11');
  agentLabel.setAttribute('font-family', 'inherit');
  agentLabel.setAttribute('letter-spacing', '2.5');
  agentLabel.setAttribute('font-weight', '600');
  agentLabel.setAttribute('opacity', '0.8');
  agentLabel.textContent = '— AGENT 边界（= Harness + Model）—';
  svg.appendChild(agentLabel);
  
  // 其他星系矩形
  Object.entries(GALAXIES).forEach(([key, g]) => {
    if (key === 'agent') return;
    const [x,y,w,h,rx] = g.rect2d;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', rx);
    rect.setAttribute('fill', `url(#galaxy-${key})`);
    rect.setAttribute('stroke', g.color);
    rect.setAttribute('stroke-width', 1);
    rect.setAttribute('stroke-dasharray', '4 6');
    rect.setAttribute('opacity', 0.6);
    svg.appendChild(rect);
    
    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', x + 20);
    label.setAttribute('y', y + 26);
    label.setAttribute('fill', g.color);
    label.setAttribute('font-size', '11');
    label.setAttribute('font-family', 'inherit');
    label.setAttribute('letter-spacing', '2');
    label.setAttribute('font-weight', '600');
    label.setAttribute('opacity', '0.85');
    label.textContent = g.name;
    svg.appendChild(label);
  });
  
  // 边
  EDGES.forEach(e => {
    const a = NODES[e.from].svg;
    const b = NODES[e.to].svg;
    const color = new THREE.Color(e.color);
    const col = `#${color.getHexString()}`;
    
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len < 5) return;
    
    let d;
    if (Math.abs(dx) < 5 || Math.abs(dy) < 5) {
      d = `M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}`;
    } else {
      const midX = (a[0] + b[0])/2;
      const midY = (a[1] + b[1])/2;
      const perpX = -dy/len, perpY = dx/len;
      const bend = len * 0.08;
      d = `M ${a[0]} ${a[1]} Q ${midX + perpX*bend} ${midY + perpY*bend} ${b[0]} ${b[1]}`;
    }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', col);
    path.setAttribute('stroke-width', e.dashed ? 1 : 1.5);
    path.setAttribute('opacity', e.dashed ? 0.2 : 0.35);
    if (e.dashed) {
      path.setAttribute('stroke-dasharray', '4 6');
    } else if (e.flow) {
      path.setAttribute('stroke-dasharray', '6 10');
      path.classList.add('flow-line');
    }
    svg.appendChild(path);
  });
  
  // 节点
  Object.entries(NODES).forEach(([id, data]) => {
    const nodeColorHex = getNodeColorHex(id);
    const [cx, cy, r] = data.svg;
    const nodeG = document.createElementNS(NS, 'g');
    nodeG.style.cursor = 'pointer';
    nodeG.dataset.nodeId = id;
    
    const glow = document.createElementNS(NS, 'circle');
    glow.setAttribute('cx', cx); glow.setAttribute('cy', cy);
    glow.setAttribute('r', r*1.8);
    glow.setAttribute('fill', nodeColorHex);
    glow.setAttribute('opacity', data.nonStandard ? 0.06 : 0.12);
    glow.classList.add('star-glow');
    nodeG.appendChild(glow);
    
    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', `url(#node-${id})`);
    circle.setAttribute('stroke', nodeColorHex);
    circle.setAttribute('stroke-width', 1.5);
    circle.setAttribute('opacity', data.nonStandard ? 0.7 : 1);
    if (data.nonStandard) circle.setAttribute('stroke-dasharray', '3 3');
    nodeG.appendChild(circle);
    
    const labelZh = document.createElementNS(NS, 'text');
    labelZh.setAttribute('x', cx);
    labelZh.setAttribute('y', cy + r + 16);
    labelZh.setAttribute('text-anchor', 'middle');
    labelZh.setAttribute('fill', '#fff');
    labelZh.setAttribute('font-size', '12');
    labelZh.setAttribute('font-weight', '600');
    labelZh.setAttribute('font-family', 'inherit');
    labelZh.setAttribute('letter-spacing', '0.4');
    labelZh.textContent = data.label;
    nodeG.appendChild(labelZh);
    
    const labelEn = document.createElementNS(NS, 'text');
    labelEn.setAttribute('x', cx);
    labelEn.setAttribute('y', cy + r + 30);
    labelEn.setAttribute('text-anchor', 'middle');
    labelEn.setAttribute('fill', 'rgba(255,255,255,0.4)');
    labelEn.setAttribute('font-size', '9');
    labelEn.setAttribute('font-family', 'inherit');
    labelEn.setAttribute('letter-spacing', '1');
    labelEn.textContent = data.en;
    nodeG.appendChild(labelEn);
    
    nodeG.addEventListener('click', (ev) => {
      ev.stopPropagation();
      selected3d = id;
      showCard(data, nodeColorHex);
    });
    
    svg.appendChild(nodeG);
  });
  
  svg.addEventListener('click', () => {
    selected3d = null;
    hideCard();
  });
  
  document.getElementById('container2d').appendChild(svg);
}

/* =====================================================
   5. 视图切换
   ===================================================== */
const toggleBtn = document.getElementById('toggle');
let viewMode = '3d';

toggleBtn.addEventListener('click', () => {
  if (viewMode === '3d') {
    viewMode = '2d';
    paused = true;
    canvas3d.classList.add('hidden');
    labelRenderer.domElement.style.display = 'none';
    buildSVG();
    document.getElementById('container2d').classList.add('active');
    toggleBtn.textContent = '切换到 3D 星球';
  } else {
    viewMode = '3d';
    canvas3d.classList.remove('hidden');
    labelRenderer.domElement.style.display = 'block';
    document.getElementById('container2d').classList.remove('active');
    toggleBtn.textContent = '切换到 2D 星图';
    paused = false;
    clock.getDelta();
    animate3d();
  }
  hideCard();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  bgMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

animate3d();

setTimeout(() => document.getElementById('loader').classList.add('hidden'), 500);
</script>
