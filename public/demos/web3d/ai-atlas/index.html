<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 主题/语言：默认随系统，宿主（3D 房子）可用 <html data-theme> / ?lang= 覆盖。
     必须放在样式之前 —— 它同步写 data-theme，首帧就是对的颜色，不会闪一下。 -->
<script src="../../_env.js"></script>
<script src="../../_from.js" defer></script>
<title>图鉴 · ATLAS — 24 件工具卡片墙</title>
<meta name="description" content="24 件 iskill 工具的卡片墙：一面围着观众的弧形展墙，卡片随滚动在深度里移动，点开就是该项目自己的页面（全屏浮层，四边 24px）。纯 CSS 3D + WebGL 背景，没有一张位图。">
<style>
@font-face{
  font-family:'MapleUI';
  src:url('/fonts/maple-ui.woff2') format('woff2');
  font-weight:400 500;font-display:swap;
}
:root{
  --bg:#05070c;
  --ink:#eef3f8;
  --dim:#8b97a9;
  --dim-2:#5a6577;
  --accent:#5ef0c8;
  --line:rgba(150,175,205,.16);
  /* 卡片的"皮"也进变量：浅色只换变量，不动结构（下面 24 张卡共用一套规则） */
  --card-a:rgba(17,23,32,.96);
  --card-b:rgba(9,13,19,.98);
  --card-line:rgba(150,190,220,.13);
  --card-name:#e9eff7;
  --card-desc:#9aa8bb;
  --plate:#080b11;
  --plate-veil:rgba(7,10,15,.88);
  --veil:5,7,12;
  --chip:rgba(10,14,20,.5);
  --track:rgba(150,190,220,.1);
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:'MapleUI',ui-sans-serif,system-ui,'PingFang SC','Hiragino Sans GB',sans-serif;
}
/* ── 浅色 ─────────────────────────────────────────────────────────────
   取自主站的暖纸（纸 #FFF6E9 / 墨 #211D1A / 木色线 #9B755A，见
   `NavigationUI.scss` 的地图、`SitePreferences` 的 theme-color），但**墙比纸再深
   一档**：深色版里卡片比底亮一截才立得住，浅色版同理 —— 全是 #FFF6E9 的话
   24 张卡就糊成一片（第一版就是这样，整面墙发雾）。
   🔴 主题由 `<html data-theme>` 决定，值由 `_env.js` 写（随系统或听宿主的）。 */
html[data-theme="light"]{
  --bg:#F7EDDE;
  --ink:#211D1A;
  --dim:#6a5c4f;
  --dim-2:#8a7a69;
  --accent:#0b6e56;
  --line:rgba(120,92,66,.3);
  --card-a:rgba(255,253,248,.99);
  --card-b:rgba(251,243,231,.99);
  --card-line:rgba(120,92,66,.26);
  --card-name:#241f1a;
  --card-desc:#5d5145;
  --plate:#f6ecdc;
  --plate-veil:rgba(252,245,234,.9);
  --veil:247,237,222;
  --chip:rgba(255,250,242,.72);
  --track:rgba(120,92,66,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:0}

/* ── 舞台：perspective 在这一层，卡片才有真正的深度 ─────────────── */
.stage{
  position:fixed;inset:0;z-index:2;
  overflow:hidden;
  perspective:1600px;
  perspective-origin:50% 50%;
  touch-action:none;
  cursor:grab;
}
.stage.is-drag{cursor:grabbing}
.wall{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transform-origin:50% 50%;
  /* 🔴 必须不接收指针：墙是 inset:0 的一整块，而卡片被 translateZ 推到
     z<0（墙平面之后）。在 preserve-3d 的上下文里命中测试**认深度**，
     墙自己就把所有点击吃掉了 —— 表现为"卡片点不动、elementFromPoint 永远
     返回 .wall"。桌面和手机都一样，只是 JS 的 .click() 兜底把它盖住了。 */
  pointer-events:none;
}

/* ── 卡片 ──────────────────────────────────────────────────────── */
.card{
  position:absolute;left:0;top:0;
  pointer-events:auto;
  appearance:none;border:0;padding:0;background:none;
  transform-origin:50% 50%;
  transform-style:preserve-3d;
  cursor:pointer;
  outline:none;
  opacity:0;
  -webkit-tap-highlight-color:transparent;
}
.card__in{
  position:relative;width:100%;height:100%;
  display:flex;flex-direction:column;
  border-radius:13px;overflow:hidden;
  background:linear-gradient(180deg,var(--card-a),var(--card-b));
  border:1px solid var(--card-line);
  box-shadow:0 22px 60px -30px rgba(0,0,0,.9);
  transform:translateZ(0);
  transition:transform .38s cubic-bezier(.22,1,.28,1),
             border-color .38s ease,
             box-shadow .38s ease;
}
.card:hover .card__in,
.card:focus-visible .card__in{
  transform:translateZ(78px);
  border-color:var(--c-dim);
  filter:brightness(1.1);
  box-shadow:0 50px 100px -34px rgba(0,0,0,.95),0 0 60px -16px var(--c);
}
html[data-theme="light"] .card__in{box-shadow:0 16px 38px -22px rgba(120,92,66,.5)}
html[data-theme="light"] .card:hover .card__in,
html[data-theme="light"] .card:focus-visible .card__in{
  /* 纸上再"提亮"就洗白了：改用木色投影 + 卡片自己的色晕来抬 */
  filter:none;
  box-shadow:0 36px 70px -30px rgba(120,92,66,.55),0 0 50px -14px var(--c);
}
.card:focus-visible .card__in{outline:1px solid var(--c);outline-offset:0}

/* 封面：程序化「信号图」，按 id 哈希长出来，24 张各不相同 */
.card__plate{
  position:relative;flex:0 0 50%;overflow:hidden;background:var(--plate);
}
.card__plate canvas{display:block;width:100%;height:100%;transition:filter .38s ease}
.card__plate::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 64%,var(--plate-veil) 100%);
}
.card__badge{
  position:absolute;right:9px;top:9px;z-index:2;
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:999px;
  background:rgba(4,8,12,.66);border:1px solid rgba(150,200,225,.16);
  font:400 9px/1 var(--mono);letter-spacing:.12em;
  color:var(--dim);text-transform:uppercase;
  transition:color .3s ease,border-color .3s ease,background .3s ease;
}
html[data-theme="light"] .card__badge{
  background:rgba(255,252,246,.8);border-color:rgba(120,92,66,.2);
}
.card:hover .card__badge{color:var(--c);border-color:var(--c-dim);background:rgba(4,8,12,.85)}
html[data-theme="light"] .card:hover .card__badge{background:rgba(255,253,249,.95)}
.card:hover .card__plate canvas{filter:brightness(1.18) saturate(1.1)}
html[data-theme="light"] .card:hover .card__plate canvas{filter:saturate(1.06)}

.card__body{
  flex:1;min-height:0;
  padding:11px 13px 12px;
  display:flex;flex-direction:column;gap:5px;
}
.card__top{
  display:flex;justify-content:space-between;align-items:baseline;
  font:400 8.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim-2);
}
.card__no{color:var(--c);letter-spacing:.14em}
.card__name{
  font:500 14px/1.24 var(--mono);
  letter-spacing:-.012em;color:var(--card-name);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card__desc{
  font:400 11.5px/1.58 var(--sans);
  color:var(--card-desc);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card__foot{
  margin-top:auto;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font:400 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim-2);
}
.card__go{color:var(--c);opacity:.72;transition:opacity .3s ease,transform .3s ease}
.card:hover .card__go{opacity:1;transform:translateX(2px)}

/* ── 上下压边：卡片滚到边上就化进背景里（配合 JS 的透明度衰减）──── */
.veil{position:fixed;left:0;right:0;height:108px;pointer-events:none;z-index:3}
.veil--top{top:0;background:linear-gradient(180deg,rgba(var(--veil),.97) 0%,rgba(var(--veil),.6) 48%,transparent 100%)}
.veil--bot{bottom:0;background:linear-gradient(0deg,rgba(var(--veil),.99) 0%,rgba(var(--veil),.92) 26%,rgba(var(--veil),.5) 62%,transparent 100%)}

/* ── HUD ───────────────────────────────────────────────────────── */
.hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.hud a{pointer-events:auto}

.lab-back{
  position:absolute;left:18px;top:16px;
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);
  color:var(--dim);text-decoration:none;
  font:400 12px/1 var(--sans);letter-spacing:.04em;
  background:var(--chip);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:color .22s ease,border-color .22s ease;
}
.lab-back:hover{color:var(--ink);border-color:var(--dim-2)}

/* 标题在**顶部中间**：右上角留给 3D 场景的图标栈（音量 / 地图 / 主题…由房子
   统一挂），这里不许占位。 */
.brand{
  position:absolute;left:50%;top:18px;transform:translateX(-50%);
  text-align:center;pointer-events:none;
}
.brand__name{
  font:500 15px/1.2 var(--sans);letter-spacing:.14em;color:var(--ink);
  text-shadow:0 0 22px rgba(0,0,0,.7);
}
html[data-theme="light"] .brand__name{text-shadow:none}
.brand__name i{font-style:normal;color:var(--dim-2);margin:0 8px;font-size:11px;letter-spacing:0}
.brand__meta{
  margin-top:8px;
  font:400 10px/1 var(--mono);letter-spacing:.2em;color:var(--dim-2);text-transform:uppercase;
}
.brand__meta b{color:var(--accent);font-weight:500}

.hint{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  font:400 10px/1 var(--mono);letter-spacing:.18em;color:var(--dim-2);
  white-space:nowrap;
}
.hint kbd{
  font:inherit;border:1px solid var(--line);border-radius:3px;
  padding:1px 5px;margin:0 2px;color:var(--dim);
}

/* 右缘滚动条：自己画的，和墙的进度绑在一起 */
.scroll{
  position:fixed;right:9px;top:150px;bottom:120px;width:2px;
  background:var(--track);border-radius:2px;z-index:5;
}
.scroll i{
  position:absolute;left:0;top:0;width:2px;border-radius:2px;
  background:var(--accent);opacity:.6;
  box-shadow:0 0 10px var(--accent);
}

@media (max-width:720px){
  .brand{top:12px}
  .brand__name{font-size:13px}
  .brand__meta{font-size:9px;letter-spacing:.14em;margin-top:6px}
  .veil{height:78px}
  .hint{font-size:9px;letter-spacing:.1em;bottom:18px}
  .scroll{right:6px;top:110px;bottom:96px}
  /* 手机上"← Demos"和居中标题会挤：把返回胶囊压到标题下方那一行 */
  .lab-back{top:12px;font-size:11px;padding:5px 10px}
}
</style>
</head>

/* ---------------------------------------------------------------- 工具 */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v)
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1)
  return t * t * (3 - 2 * t)
}
function hash32(s) {
  let h = 2166136261
  for (let i = 0; i < s.length; i += 1) {
    h ^= s.charCodeAt(i)
    h = Math.imul(h, 16777619)
  }
  return h >>> 0
}
function mulberry32(a) {
  return function () {
    a |= 0
    a = (a + 0x6d2b79f5) | 0
    let t = Math.imul(a ^ (a >>> 15), 1 | a)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
function hsl2rgb(h, s, l) {
  h = (((h % 360) + 360) % 360) / 360
  s /= 100
  l /= 100
  const a = s * Math.min(l, 1 - l)
  const f = (n) => {
    const k = (n + h * 12) % 12
    return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)))
  }
  return [f(0), f(8), f(4)]
}
const esc = (s) =>
  String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

/* 每件一个色相：152°–204° 的青绿带，和站点其他房间同族，但每张卡认得出自己。
   🔴 明度/饱和度和主题绑：62% 的亮青在纸上等于没颜色，浅色必须压到 33% 才读得出，
      否则 24 张卡的编号、箭头、hover 边框会一起消失。 */
const hueOf = (id) => 152 + (hash32(id + '|hue') % 53)
const accentOf = (id, light) => `hsl(${hueOf(id)} ${light ? '58% 33%' : '74% 62%'})`
const accentDim = (id, light) =>
  `hsl(${hueOf(id)} ${light ? '58% 33%' : '74% 62%'} / ${light ? '.32' : '.42'})`
const accentRGB = (id, light) => hsl2rgb(hueOf(id), light ? 58 : 74, light ? 33 : 62)

/* ---------------------------------------------------------------- 封面 */
/* 24 张「信号图」：六种母题 × 每件自己的种子。它们不是装饰 —— 是同族的证据：
   同一套底、同一套四角刻度、同一条基线，只有中间那张图不一样。 */
function paintPlate(cv, it, light) {
  const W = cv.width
  const H = cv.height
  const g = cv.getContext('2d')
  const hue = hueOf(it.id)
  const rnd = mulberry32(hash32(it.id + '|plate'))
  /* 纸上的线要更深、更实：同一条 0.09 的线在深底上看得见，在奶油纸上就没了。
     所以浅色用更深的墨 + 把 alpha 提上来（boost），母题的相对层次不变。 */
  const ink = light ? 26 : 64
  const sat = light ? 52 : 78
  const boost = light ? 2.1 : 1
  const acc = (a) => `hsla(${hue},${sat}%,${ink}%,${Math.min(1, a * boost)})`

  const bg = g.createLinearGradient(0, 0, W * 0.7, H)
  bg.addColorStop(0, light ? '#fcf4e6' : '#0b1017')
  bg.addColorStop(1, light ? '#f1e2cc' : '#070a0f')
  g.fillStyle = bg
  g.fillRect(0, 0, W, H)

  const halo = g.createRadialGradient(W * 0.74, H * 0.16, 0, W * 0.74, H * 0.16, W * 0.78)
  halo.addColorStop(0, `hsla(${hue},${light ? 56 : 76}%,${light ? 42 : 58}%,${light ? 0.14 : 0.18})`)
  halo.addColorStop(1, 'hsla(0,0%,0%,0)')
  g.fillStyle = halo
  g.fillRect(0, 0, W, H)

  g.lineCap = 'round'
  const kind = hash32(it.id + '|kind') % 6

  if (kind === 0) {
    /* 同心环 */
    const cx = W * 0.5
    const cy = H * 0.56
    for (let i = 0; i < 7; i += 1) {
      g.beginPath()
      g.arc(cx, cy, 24 + i * 21 + rnd() * 5, 0, Math.PI * 2)
      g.strokeStyle = acc(i % 3 === 0 ? 0.3 : 0.09)
      g.lineWidth = 1
      g.stroke()
    }
    g.beginPath()
    g.arc(cx, cy, 24 + 21 * 3, -0.95, 0.85)
    g.strokeStyle = acc(0.72)
    g.lineWidth = 2
    g.stroke()
  } else if (kind === 1) {
    /* 波形 */
    for (let i = 0; i < 13; i += 1) {
      const y = 18 + (i * (H - 36)) / 12
      const amp = 3 + rnd() * 9
      const f = 0.011 + rnd() * 0.018
      const ph = rnd() * 6.283
      g.beginPath()
      for (let x = 0; x <= W; x += 4) {
        const yy = y + Math.sin(x * f + ph) * amp * Math.sin((x / W) * Math.PI)
        if (x === 0) g.moveTo(x, yy)
        else g.lineTo(x, yy)
      }
      g.strokeStyle = acc(i % 4 === 0 ? 0.46 : 0.11)
      g.lineWidth = i % 4 === 0 ? 1.5 : 1
      g.stroke()
    }
  } else if (kind === 2) {
    /* 点阵 */
    const cols = 26
    const rows = 13
    for (let r = 0; r < rows; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        const n = rnd()
        const x = ((c + 0.5) * W) / cols
        const y = ((r + 0.5) * H) / rows
        g.beginPath()
        g.arc(x, y, n > 0.88 ? 2.1 : n > 0.55 ? 1.15 : 0.65, 0, 6.283)
        g.fillStyle = n > 0.88 ? acc(0.7) : acc(0.1 + n * 0.1)
        g.fill()
      }
    }
  } else if (kind === 3) {
    /* 斜排线 */
    for (let i = -H; i < W; i += 8 + rnd() * 6) {
      g.beginPath()
      g.moveTo(i, 0)
      g.lineTo(i + H, H)
      g.strokeStyle = acc(0.11 + rnd() * 0.1)
      g.lineWidth = 1
      g.stroke()
    }
    g.save()
    g.translate(W * 0.64, H * 0.5)
    g.rotate(-0.86)
    g.fillStyle = acc(0.21)
    g.fillRect(-9, -H, 18, H * 2)
    g.restore()
  } else if (kind === 4) {
    /* 辐条 */
    const cx = W * 0.5
    const cy = H * 0.54
    for (let i = 0; i < 36; i += 1) {
      const a = (i / 36) * 6.283
      const r0 = 16
      const r1 = 46 + (i % 6 === 0 ? 44 : 16) + rnd() * 9
      g.beginPath()
      g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0)
      g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1)
      g.strokeStyle = i % 6 === 0 ? acc(0.5) : acc(0.17)
      g.lineWidth = 1
      g.stroke()
    }
    g.beginPath()
    g.arc(cx, cy, 90, 0, 6.283)
    g.strokeStyle = acc(0.3)
    g.lineWidth = 1
    g.stroke()
  } else {
    /* 频谱柱 */
    const n = 30
    for (let i = 0; i < n; i += 1) {
      const w = ((W / n) * 0.46)
      const x = ((i + 0.5) * W) / n
      const h = 6 + rnd() * rnd() * H * 0.66
      g.fillStyle = i % 7 === 0 ? acc(0.58) : acc(0.19)
      g.fillRect(x - w / 2, H - 16 - h, w, h)
    }
  }

  /* 同族标记：一条基线 + 四角刻度 —— 24 张都长这个样，才像一册图鉴 */
  g.strokeStyle = light ? 'rgba(120,92,66,.24)' : 'rgba(150,190,220,.13)'
  g.lineWidth = 1
  g.beginPath()
  g.moveTo(0, H - 0.5)
  g.lineTo(W, H - 0.5)
  g.stroke()
  const corners = [
    [13, 13, 1, 1],
    [W - 13, 13, -1, 1],
    [13, H - 13, 1, -1],
    [W - 13, H - 13, -1, -1],
  ]
  for (const [x, y, dx, dy] of corners) {
    g.beginPath()
    g.moveTo(x, y + dy * 9)
    g.lineTo(x, y)
    g.lineTo(x + dx * 9, y)
    g.stroke()
  }
}

/* 卡片只放得下两行，而英文原句常 200+ 字符。按**第一个从句**截断，让可见的两行
   是一个完整的意思（"Photos plus video into a 15–60s cut or a JianYing draft"），
   而不是切在单词中间；全文挂在 `title` 上，悬停可看。 */
function brief(s, lang) {
  if (lang !== 'en') return s
  const m = s.match(/^(.{40,}?)(?::\s| — |\.\s|;\s)/)
  return m ? m[1] : s
}
function descOf(it) {
  const lang = stageEnv.lang
  const raw = (lang === 'en' && EN[it.id]) || it.desc || ''
  return brief(raw, lang)
}

    '<span class="card__go">' + (hasDemo ? T.goDetail : 'GitHub') + ' →</span></div>' +
    '</div></div>'
  paintPlate(c.el.querySelector('canvas'), it, L)
}

/* ---------------------------------------------------------------- 浮层 */
const overlay = createStageOverlay({ accent: '#5ef0c8' })

/* ---------------------------------------------------------------- 布局 */
let W = 0
let H = 0
let cols = 4
let cardW = 300
let cardH = 380
let gap = 22
let side = 76
let topPad = 132
let contentH = 0
let maxScroll = 0
const S = { y: 0, target: 0, mx: 0, my: 0, tx: 0, ty: 0, acc: accentRGB('atlas', stageEnv.isLight()) }

/* 最近 hover 的卡片：背景那团冷光跟着它换色，切主题时也要按它重算 */
let hoverId = null

/* ---------------------------------------------------------------- 环境 */
/* 主题/语言一变就整页重来一遍：文案、封面、色相、背景底。这是**唯一**的切换
   入口 —— 页面里没有开关，值来自 `_env.js`（随系统，或听 3D 房子的）。
   🔴 重跑 `paintCard` 会重建卡片 DOM，所以事件必须绑在 `el` 上（它不被替换），
      不能绑在 innerHTML 里的节点上。 */
function applyEnv() {
  const L = stageEnv.isLight()
  const T = t()
  document.title = T.title
  const md = document.querySelector('meta[name="description"]')
  if (md) md.content = T.desc
  document.getElementById('brandName').innerHTML = T.brandName
  document.getElementById('brandMeta').innerHTML = T.brandMeta(DATA.length)
  document.getElementById('hint').innerHTML = T.hint
  cards.forEach(paintCard)
  S.acc = accentRGB(hoverId || 'atlas', L)
  dirty = true
}
stageEnv.onChange(applyEnv)

function measure() {
  W = window.innerWidth
  H = window.innerHeight
  const small = W < 720
  cols = W >= 1700 ? 5 : W >= 1180 ? 4 : W >= 860 ? 3 : 2
  gap = small ? 12 : 22
  side = small ? 16 : 76
  /* 卡片宽度封顶：1920 上按比例算会到 370，一屏只剩两行、信息密度掉下来。
     封顶后把整面墙**居中**（左右留白相等），比硬撑满更像一面展墙。 */
  cardW = Math.min((W - side * 2 - gap * (cols - 1)) / cols, 320)
  const gridW = cols * cardW + (cols - 1) * gap
  side = Math.round((W - gridW) / 2)
  cardH = Math.round(cardW * (small ? 1.22 : 1.07))
  topPad = small ? 86 : 130
  const bottomPad = small ? 92 : 124

  const rows = Math.ceil(cards.length / cols)
  contentH = topPad + rows * (cardH + gap) - gap + bottomPad
  maxScroll = Math.max(0, contentH - H)

  /* 曲率半径：屏幕越宽，墙越"平"一点；窄屏几乎不弯（否则文字会歪） */
  const R = Math.max(W * 1.05, 1150)

  cards.forEach((c, i) => {
    const col = i % cols
    const row = Math.floor(i / cols)
    const x = side + col * (cardW + gap)
    const y = topPad + row * (cardH + gap)
    c.el.style.width = cardW + 'px'
    c.el.style.height = cardH + 'px'
    c.el.style.left = x + 'px'
    c.el.style.top = y + 'px'
    c.cx = x + cardW / 2
    c.cy = y + cardH / 2
    const dx = c.cx - W / 2
    /* 柱面：横向偏得越多，转得越多、退得越远。0.86 是"看得出来但不晕"的系数 */
    c.rot = -(dx / R) * (180 / Math.PI) * 1.12
    c.z = -(R - Math.sqrt(Math.max(0, R * R - dx * dx))) * 1.12
  })

  S.target = clamp(S.target, 0, maxScroll)
  S.y = clamp(S.y, 0, maxScroll)
  dirty = true
  updateThumb()
}

/* ---------------------------------------------------------------- 滚动 */
const thumb = document.getElementById('thumb')
function updateThumb() {
  const track = thumb.parentElement.clientHeight
  const frac = contentH > H ? H / contentH : 1
  const h = Math.max(28, Math.round(track * frac))
  const p = maxScroll > 0 ? S.y / maxScroll : 0
  thumb.style.height = h + 'px'
  thumb.style.top = Math.round((track - h) * p) + 'px'
}

stage.addEventListener(
  'wheel',
  (e) => {
    if (overlay.isOpen()) return
    e.preventDefault()
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H : 1
    S.target = clamp(S.target + e.deltaY * unit, 0, maxScroll)
  },
  { passive: false }
)

let drag = null
let moved = 0
stage.addEventListener('pointerdown', (e) => {
  if (overlay.isOpen()) return
  if (e.button !== undefined && e.button !== 0) return
  drag = { y: e.clientY, start: S.target }
  moved = 0
  stage.classList.add('is-drag')
})
window.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'touch') {
    S.tx = (e.clientX / window.innerWidth) * 2 - 1
    S.ty = (e.clientY / window.innerHeight) * 2 - 1
  }
  if (!drag) return
  const dy = e.clientY - drag.y
  moved = Math.max(moved, Math.abs(dy))
  S.target = clamp(drag.start - dy, 0, maxScroll)
})
window.addEventListener('pointerup', () => {
  if (!drag) return
  drag = null
  stage.classList.remove('is-drag')
})
window.addEventListener('pointercancel', () => {
  drag = null
  stage.classList.remove('is-drag')
})

window.addEventListener('keydown', (e) => {
  if (overlay.isOpen()) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const step = H * 0.62
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    S.target = clamp(S.target + (e.key === 'PageDown' ? step : 120), 0, maxScroll)
    e.preventDefault()
  } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    S.target = clamp(S.target - (e.key === 'PageUp' ? step : 120), 0, maxScroll)
    e.preventDefault()
  } else if (e.key === 'Home') {
    S.target = 0
    e.preventDefault()
  } else if (e.key === 'End') {
    S.target = maxScroll
    e.preventDefault()
  }
})

/* ---------------------------------------------------------------- 打开 */
function openCard(c) {
  if (c.it.demo) {
    overlay.open(c.it.demo, {
      title: c.short,
      accent: accentOf(c.it.id, stageEnv.isLight()),
      rect: c.el.getBoundingClientRect(),
    })
  } else if (c.it.url) {
    window.open(c.it.url, '_blank', 'noopener,noreferrer')
  }
}

cards.forEach((c) => {
  c.el.addEventListener('click', () => {
    if (moved > 8) {
      moved = 0
      return
    }
    openCard(c)
  })
  c.el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault()
      openCard(c)
    }
  })
  c.el.addEventListener('focus', () => {
    S.target = clamp(c.cy - H / 2, 0, maxScroll)
  })
  c.el.addEventListener('pointerenter', () => {
    hoverId = c.it.id
    S.acc = accentRGB(hoverId, stageEnv.isLight())
  })
})

/* ---------------------------------------------------------------- 背景 */
const canvas = document.getElementById('gl')
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false })

const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}'
/* uLight: 0=冷黑房间，1=暖纸房间。**不是**简单地反相 —— 浅色下"暗角"要改成
   极轻的压边（把整块压暗 82% 会变成一圈脏边），颗粒也要减半，否则纸上全是噪点。 */
const FS = [
  'precision highp float;',
  'uniform vec2 uRes;uniform float uTime;uniform vec3 uAccent;uniform float uLight;',
  'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
  'void main(){',
  '  vec2 p=(gl_FragCoord.xy-0.5*uRes)/uRes.y;',
  /* 竖向底色：上浅下深的"房间" */
  '  vec3 cA=mix(vec3(0.020,0.026,0.037),vec3(0.969,0.929,0.871),uLight);',
  '  vec3 cB=mix(vec3(0.008,0.011,0.017),vec3(0.937,0.882,0.796),uLight);',
  '  vec3 col=mix(cA,cB,smoothstep(-0.55,0.62,p.y));',
  /* 一团冷光：位置跟着视口中心偏上，卡片 hover 时换色 */
  '  float d=length(p*vec2(0.82,1.0)-vec2(0.0,0.06));',
  '  col+=uAccent*mix(0.085,0.055,uLight)*smoothstep(0.95,0.0,d);',
  '  col+=uAccent*mix(0.05,0.035,uLight)*smoothstep(0.42,0.0,length(p-vec2(0.0,0.14)));',
  /* 极淡的横向扫描线：让大片纯色不至于显出 banding */
  '  col+=uAccent*0.012*sin(p.y*420.0+uTime*0.6);',
  /* 暗角 */
  '  col*=1.0-smoothstep(0.5,1.3,length(p))*mix(0.82,0.13,uLight);',
  /* 颗粒 */
  '  col+=(hash(gl_FragCoord.xy+fract(uTime)*97.0)-0.5)*mix(0.012,0.008,uLight);',
  '  gl_FragColor=vec4(col,1.0);',
  '}',
].join('\n')

function build(vsSrc, fsSrc) {
  const mk = (type, src) => {
    const s = gl.createShader(type)
    gl.shaderSource(s, src)
    gl.compileShader(s)
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || 'shader')
    }
    return s
  }
  const p = gl.createProgram()
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vsSrc))
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fsSrc))
  gl.linkProgram(p)
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link')
  const loc = {}
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS)
  for (let i = 0; i < n; i += 1) {
    const info = gl.getActiveUniform(p, i)
    loc[info.name] = gl.getUniformLocation(p, info.name)
  }
  return { p, loc }
}

let progBg = null
let bgBuf = null
let attrBg = -1
if (gl) {
  progBg = build(VS, FS)
  bgBuf = gl.createBuffer()
  gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
  attrBg = gl.getAttribLocation(progBg.p, 'p')
}

function resizeGL() {
  if (!gl) return
  const dpr = Math.min(window.devicePixelRatio || 1, 2)
  canvas.width = Math.round(window.innerWidth * dpr)
  canvas.height = Math.round(window.innerHeight * dpr)
  canvas.style.width = window.innerWidth + 'px'
  canvas.style.height = window.innerHeight + 'px'
  gl.viewport(0, 0, canvas.width, canvas.height)
}

/* ---------------------------------------------------------------- 每帧 */
let prev = performance.now()
let t0 = prev
let dirty = true
let lastY = -1

function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05)
  prev = now
  const t = (now - t0) / 1000

  /* 滚动：目标值由输入给，这里只做跟随（松手后的余速就是这条曲线） */
  const k = REDUCED ? 30 : 9
  S.y += (S.target - S.y) * (1 - Math.exp(-k * dt))
  if (Math.abs(S.target - S.y) < 0.08) S.y = S.target

  /* 指针视差 */
  const pk = REDUCED ? 40 : 4
  S.mx += (S.tx - S.mx) * (1 - Math.exp(-pk * dt))
  S.my += (S.ty - S.my) * (1 - Math.exp(-pk * dt))

  const par = REDUCED ? 0 : 1
  wall.style.transform =
    'translate3d(' + (S.mx * 15 * par).toFixed(2) + 'px,' + (S.my * 8 * par).toFixed(2) + 'px,0) ' +
    'rotateY(' + (S.mx * 1.1 * par).toFixed(3) + 'deg) ' +
    'rotateX(' + (-S.my * 0.7 * par).toFixed(3) + 'deg)'

  /* 卡片：只有滚动变了才写样式（静止时不碰 DOM） */
  if (dirty || Math.abs(S.y - lastY) > 0.02) {
    lastY = S.y
    dirty = false
    for (let i = 0; i < cards.length; i += 1) {
      const c = cards[i]
      /* 🔴 衰减要按"卡片边缘"算，不能按卡片中心：按中心算的话，卡片还有一半
         在屏幕里、中心已经出界 ⇒ 整张被隐藏，看起来就是"下面突然空了"。 */
      const top = c.cy - cardH / 2 - S.y
      const bot = c.cy + cardH / 2 - S.y
      const off = Math.max(0, top - H, -bot)
      const fade = 1 - smoothstep(0, 0.28, off / H)
      if (fade <= 0.012) {
        if (c.vis) {
          c.el.style.visibility = 'hidden'
          c.vis = false
        }
        continue
      }
      if (!c.vis) {
        c.el.style.visibility = 'visible'
        c.vis = true
      }
      c.el.style.opacity = fade.toFixed(3)
      c.el.style.transform =
        'translate3d(0,' + (-S.y).toFixed(2) + 'px,' + c.z.toFixed(2) + 'px) ' +
        'rotateY(' + c.rot.toFixed(3) + 'deg)'
    }
    updateThumb()
  }

  /* 背景 */
  if (gl) {
    gl.useProgram(progBg.p)
    gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf)
    gl.enableVertexAttribArray(attrBg)
    gl.vertexAttribPointer(attrBg, 2, gl.FLOAT, false, 0, 0)
    gl.uniform2f(progBg.loc.uRes, canvas.width, canvas.height)
    gl.uniform1f(progBg.loc.uTime, t)
    gl.uniform3f(progBg.loc.uAccent, S.acc[0], S.acc[1], S.acc[2])
    gl.uniform1f(progBg.loc.uLight, stageEnv.theme === 'light' ? 1 : 0)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
  }

  requestAnimationFrame(frame)
}

/* ---------------------------------------------------------------- 启动 */
resizeGL()
measure()
applyEnv()
window.addEventListener('resize', () => {
  resizeGL()
  measure()
})
requestAnimationFrame(frame)
})()
</script>
</body>
</html>
