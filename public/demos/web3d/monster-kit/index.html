<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>MonsterKit v1.0 · 载具图鉴</title>

<style>
  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;

    background: radial-gradient(circle at 50% -12%, #2f2558 0%, #171029 52%, #0a0712 100%);

  }

  header { text-align: center; margin-bottom: 52px; }

  .brand {
    display: inline-flex; align-items: center; gap: 10px;

    background: rgba(139, 92, 246, .12);

  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
    gap: 22px; max-width: 1180px; margin: 0 auto;
  }

  .card {
    background: rgba(255, 255, 255, .035);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 24px; padding: 14px 12px 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06);
    transition: transform .35s cubic-bezier(.22,.68,.36,1),
                box-shadow .35s ease, border-color .35s ease;
    cursor: pointer; user-select: none;
  }
  .card:hover {
    transform: translateY(-7px);

  svg { display: block; width: 100%; height: auto; }

  .info { text-align: center; margin-top: 4px; }
  .info h2 {
    font-size: 14px; font-weight: 800; letter-spacing: .14em;
    color: #b4a6ee; margin-bottom: 4px;
  }
  .info p { font-size: 10.5px; letter-spacing: .08em; color: #5f5486; }
  .info .swap {
    display: inline-block; margin-top: 8px;

    border-top: 1px solid rgba(255,255,255,.06);
    padding-top: 7px; transition: color .25s;
  }
  .card:hover .info .swap { color: #8b7ec8; }

  .float { transform-box: view-box; animation: float 3s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .shadow {
    transform-box: fill-box; transform-origin: center;
    animation: shadowPulse 3s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scale(1);   opacity: .30; }
    50%      { transform: scale(.86); opacity: .17; }
  }

  .sway { transform-box: view-box; animation: sway 2.6s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(7deg); }
  }

  .blink {
    transform-box: fill-box; transform-origin: center;
    animation: blink 3.6s infinite;
  }
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94.5%         { transform: scaleY(.07); }
  }

  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  .card:nth-child(2n) .float { animation-delay: -.7s; }
  .card:nth-child(3n) .float { animation-delay: -1.4s; }
  .card:nth-child(5n) .float { animation-delay: -2.1s; }

<script>
/* =========================================================
   工具：锯齿破口
   ========================================================= */
function zigPath(right, left, y, count) {
  let d = '';
  for (let i = 1; i <= count; i++) {
    const t   = i / (count + 1);
    const x   = right + (left - right) * t;
    const up  = i % 2 === 1;
    const amp = 15 + (i % 3) * 3;
    d += ` L ${x.toFixed(1)} ${up ? y - amp : y + 6}`;
  }
  return d;
}

function coneLattice() {
  let s = '';
  for (let i = -4; i <= 10; i++) {
    const x = 60 + i * 22;
    s += `<line x1="${x}" y1="140" x2="${x + 130}" y2="300"/>`;
    s += `<line x1="${x + 130}" y1="140" x2="${x}" y2="300"/>`;
  }
  return s;
}

/* =========================================================
   配对表
   ========================================================= */
const PAIRS = [
  ['egg',     'purple'],
  ['melon',   'slime'],
  ['cone',    'devil'],
  ['mug',     'robot'],
  ['pot',     'sprout'],
  ['cupcake', 'unicorn'],
  ['barrel',  'cat'],
  ['teacup',  'ghost']
];

const MONSTER_IDS = Object.keys(MONSTERS);

/* =========================================================
   渲染
   ========================================================= */
function bodyGradients(u, m) {
  const [a, b, c] = m.body;
  return `
    <radialGradient id="body-${u}" cx="0.34" cy="0.26" r="0.9">
      <stop offset="0%"   stop-color="${a}"/>
      <stop offset="50%"  stop-color="${b}"/>
      <stop offset="100%" stop-color="${c}"/>
    </radialGradient>
    <radialGradient id="glow-${u}" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="${m.glow}" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="${m.glow}" stop-opacity="0"/>
    </radialGradient>`;
}

function monsterSVG(m, u) {
  const shape = m.shape
    ? m.shape(u)
    : `<ellipse cx="150" cy="128" rx="62" ry="58" fill="url(#body-${u})"/>`;

  const hi = m.highlight === false ? '' : `
    <ellipse cx="122" cy="104" rx="20" ry="12" fill="#fff"
             opacity="${m.hiOpacity ?? 0.22}" transform="rotate(-25 122 104)"/>`;

  const blush = m.blush ? `
    <ellipse cx="104" cy="${m.blushY ?? 148}" rx="11" ry="6" fill="${m.blush}" opacity=".45"/>
    <ellipse cx="196" cy="${m.blushY ?? 148}" rx="11" ry="6" fill="${m.blush}" opacity=".45"/>` : '';

  return `
    <g class="float" style="animation-duration:${m.floatDur || 3}s">
      ${m.extras ? m.extras(u) : ''}
      ${shape}
      ${hi}
      ${blush}
      ${m.face(u)}
    </g>`;
}

function buildCard(vehicleId, monsterId, index) {
  const v = VEHICLES[vehicleId];
  const m = MONSTERS[monsterId];
  const u = `k${index}`;
  const dur = m.floatDur || 3;

  /* 分层绘制：back → 怪物 → front */
  const back = v.renderBack ? v.renderBack(u) : '';

  return `
  <div class="card" data-vehicle="${vehicleId}" data-monster="${monsterId}" data-index="${index}">
    <svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
      <defs>
        ${bodyGradients(u, m)}
        ${v.gradients ? v.gradients(u) : ''}
        ${m.extraGradients ? m.extraGradients(u) : ''}
      </defs>

      <ellipse cx="150" cy="220" rx="130" ry="86" fill="url(#glow-${u})"/>

      <ellipse class="shadow" style="animation-duration:${dur}s"
               cx="150" cy="${v.shadowY}" rx="62" ry="10"
               fill="#000" opacity=".3"/>

      ${back}

      ${monsterSVG(m, u)}

      ${v.render(u)}
    </svg>

    <div class="info">
      <h2>${v.name}</h2>
      <p>${v.en} · ${m.name}</p>
      <span class="swap">点击切换怪物</span>
    </div>
  </div>`;
}

/* ---------- 注入页面 ---------- */
const grid = document.getElementById('grid');
grid.innerHTML = PAIRS.map(([v, m], i) => buildCard(v, m, i)).join('');

/* =========================================================
   交互：点击切换怪物
   ========================================================= */
grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;

  const vehicleId = card.dataset.vehicle;
  const index     = Number(card.dataset.index);
  const cur       = card.dataset.monster;
  const next      = MONSTER_IDS[(MONSTER_IDS.indexOf(cur) + 1) % MONSTER_IDS.length];

  const wrapper = document.createElement('div');
  wrapper.innerHTML = buildCard(vehicleId, next, index).trim();
  const fresh = wrapper.firstElementChild;

  fresh.style.transition = 'none';
  card.replaceWith(fresh);
  requestAnimationFrame(() => { fresh.style.transition = ''; });
});
</script>
