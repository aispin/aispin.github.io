<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄昏小院 · 黑瓦屋顶</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1410;}
  canvas{display:block;}
  #hud{position:fixed;left:22px;bottom:22px;color:#e8d5b8;
       font:12px/1.75 ui-monospace,Menlo,monospace;
       pointer-events:none;letter-spacing:.03em;
       text-shadow:0 1px 4px rgba(0,0,0,.7);}
  #hud b{color:#ffb347;font-weight:600;}

<body>
<div id="hud">
  <b>黄昏小院 · 黑瓦屋顶</b><br>
  拖动旋转 · 滚轮缩放
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd9955e, 0.017);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(6.0, 3.4, 7.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, -1.2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.495;
controls.enablePan = false;

const uTime = { value: 0 };

/* ============================================================
   2. 黄昏天空（GLSL 渐变球）
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    uHorizon: { value: new THREE.Color(0xf2a866) },
    uZenith:  { value: new THREE.Color(0x2b2a4a) },
    uSunDir:  { value: new THREE.Vector3(0.55, 0.12, 0.42).normalize() },
    uSunColor:{ value: new THREE.Color(0xffd9a0) }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uHorizon; uniform vec3 uZenith;
    uniform vec3 uSunDir;  uniform vec3 uSunColor;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 sky = mix(uHorizon, uZenith, pow(h, 0.75));
      float sun = pow(max(dot(dir, uSunDir), 0.0), 24.0);
      sky += uSunColor * sun * 0.85;
      gl_FragColor = vec4(sky, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(70, 32, 24), skyMat));

/* ============================================================
   3. 光照
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xffc890, 0x2a1e18, 0.55));

const sun = new THREE.DirectionalLight(0xffb070, 1.5);
sun.position.set(9, 4.5, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 32;
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
sun.shadow.bias = -0.0012;
scene.add(sun);

const doorLight = new THREE.PointLight(0xffb347, 16, 14, 2);
doorLight.position.set(0, 1.15, -2.45);
doorLight.castShadow = true;
doorLight.shadow.mapSize.set(1024, 1024);
doorLight.shadow.bias = -0.0025;
doorLight.shadow.camera.near = 0.2;
doorLight.shadow.camera.far = 14;
scene.add(doorLight);

const rim = new THREE.DirectionalLight(0x88aaff, 0.35);
rim.position.set(-6, 3, -5);
scene.add(rim);

/* ============================================================
   4. 地面
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(22, 64),
  new THREE.MeshStandardMaterial({ color: 0x7a7a55, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   5. 程序化黑瓦纹理（CanvasTexture）
   —— 这是让屋顶"硬"起来的关键之一
   ============================================================ */
function createTileTexture(cols, rows) {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 深黑灰底（小青瓦的底色不是纯黑，是青灰偏黑）
  ctx.fillStyle = '#0d0d10';
  ctx.fillRect(0, 0, W, H);

  const tw = W / cols;
  const th = H / rows;

  // 逐片绘制瓦片
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const px = x * tw;
      const py = y * th;

      // 每片瓦轻微色差
      const v = 0.82 + Math.random() * 0.36;
      const g = Math.floor(20 + v * 16);

      // 上亮下暗的纵向渐变 —— 模拟瓦片自身的弧度反光
      const grad = ctx.createLinearGradient(px, py, px, py + th);
      grad.addColorStop(0.00, `rgb(${g + 22},${g + 22},${g + 26})`);
      grad.addColorStop(0.18, `rgb(${g + 10},${g + 10},${g + 13})`);
      grad.addColorStop(0.65, `rgb(${g + 2},${g + 2},${g + 4})`);
      grad.addColorStop(1.00, `rgb(${g - 8},${g - 8},${g - 6})`);
      ctx.fillStyle = grad;
      ctx.fillRect(px, py, tw, th);

      // 顶部高光（一片瓦翘起的边缘）
      ctx.strokeStyle = `rgba(160,165,175,${0.08 + Math.random() * 0.10})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px + 1.5, py + 1.2);
      ctx.lineTo(px + tw - 1.5, py + 1.2);
      ctx.stroke();

      // 底部暗边（瓦与瓦搭接的阴影）
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, py + th - 1);
      ctx.lineTo(px + tw, py + th - 1);
      ctx.stroke();
    }
  }

  // 纵向瓦垄间的暗缝
  ctx.strokeStyle = 'rgba(0,0,0,0.92)';
  ctx.lineWidth = 2.5;
  for (let x = 1; x < cols; x++) {
    ctx.beginPath();
    ctx.moveTo(x * tw, 0);
    ctx.lineTo(x * tw, H);
    ctx.stroke();
  }

  // 青苔 —— 越靠坡面下方越密
  for (let i = 0; i < 1200; i++) {
    const x = Math.random() * W;
    const yBias = Math.pow(Math.random(), 0.55);
    const y = H * yBias; // 下半部分更密
    const r = Math.random() * 22 + 4;
    const a = 0.03 + Math.random() * 0.09;
    const green = Math.random() > 0.5 ? [62, 88, 52] : [78, 96, 60];
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${green[0]},${green[1]},${green[2]},${a})`);
    g.addColorStop(1, `rgba(${green[0]},${green[1]},${green[2]},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 斑驳 / 水渍 / 烟熏
  for (let i = 0; i < 700; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = Math.random() * 40 + 6;
    const a = 0.015 + Math.random() * 0.055;
    const isDark = Math.random() > 0.45;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    if (isDark) {
      g.addColorStop(0, `rgba(0,0,0,${a})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
    } else {
      g.addColorStop(0, `rgba(130,130,130,${a})`);
      g.addColorStop(1, 'rgba(130,130,130,0)');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 16;
  return tex;
}

/* ============================================================
   6. 屋顶坡面几何 —— 顶点做瓦垄波纹
   —— 让"硬"起来的第二个关键
   ============================================================ */
function makeRoofPanel(width, slopeLen, lanes, amp) {
  // 分段数越高，波形越圆润；lanes * 6 保证每垄至少 6 段
  const segX = Math.max(160, lanes * 6);
  const segY = 26;
  const geo = new THREE.PlaneGeometry(width, slopeLen, segX, segY);

  const pos = geo.attributes.position;
  const uv  = geo.attributes.uv;

  for (let i = 0; i < pos.count; i++) {
    const u = uv.getX(i);
    const t = u * Math.PI * 2 * lanes;
    // 略微"压扁"波谷，让瓦垄更像小青瓦的圆弧截面
    const s = Math.sin(t);
    const wave = Math.sign(s) * Math.pow(Math.abs(s), 0.75) * amp;
    pos.setZ(i, wave);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/* ============================================================
   7. 老房子（含黑瓦屋顶）
   ============================================================ */
const house = new THREE.Group();
house.position.set(0, 0, -4.6);
scene.add(house);

// —— 主体墙体 ——
const bodyW = 4.2, bodyH = 2.7, bodyD = 3.0;
const wallMat = new THREE.MeshStandardMaterial({ color: 0xa89678, roughness: 0.96 });
const body = new THREE.Mesh(new THREE.BoxGeometry(bodyW, bodyH, bodyD), wallMat);
body.position.y = bodyH / 2;
body.castShadow = true;
body.receiveShadow = true;
house.add(body);

// —— 屋顶尺寸 ——
const roofW  = bodyW + 0.6;   // 4.8，出檐
const roofD  = bodyD + 0.4;   // 3.4，出檐
const roofH  = 1.5;
const eaveY  = bodyH;         // 屋檐高度 = 墙体顶部
const ridgeY = eaveY + roofH; // 屋脊高度
const slopeLen = Math.sqrt(roofH * roofH + (roofD/2) * (roofD/2));

const lanes = 40;             // 瓦垄数（横向分列数）
const amp   = 0.017;          // 瓦垄起伏幅度（约 1.7cm）

const tileTex = createTileTexture(lanes, 10);
const roofMat = new THREE.MeshStandardMaterial({
  map: tileTex,
  roughness: 0.72,
  metalness: 0.08,
  side: THREE.DoubleSide,
  envMapIntensity: 0.4
});

// —— 前坡 ——
const frontGeo = makeRoofPanel(roofW, slopeLen, lanes, amp);
const frontDirY = new THREE.Vector3(0, roofH, -roofD / 2).normalize();
const frontN    = new THREE.Vector3(0, roofD / 2, roofH).normalize();
const frontM    = new THREE.Matrix4().makeBasis(
  new THREE.Vector3(1, 0, 0), frontDirY, frontN
);
frontM.setPosition(0, (eaveY + ridgeY) / 2, roofD / 4);
frontGeo.applyMatrix4(frontM);

const frontRoof = new THREE.Mesh(frontGeo, roofMat);
frontRoof.castShadow = true;
frontRoof.receiveShadow = true;
house.add(frontRoof);

// —— 后坡 ——
const backGeo = makeRoofPanel(roofW, slopeLen, lanes, amp);
const backDirY = new THREE.Vector3(0, roofH, roofD / 2).normalize();
const backN    = new THREE.Vector3(0, roofD / 2, -roofH).normalize();
const backM    = new THREE.Matrix4().makeBasis(
  new THREE.Vector3(-1, 0, 0), backDirY, backN
);
backM.setPosition(0, (eaveY + ridgeY) / 2, -roofD / 4);
backGeo.applyMatrix4(backM);

const backRoof = new THREE.Mesh(backGeo, roofMat);
backRoof.castShadow = true;
backRoof.receiveShadow = true;
house.add(backRoof);

// —— 屋脊压条 ——
const ridgeGeo = new THREE.BoxGeometry(roofW + 0.12, 0.14, 0.28);
const ridgeMat = new THREE.MeshStandardMaterial({
  color: 0x0b0b0e, roughness: 0.82, metalness: 0.05
});
const ridge = new THREE.Mesh(ridgeGeo, ridgeMat);
ridge.position.set(0, ridgeY + 0.04, 0);
ridge.castShadow = true;
ridge.receiveShadow = true;
house.add(ridge);

// —— 两端山墙小封檐（让屋顶看起来有厚度）——
const eaveMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a0c, roughness: 0.9
});
const eaveFront = new THREE.Mesh(
  new THREE.BoxGeometry(roofW, 0.08, 0.10), eaveMat
);
eaveFront.position.set(0, eaveY - 0.02, roofD / 2);
eaveFront.castShadow = true;
house.add(eaveFront);

const eaveBack = eaveFront.clone();
eaveBack.position.z = -roofD / 2;
house.add(eaveBack);

// —— 门框 / 门内自发光 ——
const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1e, roughness: 0.9 });
const frame = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.1, 0.08), frameMat);
frame.position.set(0, 1.05, bodyD / 2 + 0.002);
house.add(frame);

const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.05, 1.85),
  new THREE.MeshBasicMaterial({ color: 0xffd28a })
);
glow.position.set(0, 1.03, bodyD / 2 + 0.05);
house.add(glow);

// —— 窗 ——
const win = new THREE.Mesh(
  new THREE.PlaneGeometry(0.7, 0.7),
  new THREE.MeshBasicMaterial({ color: 0xffbe6a })
);
win.position.set(-1.35, 1.7, bodyD / 2 + 0.005);
house.add(win);

// —— 光锥 ——
const lightCone = new THREE.Mesh(
  new THREE.ConeGeometry(2.6, 5.2, 32, 1, true),
  new THREE.MeshBasicMaterial({
    color: 0xffb347, transparent: true, opacity: 0.055,
    blending: THREE.AdditiveBlending, depthWrite: false,
    side: THREE.DoubleSide
  })
);
lightCone.rotation.x = -Math.PI / 2;
lightCone.position.set(0, 1.05, -0.4);
house.add(lightCone);

/* ============================================================
   8. 柿子树（保持此前逻辑）
   ============================================================ */
const tree = new THREE.Group();
tree.position.set(-3.2, 0, -1.0);
scene.add(tree);

const barkMat = new THREE.MeshStandardMaterial({
  color: 0x5c4632, roughness: 0.95, metalness: 0
});
const fruitPositions = [];
const fruitSizes = [];

function makeBranch(start, end, r1, r2) {
  const dir = end.clone().sub(start);
  const len = dir.length();
  if (len < 1e-4) return;
  const geo = new THREE.CylinderGeometry(r2, r1, len, 6, 1, true);
  geo.translate(0, len / 2, 0);
  const mesh = new THREE.Mesh(geo, barkMat);
  mesh.position.copy(start);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  tree.add(mesh);
}

function grow(start, dir, length, radius, depth) {
  const end = start.clone().add(dir.clone().multiplyScalar(length));
  makeBranch(start, end, radius, radius * 0.72);
  if (depth <= 0) {
    const n = Math.random() < 0.75 ? 1 : 2;
    for (let i = 0; i < n; i++) {
      fruitPositions.push(end.clone().add(new THREE.Vector3(
        (Math.random() - 0.5) * 0.2,
        -0.12 - Math.random() * 0.15,
        (Math.random() - 0.5) * 0.2
      )));
      fruitSizes.push(0.105 + Math.random() * 0.05);
    }
    return;
  }
  const branches = Math.random() < 0.35 ? 3 : 2;
  for (let i = 0; i < branches; i++) {
    const nd = dir.clone();
    const axis = new THREE.Vector3(
      Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
    ).normalize();
    const angle = (0.38 + Math.random() * 0.5) * (i % 2 === 0 ? 1 : -1);
    nd.applyAxisAngle(axis, angle);
    nd.y += 0.22;
    nd.normalize();
    const t = 0.72 + Math.random() * 0.28;
    const bStart = start.clone().lerp(end, t);
    grow(bStart, nd, length * (0.66 + Math.random() * 0.14), radius * 0.64, depth - 1);
  }
}

grow(
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(0.03, 1, 0.02).normalize(),
  1.3, 0.17, 5
);

// 柿子
const fruitGeo = new THREE.SphereGeometry(1, 14, 12);
fruitGeo.scale(1, 0.82, 1);
const fruits = new THREE.InstancedMesh(
  fruitGeo,
  new THREE.MeshStandardMaterial({ color: 0xff6a18, roughness: 0.34 }),
  fruitPositions.length
);
fruits.castShadow = true;
fruits.receiveShadow = true;

const dummy = new THREE.Object3D();
fruitPositions.forEach((p, i) => {
  dummy.position.copy(p);
  dummy.scale.setScalar(fruitSizes[i]);
  dummy.rotation.set(Math.random()*0.6, Math.random()*Math.PI*2, Math.random()*0.6);
  dummy.updateMatrix();
  fruits.setMatrixAt(i, dummy.matrix);
});
fruits.instanceMatrix.needsUpdate = true;
tree.add(fruits);

// 果蒂
const calyxes = new THREE.InstancedMesh(
  new THREE.ConeGeometry(1, 0.5, 4),
  new THREE.MeshStandardMaterial({ color: 0x4c7a34, roughness: 0.8 }),
  fruitPositions.length
);
fruitPositions.forEach((p, i) => {
  const s = fruitSizes[i];
  dummy.position.set(p.x, p.y + s * 0.82, p.z);
  dummy.scale.set(s * 0.55, s * 0.5, s * 0.55);
  dummy.rotation.set(Math.PI, Math.random() * Math.PI, 0);
  dummy.updateMatrix();
  calyxes.setMatrixAt(i, dummy.matrix);
});
calyxes.instanceMatrix.needsUpdate = true;
tree.add(calyxes);

// 叶子
const leafShape = new THREE.Shape();
leafShape.moveTo(0, 0);
leafShape.bezierCurveTo(0.35, 0.35, 0.42, 0.95, 0, 1.25);
leafShape.bezierCurveTo(-0.42, 0.95, -0.35, 0.35, 0, 0);
const leafGeo = new THREE.ShapeGeometry(leafShape, 8);
leafGeo.scale(0.11, 0.14, 0.11);

const leaves = new THREE.InstancedMesh(
  leafGeo,
  new THREE.MeshStandardMaterial({
    color: 0x3f7a3a, roughness: 0.72, side: THREE.DoubleSide
  }),
  260
);
leaves.castShadow = true;
for (let i = 0; i < 260; i++) {
  const r = 0.5 + Math.random() * 1.5;
  const a = Math.random() * Math.PI * 2;
  dummy.position.set(Math.cos(a)*r, 1.7 + Math.random()*2.0, Math.sin(a)*r);
  dummy.rotation.set(
    -Math.PI/2 + (Math.random()-0.5)*1.6,
    Math.random()*Math.PI*2,
    (Math.random()-0.5)*1.2
  );
  dummy.scale.setScalar(0.8 + Math.random()*0.7);
  dummy.updateMatrix();
  leaves.setMatrixAt(i, dummy.matrix);
}
leaves.instanceMatrix.needsUpdate = true;
tree.add(leaves);

// GLSL 风动注入
function applyWind(mesh, strength) {
  mesh.material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = uTime;
    shader.uniforms.uWindDir = { value: new THREE.Vector3(1, 0, 0.4).normalize() };
    shader.uniforms.uStrength = { value: strength };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        uniform float uTime;
        uniform vec3  uWindDir;
        uniform float uStrength;
      `)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        vec3 wp = (instanceMatrix * vec4(0.0,0.0,0.0,1.0)).xyz;
        float sway =
            sin(uTime*1.5 + wp.y*1.2 + wp.x*0.7)*0.5
          + sin(uTime*2.6 + wp.z*1.5)*0.5;
        transformed += uWindDir * sway * uStrength;
      `);
  };
  mesh.material.needsUpdate = true;
}
applyWind(leaves, 0.03);
applyWind(fruits, 0.015);

/* ============================================================
   9. 石桌 + 祖孙三人 + 小狗（精简版）
   ============================================================ */
const stoneMat = new THREE.MeshStandardMaterial({
  color: 0x9a9188, roughness: 0.96, metalness: 0
});
const tableTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.78, 0.78, 0.13, 28), stoneMat
);
tableTop.position.set(1.3, 0.72, 0.3);
tableTop.castShadow = true; tableTop.receiveShadow = true;
scene.add(tableTop);

const tableLeg = new THREE.Mesh(
  new THREE.CylinderGeometry(0.2, 0.28, 0.72, 16), stoneMat
);
tableLeg.position.set(1.3, 0.36, 0.3);
tableLeg.castShadow = true; tableLeg.receiveShadow = true;
scene.add(tableLeg);

function makeStool(x, z) {
  const s = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.25, 0.4, 12),
    new THREE.MeshStandardMaterial({ color: 0x6b5a48, roughness: 0.95 })
  );
  s.position.set(x, 0.2, z);
  s.castShadow = true; s.receiveShadow = true;
  return s;
}

function makePerson(color, scale) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.92 });
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xd9b38c, roughness: 0.85 });
  const legMat  = new THREE.MeshStandardMaterial({ color: 0x3a3028, roughness: 0.95 });
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.3, 4, 10), bodyMat);
  torso.position.y = 0.62; torso.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.135, 14, 12), skinMat);
  head.position.y = 0.98; head.castShadow = true;
  const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.3, 3, 8), legMat);
  legL.rotation.x = Math.PI / 2;
  legL.position.set(-0.09, 0.42, 0.22); legL.castShadow = true;
  const legR = legL.clone(); legR.position.x = 0.09;
  g.add(torso, head, legL, legR);
  g.scale.setScalar(scale);
  return g;
}

/* ============================================================
   10. 萤火虫
   ============================================================ */
const FF_COUNT = 90;
const ffPos = new Float32Array(FF_COUNT * 3);
const ffPhase = new Float32Array(FF_COUNT);
for (let i = 0; i < FF_COUNT; i++) {
  ffPos[i*3]   = (Math.random()-0.5)*10;
  ffPos[i*3+1] = 0.3 + Math.random()*2.6;
  ffPos[i*3+2] = (Math.random()-0.5)*10 - 0.5;
  ffPhase[i]   = Math.random()*Math.PI*2;
}
const ffGeo = new THREE.BufferGeometry();
ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
ffGeo.setAttribute('aPhase',  new THREE.BufferAttribute(ffPhase, 1));

const ffMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{
    uTime: uTime,
    uSize: { value: 55.0 },
    uColor:{ value: new THREE.Color(0xffd98a) }
  },
  vertexShader:`
    attribute float aPhase;
    uniform float uTime; uniform float uSize;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      p.x += sin(uTime*0.6 + aPhase)*0.28;
      p.y += sin(uTime*0.9 + aPhase*1.7)*0.20;
      p.z += cos(uTime*0.5 + aPhase)*0.28;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_PointSize = uSize * (1.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vAlpha = 0.30 + 0.70*(0.5 + 0.5*sin(uTime*2.2 + aPhase*3.1));
    }
  `,
  fragmentShader:`
    uniform vec3 uColor;
    varying float vAlpha;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(uColor, a * vAlpha);
    }
  `
});
scene.add(new THREE.Points(ffGeo, ffMat));

/* ============================================================
   11. 渲染循环
   ============================================================ */
const clock = new THREE.Clock();
function animate() {
  const dt = clock.getDelta();
  uTime.value += dt;
  dogTail.rotation.z = 0.7 + Math.sin(uTime.value * 6.0) * 0.35;
  doorLight.intensity = 16 + Math.sin(uTime.value * 1.6) * 1.2;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
