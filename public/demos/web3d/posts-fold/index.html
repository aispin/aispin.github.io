<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../../_from.js" defer></script>
<title>经折 · Accordion Article Room</title>
<meta name="description" content="文稿房间的空间语言：一条经折装的长纸，一折一篇，沿对角线退进暗处，当前这一折立起来面对你。滚轮一折一翻，点开是阅读层。纯 CSS 3D + DOM，每个字都是真文本。">
<style>
@font-face{
  font-family:'MapleUI';
  src:url('/fonts/maple-ui.woff2') format('woff2');
  font-weight:400 500;font-display:swap;
}
:root{
  --ink:#141110;
  --ink-2:#1c1815;
  --paper:#f0e9dc;
  --paper-2:#e2d9c8;
  --paper-edge:#c9bda8;
  --text:#241f1a;
  --text-soft:#6d6257;
  --vermilion:#b23a2c;
  --w:300px;
  --h:420px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(60% 46% at 76% 58%, rgba(126,86,52,.13), rgba(126,86,52,0) 70%),
    radial-gradient(1200px 820px at 26% 18%, #241d18 0%, #171311 46%, #0b0908 100%);
  color:#e8e0d4;
  font-family:'MapleUI',ui-monospace,'PingFang SC',monospace;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

#dust{position:fixed;inset:0;pointer-events:none;opacity:.7}

.stage{
  position:fixed;inset:0;
  perspective:1900px;
  perspective-origin:52% 46%;
  cursor:grab;
}
.stage.dragging{cursor:grabbing}

.ribbon{
  position:absolute;left:50%;top:50%;
  width:0;height:0;
  transform-style:preserve-3d;
  transform:translate3d(var(--sx), -1%, 0) rotateX(-3deg) rotateY(26deg);
  will-change:transform;
}

.fold{
  position:absolute;
  left:calc(var(--w) / -2);
  top:calc(var(--h) / -2);
  width:var(--w);
  height:var(--h);
  transform-style:preserve-3d;
  transform-origin:50% 50%;
  overflow:hidden;
  border-radius:2px;
  background:
    linear-gradient(90deg, rgba(64,48,30,.20) 0%, rgba(64,48,30,0) 10%, rgba(64,48,30,0) 90%, rgba(64,48,30,.14) 100%),
    linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 18%),
    linear-gradient(172deg, var(--paper) 0%, var(--paper-2) 100%);
  box-shadow:
    0 26px 64px -22px rgba(0,0,0,.9),
    inset 0 0 0 1px rgba(120,105,86,.22),
    inset 14px 0 22px -18px rgba(90,74,56,.5);
  color:var(--text);
  cursor:pointer;
  transition:transform .66s cubic-bezier(.22,.61,.36,1), opacity .5s ease;
  will-change:transform,opacity;
}
.fold::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg, transparent, rgba(178,58,44,.55) 12%, rgba(178,58,44,.55) 88%, transparent);
  opacity:.55;
}
.fold::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(92% 72% at 22% 3%, rgba(255,255,255,.42), rgba(255,255,255,0) 64%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.055'/></svg>");
  mix-blend-mode:multiply;
}
.fold.is-focus{
  box-shadow:
    0 46px 110px -34px rgba(0,0,0,.96),
    0 6px 18px -8px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(120,105,86,.26),
    inset 16px 0 26px -20px rgba(90,74,56,.55);
}
.fold.is-away{
  background:
    linear-gradient(90deg, rgba(52,40,26,.30) 0%, rgba(52,40,26,0) 11%, rgba(52,40,26,0) 89%, rgba(52,40,26,.22) 100%),
    linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 18%),
    linear-gradient(172deg, #cfc5b3 0%, #bdb2a0 100%);
}

.pad{position:absolute;inset:0;padding:26px 24px 22px;display:flex;flex-direction:column}

.idx{
  font-size:9.5px;letter-spacing:.22em;color:var(--vermilion);
  display:flex;align-items:center;gap:10px;
}
.idx i{display:block;width:26px;height:1px;background:currentColor;opacity:.55;font-style:normal}

.title{
  margin-top:auto;
  font-size:19px;line-height:1.6;font-weight:500;letter-spacing:.01em;
  text-wrap:balance;
}
.title em{font-style:normal;color:var(--vermilion)}

.excerpt{
  margin-top:10px;font-size:10.5px;line-height:1.9;color:#7c6f61;
  max-width:26ch;
}

.meta{
  margin-top:12px;padding-top:10px;
  border-top:1px solid rgba(90,74,56,.22);
  font-size:9.5px;line-height:1.85;color:var(--text-soft);
  display:flex;flex-direction:column;gap:2px;
}
.meta b{font-weight:400;color:var(--text);letter-spacing:.02em}

.ghost{
  position:absolute;right:16px;top:8px;
  font-size:74px;line-height:1;letter-spacing:-.04em;
  color:rgba(84,68,48,.13);pointer-events:none;
}
.fold.is-focus .ghost{color:rgba(84,68,48,.05)}

.folio{
  position:absolute;right:24px;bottom:18px;
  font-size:8.5px;letter-spacing:.18em;color:#9a8b78;
}

.fold:not(.is-focus) .title,
.fold:not(.is-focus) .excerpt,
.fold:not(.is-focus) .meta,
.fold:not(.is-focus) .cta,
.fold:not(.is-focus) .folio{
  opacity:0;transition:opacity .38s ease;
}
.fold.is-focus .title,
.fold.is-focus .excerpt,
.fold.is-focus .meta,
.fold.is-focus .folio{opacity:1;transition:opacity .5s ease .1s}

.cta{
  margin-top:12px;font-size:9.5px;letter-spacing:.14em;color:var(--vermilion);
  display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(4px);
  transition:opacity .45s ease .12s, transform .45s ease .12s;
}
.fold.is-focus .cta{opacity:1;transform:none}
.cta span{display:block;width:18px;height:1px;background:currentColor}

/* ---------- HUD ---------- */
.beam{
  position:fixed;left:4%;top:-30%;width:62%;height:170%;z-index:4;
  pointer-events:none;transform:rotate(-9deg);filter:blur(34px);
  background:linear-gradient(100deg, rgba(255,241,220,0) 0%, rgba(255,241,220,.055) 42%, rgba(255,241,220,0) 74%);
}
.scrim{position:fixed;inset:0;pointer-events:none;z-index:5}
.scrim::before{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(to left, rgba(11,9,8,.97) 0%, rgba(11,9,8,.6) 16%, rgba(11,9,8,0) 42%),
    linear-gradient(to top, rgba(11,9,8,.88) 0%, rgba(11,9,8,0) 26%),
    linear-gradient(to right, rgba(11,9,8,.5) 0%, rgba(11,9,8,0) 16%);
}
.scrim::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(115% 95% at 46% 44%, rgba(0,0,0,0) 36%, rgba(0,0,0,.6) 100%);
}
.hud{position:fixed;inset:0;pointer-events:none;z-index:10}

/* 回房间胶囊。样式照 _lab.css 那套，但换成这间的暖色，否则一块冷灰
   贴在墨色背景上像外来的零件。文案与 href 由 _from.js 改写。 */
.lab-back{
  position:absolute;left:48px;top:20px;pointer-events:auto;
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;
  font-size:10.5px;letter-spacing:.18em;text-decoration:none;
  color:#8d8073;background:rgba(255,246,232,.03);
  border:1px solid rgba(200,186,168,.16);
  transition:color .18s ease,border-color .18s ease;
}
.lab-back:hover{color:#efe7db;border-color:rgba(200,186,168,.34)}

/* 标题让出胶囊那一行（top 20 + 高 26 ⇒ 从 56 起） */
.hud__tl{position:absolute;left:48px;top:56px;pointer-events:auto}
.hud__tl h1{
  font-size:12px;font-weight:500;letter-spacing:.34em;color:#efe7db;
}
.hud__tl p{
  margin-top:10px;font-size:11px;letter-spacing:.12em;color:#7d7266;line-height:1.9;
}
.hud__tl p b{font-weight:400;color:#b9ac9b}

/* ---------- 底部控制条 ---------- */
/* 页码 / 语言 / 搜索全压到底边中点。3D 房子顶部已经有站级菜单，
   这间再往右上角堆一排，视线就得在画面上下两个角之间来回跳。 */
.hud__bc{
  /* 不能写 left:50% + translateX(-50%)：绝对定位元素的收缩宽度上限是
     "容器宽 − left"，窄屏上只剩半屏，按钮会被压成竖排（中文 竖着写）。
     left:0;right:0;margin:0 auto;width:max-content 才是真居中。 */
  position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);
  bottom:calc(24px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:2px;pointer-events:auto;
  padding:4px;border-radius:999px;
  background:rgba(20,16,13,.62);
  border:1px solid rgba(200,186,168,.19);
  box-shadow:0 16px 40px -22px rgba(0,0,0,.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.hud__bc button{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:inherit;font-size:10.5px;letter-spacing:.18em;
  color:#7d7266;padding:6px 11px;border-radius:999px;white-space:nowrap;
  transition:color .22s ease,background .22s ease;
}
.hud__bc button:hover{color:#cfc3b3}
.hud__bc button[aria-pressed="true"]{color:#efe7db;background:rgba(255,255,255,.07)}
.hud__pos{
  padding:0 2px 0 10px;font-size:10.5px;letter-spacing:.18em;color:#9a8d7e;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.hud__sep{width:1px;height:11px;background:rgba(200,186,168,.16);margin:0 4px}
.hud__loc{display:flex;gap:1px}
/* 房间版带 ?loc= 进来：语言跟随房子，这一组连分隔线一起摘掉。
   不能只靠 [hidden] —— .hud__loc 自己声明了 display:flex，会压过 UA 的 [hidden]。 */
.hud__bc.is-locked .hud__loc,
.hud__bc.is-locked .hud__sep{display:none}

/* 搜索图标：放大镜，32×26 的点击区 */
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:26px;padding:0}
.menu-btn svg{display:block;opacity:.85}
.menu-btn:hover svg{opacity:1}
.menu-btn[aria-expanded="true"]{color:var(--vermilion);background:rgba(178,58,44,.1)}
.menu-btn[aria-expanded="true"] svg{opacity:1}

/* ---------- 目录 ---------- */
.menu{position:fixed;inset:0;z-index:60;pointer-events:none}
.menu__scrim{
  position:absolute;inset:0;background:rgba(8,6,5,.6);
  opacity:0;transition:opacity .42s ease;
}
.menu__panel{
  position:absolute;left:0;right:0;top:0;
  max-height:min(66vh,640px);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg, rgba(32,27,22,.985), rgba(19,16,13,.975));
  border-bottom:1px solid rgba(178,58,44,.3);
  box-shadow:0 34px 90px -34px rgba(0,0,0,.92);
  transform:translateY(-100%);
  transition:transform .52s cubic-bezier(.22,.61,.36,1);
}
.menu.is-open{pointer-events:auto}
.menu.is-open .menu__scrim{opacity:1}
.menu.is-open .menu__panel{transform:none}

.menu__head{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:26px 48px 16px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.menu__label{font-size:10px;letter-spacing:.3em;color:var(--vermilion);white-space:nowrap}
.menu__q{
  flex:1;min-width:180px;appearance:none;background:transparent;border:0;outline:0;
  font-family:inherit;font-size:15px;letter-spacing:.02em;color:#efe7db;
  padding:5px 0;border-bottom:1px solid rgba(200,186,168,.18);
  transition:border-color .25s ease;
}
.menu__q::placeholder{color:#5f564c}
.menu__q:focus{border-bottom-color:rgba(178,58,44,.7)}
.menu__q::-webkit-search-cancel-button{filter:grayscale(1) opacity(.5)}
.menu__count{font-size:10px;letter-spacing:.16em;color:#6d6257;white-space:nowrap}

.menu__list{
  list-style:none;margin:0;padding:6px 0 20px;
  overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(200,186,168,.22) transparent;
}
.row{
  display:grid;grid-template-columns:54px 1fr auto;gap:18px;align-items:baseline;
  padding:12px 48px;cursor:pointer;
  border-left:2px solid transparent;
  transition:background .2s ease,border-color .2s ease;
}
.row:hover,.row.is-active{background:rgba(255,255,255,.045);border-left-color:var(--vermilion)}
.row__n{font-size:10px;letter-spacing:.16em;color:#6d6257}
.row__t{font-size:14.5px;line-height:1.55;color:#d5cabb;min-width:0}
.row__d{font-size:10.5px;letter-spacing:.1em;color:#6d6257;white-space:nowrap}
.row.is-current .row__n{color:var(--vermilion)}
.row.is-current .row__t{color:#fff}
.menu__empty{padding:38px 48px;font-size:12px;letter-spacing:.06em;color:#6d6257}

/* 左下只剩操作提示（页码已经移进底部控制条） */
.hud__bl{
  position:absolute;left:48px;bottom:30px;
  font-size:10.5px;letter-spacing:.14em;color:#6d6257;line-height:2;
}
.hud__bl b{font-weight:400;color:#a99d8d}

/* ---------- reader ---------- */
.reader{
  position:fixed;inset:0;z-index:40;
  /* 上下各留 24px：纸直接撑满视窗高度，读长文不用在一个小框里滚。
     不用 100vh —— fixed + inset:0 本来就是布局视窗，移动端地址栏伸缩时更稳。 */
  /* 用 flex 而不是 grid：grid 的 auto 行只会"有富余时撑高"，内容超了照样
     按内容长（纸被撑到两千多像素、页眉滚出视窗）。flex 的交叉轴 stretch
     是硬的：子项高度 = 容器高 - 上下 padding。 */
  padding:24px;display:flex;align-items:stretch;justify-content:center;
  background:rgba(8,6,5,.72);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .45s ease;
}
.reader.is-open{opacity:1;pointer-events:auto}
.sheet{
  --pad:58px;
  width:min(720px,100%);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#f4eee2,#eae2d3);
  color:var(--text);border-radius:3px;
  border-left:2px solid var(--vermilion);
  box-shadow:0 40px 120px -30px rgba(0,0,0,.9);
  transform:translateY(18px) scale(.985);
  transition:transform .5s cubic-bezier(.22,.61,.36,1);
}
.reader.is-open .sheet{transform:none}
/* 页眉固定、正文滚动：滚到一半，「ESC 关闭」还在原地。
   以前关闭按钮绝对定位在视窗右上角，纸一撑满就会压到标题上。 */
.sheet__bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:13px var(--pad);
  border-bottom:1px solid rgba(90,74,56,.16);
  background:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0));
}
.sheet__pos{
  font-size:10px;letter-spacing:.2em;color:#9a8b78;
  font-variant-numeric:tabular-nums;
}
.sheet__body{
  /* min-height:0 是必须的：flex 子项的自动最小尺寸默认是内容高度，
     不写它 overflow:auto 永远不触发，正文会把纸撑破而不是自己滚 */
  flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;
  padding:34px var(--pad) 34px;
  scrollbar-width:thin;scrollbar-color:rgba(90,74,56,.28) transparent;
}
/* 文末：短稿时用 margin-top:auto 钉在纸底，否则纸下面会空一大片；
   长稿就正常跟在正文后面。 */
.sheet__foot{
  margin-top:auto;padding-top:30px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  font-size:10.5px;letter-spacing:.16em;
}
.sheet__foot .fin{color:#b3a692}
.sheet__foot .nav{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:inherit;font-size:10.5px;letter-spacing:.16em;
  color:#8a7f72;padding:7px 10px;border-radius:999px;
  transition:color .2s ease,background .2s ease;
}
.sheet__foot .nav:hover{color:#3a332c;background:rgba(90,74,56,.09)}
.sheet__foot .nav[disabled]{color:#c2b8a8;cursor:default;background:none}
.sheet h2{font-size:26px;line-height:1.6;font-weight:500;letter-spacing:.01em}
.sheet .sub{margin-top:14px;font-size:11px;letter-spacing:.14em;color:var(--text-soft)}
.sheet hr{border:0;border-top:1px solid rgba(90,74,56,.2);margin:26px 0}
.sheet p{font-size:14px;line-height:2.05;color:#3a332c;margin-bottom:16px}
.sheet .note{
  margin-top:26px;padding:14px 16px;background:rgba(178,58,44,.06);
  border-left:2px solid var(--vermilion);font-size:11px;line-height:2;color:#7a4a3f;
}
.close{
  appearance:none;border:0;background:transparent;
  color:#8a7f72;font-family:inherit;font-size:10px;letter-spacing:.2em;cursor:pointer;
  padding:6px 10px;border-radius:999px;
  transition:color .2s ease,background .2s ease;
}
.close:hover{color:#3a332c;background:rgba(90,74,56,.09)}

@media (max-width:900px){
  :root{--w:300px;--h:420px}
  /* 窄屏把表头改成两行：第一行「目录 · INDEX … 10 篇」，第二行搜索框通栏。
     用 flex-wrap 让它自己折会把"10 篇"甩到第三行左边，很脏。 */
  .menu__head{
    display:grid;grid-template-columns:1fr auto;
    gap:9px 12px;padding:18px 24px 12px;
  }
  .menu__label{grid-column:1;grid-row:1}
  .menu__count{grid-column:2;grid-row:1;justify-self:end}
  .menu__q{grid-column:1 / -1;grid-row:2;min-width:0}
  /* 窄屏把日期挪到标题下面：三列挤在 342px 里，标题只剩 13 个字，
     "使用 Semantic-Release 和 Github Workflow…" 要折三行。 */
  .row{
    grid-template-columns:28px 1fr;gap:3px 12px;padding:11px 24px 12px;
  }
  .row__n{grid-column:1;grid-row:1}
  .row__t{grid-column:2;grid-row:1}
  .row__d{grid-column:2;grid-row:2;font-size:10px}
  .row__t{font-size:13.5px}
  .menu__empty{padding:30px 24px}
  /* 胶囊占第一行，标题让到它下面 —— 原来两边都落在 top 20~26，直接叠字 */
  .lab-back{left:24px;top:16px}
  .hud__tl{left:24px;top:50px}
  .hud__bc{bottom:calc(16px + env(safe-area-inset-bottom))}
  /* 窄屏藏掉左下提示：它会和居中的控制条撞在一起 */
  .hud__bl{display:none}
  .title{font-size:19px}
  .pad{padding:28px 24px 24px}
  .sheet{--pad:26px}
  .sheet__body{padding:26px var(--pad) 40px}
}
@media (prefers-reduced-motion:reduce){
  .fold,.reader,.sheet,.cta{transition-duration:.01s}
}

/* 减少动态偏好：翻折、开合全部瞬时完成。
   用 !important 是因为过渡分散在 .fold / .fold.is-focus .title / .reader 上，
   逐条覆盖会漏；这里只有"停掉"一个意图，压过优先级是合理的。 */
@media (prefers-reduced-motion: reduce) {
  .fold, .fold *, .reader, .sheet, .menu__panel, .menu__scrim {
    transition-duration: 0s !important;
    transition-delay: 0s !important;
  }
}
</style>
</head>
<body>
<canvas id="dust"></canvas>

<div class="stage" id="stage">
  <div class="ribbon" id="ribbon"></div>
</div>

<div class="beam"></div>
<div class="scrim"></div>

<div class="hud">
  <a class="lab-back" href="/demos/">← Demos</a>
  <div class="hud__tl">
    <h1>文稿 · POSTS</h1>
    <p>经折 · <b id="count">10</b> 篇<span id="dual"> · 中英双语</span></p>
  </div>

  <div class="hud__bc" id="bc">
    <span class="hud__pos" id="pos">01 / 10</span>
    <span class="hud__sep"></span>
    <!-- 语言按钮单独包一层：搜索按钮不能落在 #locale 里，
         否则那边的 click 处理器会把它当成语言按钮（dataset.loc 是空的）。
         房间版带 ?loc= 进来时，这一组和两条分隔线一起摘掉。 -->
    <div class="hud__loc" id="locale">
      <button data-loc="zh" aria-pressed="true">中文</button>
      <button data-loc="en" aria-pressed="false">EN</button>
    </div>
    <span class="hud__sep"></span>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu"
            aria-label="搜索目录" title="搜索目录（/）">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="1.35" stroke-linecap="round" aria-hidden="true">
        <circle cx="6.9" cy="6.9" r="4.5"/>
        <path d="M10.2 10.2 14 14"/>
      </svg>
    </button>
  </div>
  <div class="hud__bl">滚轮 / 拖拽 翻阅 · 点击展开 · <b>/</b> 搜索</div>
</div>

<!-- 目录：从顶部滑下来的一整条，带搜索。翻一百篇也不靠一格一格滚。 -->
<div class="menu" id="menu" aria-hidden="true">
  <div class="menu__scrim" id="menuScrim"></div>
  <section class="menu__panel" role="dialog" aria-modal="true" aria-label="文章目录">
    <div class="menu__head">
      <span class="menu__label">目录 · INDEX</span>
      <input id="q" class="menu__q" type="search" placeholder="搜索标题 / 标签 / 日期" autocomplete="off" spellcheck="false" />
      <span class="menu__count" id="mcount"></span>
    </div>
    <ul class="menu__list" id="mlist"></ul>
  </section>
</div>

<div class="reader" id="reader">
  <article class="sheet" id="sheet">
    <div class="sheet__bar">
      <span class="sheet__pos" id="spos"></span>
      <button class="close" id="close">ESC 关闭</button>
    </div>
    <div class="sheet__body" id="sbody"></div>
  </article>
</div>

<!-- 一格一页的输入层（滚轮 / 拖动 / 方向键），判据与 craft 房间同一套 -->
<script src="../../_pager.js"></script>
<script>
const DATA = {
  zh: [
    { t:'使用 Express.js 构建你的第一个 API：初学者指南', x:'从零搭一个能跑的 HTTP 服务，七步走完。', d:'2023.11.02', g:'Node.js · Express', n:'1,667 字' },
    { t:'使用 Semantic-Release 和 Github Workflow 实现自动化版本发布', x:'提交信息即版本号：把发版从手工流程变成流水线。', d:'2024.08.10', g:'CICD · Semantic-Release', n:'2,470 字' },
    { t:'Vitest 模拟第三方模块指南', x:'vi.mock 的三种写法，以及 hoisting 为什么让你踩坑。', d:'2025.08.26', g:'Vitest · Mock · Unit Test', n:'3,659 字' },
    { t:'Neon serverless-driver 结合 Vercel、阿里云实战指南', x:'在 Vercel 与函数计算之间，把 Postgres 连接池跑通。', d:'2024.08.26', g:'Serverless · Neon · PostgreSQL', n:'6,952 字' },
    { t:'教大家更直观的理解 Docker', x:'一层层叠起来，理解镜像、容器和它们的关系。', d:'2024.08.05', g:'Docker · 容器技术', n:'5,384 字' },
    { t:'如何使用 Canvas 将 SVG 转换为 PNG', x:'不借助后端，在浏览器里栅格化并下载。', d:'2023.11.22', g:'Canvas · SVG', n:'1,658 字' },
    { t:'亚马逊和美团的领导力原则', x:'亚马逊十四条与美团的土办法，哪些真的能落地。', d:'2024.03.06', g:'领导力原则', n:'4,002 字' },
    { t:'美团公司的目标管理实践总结', x:'目标管理在真实组织里最容易走形的三个地方。', d:'2023.11.02', g:'目标管理 · OKR · SMART', n:'4,125 字' },
    { t:'SWOT 在业务策划及组织管理中的应用', x:'把 SWOT 从表格变成决策工具，而不是事后总结。', d:'2021.11.11', g:'SWOT · 分析策略', n:'1,687 字' },
    { t:'京东公司的过程管理实践总结', x:'Scrum、MVP、PDCA 三个词，是怎么串起来的。', d:'2022.05.06', g:'过程管理 · 敏捷开发 · MVP', n:'882 字' }
  ],
  en: [
    { t:'Building Your First API with Express.js', x:'Seven steps from an empty folder to a running server.', d:'2023.11.02', g:'Node.js · Express', n:'2,899 w' },
    { t:'Automating Releases with Semantic-Release and GitHub Actions', x:'Commit messages as version numbers, without a checklist.', d:'2024.08.10', g:'CICD · Semantic-Release', n:'4,084 w' },
    { t:'A more intuitive understanding of Docker', x:'Images, containers and layers, explained by building one up.', d:'2024.08.05', g:'Docker · Containers', n:'12,724 w' },
    { t:'How to convert a SVG to PNG using Canvas', x:'Rasterise a vector in the browser and download it, no backend.', d:'2023.11.22', g:'Canvas · SVG', n:'3,011 w' },
    { t:'Leadership Principles of Amazon and Meituan', x:"Amazon's fourteen and Meituan's own — what survives contact.", d:'2024.03.06', g:'Leadership', n:'11,674 w' },
    { t:"Summary of Meituan's Goal Management Practices", x:'Three places goal management quietly bends in a real org.', d:'2023.11.02', g:'OKR · SMART', n:'12,087 w' },
    { t:'SWOT in Business Planning and Organizational Management', x:'From a table of quadrants to an actual decision.', d:'2021.11.11', g:'SWOT', n:'5,077 w' },
    { t:'Summary of Process Management Practices at JD.com', x:'Scrum, MVP, PDCA — how the three connect in practice.', d:'2022.05.06', g:'Agile · MVP', n:'2,387 w' }
  ]
};

const Q = new URLSearchParams(location.search);
/* 窄屏：折页仍是 300×420（字号按它排的），只是不再放大、位置收回中间，
   折带留在右侧当背景。改尺寸会连带改字号，那才是真的会崩。 */
const NARROW = innerWidth < 760;
const W = +(Q.get('w') ?? 300), H = +(Q.get('h') ?? 420);
const ALPHA = +(Q.get('alpha') ?? (NARROW ? 18 : 24));
const RIBBON_YAW = +(Q.get('yaw') ?? (NARROW ? 22 : 30));
const FOCUS_X = +(Q.get('fx') ?? (NARROW ? -26 : -180));
const STEP = W * Math.cos(ALPHA * Math.PI / 180);
const FOCUS_S = +(Q.get('fs') ?? (NARROW ? 1.04 : 1.45));
const FOG = +(Q.get('fog') ?? (NARROW ? 0.3 : 0.17));
const SHIFT = +(Q.get('sx') ?? (NARROW ? 0 : 4));
const ribbon = document.getElementById('ribbon');
ribbon.style.setProperty('--sx', SHIFT + '%');
document.documentElement.style.setProperty('--w', W + 'px');
document.documentElement.style.setProperty('--h', H + 'px');
const stage = document.getElementById('stage');
const reader = document.getElementById('reader');
const sheetBody = document.getElementById('sbody');
const spos = document.getElementById('spos');

/* 房间版：语言跟随房子，不再自带切换。
   带 ?loc=zh|en 进来就锁死这一种，并把控制条里的语言组整个摘掉
   （房子那边切语言会换参数重建这一页，不需要两个切换器打架）。 */
const LOCK_LOC = (() => {
  const v = (Q.get('loc') || '').toLowerCase();
  return v === 'zh' || v === 'en' ? v : null;
})();

let loc = LOCK_LOC || 'zh';
let k = 0;
let folds = [];
let open = false;
let menuOpen = false;

const pad2 = (n) => String(n + 1).padStart(2, '0');

function build() {
  const list = DATA[loc];
  k = Math.min(k, list.length - 1);
  document.getElementById('count').textContent = list.length;
  ribbon.innerHTML = '';
  folds = list.map((a, i) => {
    const el = document.createElement('div');
    el.className = 'fold';
    el.innerHTML =
      '<div class="pad">' +
        '<div class="idx"><i></i>' + pad2(i) + '</div>' +
        '<h3 class="title">' + a.t + '</h3>' +
        '<p class="excerpt">' + a.x + '</p>' +
        '<div class="meta"><span><b>' + a.d + '</b></span><span>' + a.g + '</span><span>' + a.n + '</span></div>' +
        '<div class="cta"><span></span>阅读全文</div>' +
      '</div>' +
      '<div class="ghost">' + pad2(i) + '</div>' +
      '<div class="folio">' + pad2(i) + ' / ' + pad2(list.length - 1) + '</div>';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      /* 拖完松手浏览器会补一次 click —— 不拦就会"手滑点错"变成翻页或弹窗 */
      if (pager.wasDragged()) return;
      if (i === k) openReader(); else go(i);
    });
    ribbon.appendChild(el);
    return el;
  });
  render();
}

function render() {
  folds.forEach((el, i) => {
    const s = i - k;
    let x = s * STEP;
    let y = -s * 7;
    let z = 0;
    let yaw = (i % 2 ? -ALPHA : ALPHA);
    let rx = 0;
    let sc = 1;
    let op = 0;

    if (s === 0) {
      yaw = -RIBBON_YAW;
      rx = 3;
      sc = FOCUS_S;
      z = 70;
      x = FOCUS_X;
      op = 1;
      el.classList.add('is-focus');
      el.classList.remove('is-away');
    } else if (s > 0) {
      op = Math.max(0, 1 - s * FOG);
      x += 22 * (1 - op);
      el.classList.remove('is-focus');
      el.classList.toggle('is-away', i % 2 === 1);
    } else {
      op = 0;
      x -= 180;
      el.classList.remove('is-focus');
    }

    el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px) rotateY(' + yaw + 'deg) rotateX(' + rx + 'deg) scale(' + sc + ')';
    el.style.opacity = op;
    el.style.filter = s === 0 ? 'none'
      : 'blur(' + Math.min(1.2 + s * 0.9, 4).toFixed(2) + 'px) brightness(.86)';
    el.style.transitionDelay = reduce ? '0ms' : Math.min(Math.abs(s) * 26, 130) + 'ms, 0ms';
  });
  pos.textContent = pad2(k) + ' / ' + pad2(DATA[loc].length - 1);
}

function go(n) {
  const max = DATA[loc].length - 1;
  const next = Math.max(0, Math.min(max, n));
  if (next === k) return;
  k = next;
  render();
}

/* 版式示意用的占位正文。真接入后这一段由构建期从 md 渲成 HTML 片段，
   静态页与这层共用同一份。 */
const BODY = [
  '这一层是版式示意，不是真正文。折页上四个位置——标题、摘要、日期 / 标签 / 字数、朱砂色「阅读全文」——就是 frontmatter 里 <code>title / description / date / tags</code> 的去处。',
  '折带的好处是它不挑长度：一折一篇，篇数涨到 100，带子只是更长，不用改设计。这也是它取代 4×N 卡片墙的理由——卡墙到 20 张就开始挤。',
  '纸撑满视窗高度、上下各留 24px，是为了让长文不必在一个小框里滚。页眉（序号 / 日期 / 关闭）不参与滚动，滚到一半仍然在。',
  '排版只认一条规则：一栏，最大宽度 720px，行高 2.05。中文正文在这个行高下最舒服——再紧会挤，再松就散了。',
  '文末那块用 <code>margin-top:auto</code> 钉在纸底：短稿时它落在最下面，纸不会显得空；长稿时它老老实实跟在正文后面。'
];

function openReader() {
  const a = DATA[loc][k];
  spos.textContent = pad2(k) + ' / ' + pad2(DATA[loc].length - 1) + ' · ' + a.d;
  /* 换一篇要回到开头，否则会继承上一篇的滚动位置 */
  sheetBody.scrollTop = 0;
  sheetBody.innerHTML =
    '<h2>' + a.t + '</h2>' +
    '<div class="sub">' + a.g + ' · ' + a.n + '</div>' +
    '<hr>' +
    BODY.map((t) => '<p>' + t + '</p>').join('') +
    '<div class="note">为什么用 CSS 3D 而不是 three：折页上是中文标题与正文，走 three 就得把字渲成纹理——' +
    '缩放会糊、不能选中、读屏软件读不到。平面用 <code>translate3d</code> 和 three 的 plane 视觉上几乎无差别。</div>' +
    '<div class="sheet__foot">' +
      '<button class="nav" data-dir="-1"' + (k === 0 ? ' disabled' : '') + '>← 上一篇</button>' +
      '<span class="fin">完</span>' +
      '<button class="nav" data-dir="1"' + (k === DATA[loc].length - 1 ? ' disabled' : '') + '>下一篇 →</button>' +
    '</div>';
  reader.classList.add('is-open');
  open = true;
}
function closeReader() { reader.classList.remove('is-open'); open = false; }

/* ---------- 输入 ---------- */
/* 滚轮 / 拖动 / 方向键全交给 `_pager.js`（判据与 craft 房间逐字相同）。
   原来这里是自己写的：`deltaY` 累积到 42 就翻，触控板惯性一划就是 2~3 篇；
   而且 `stage.setPointerCapture()` 会把随后的 click 派发到 stage 上，
   `.fold` 的点击永远收不到 —— "点了没反应"就是这个。 */
const pager = createPager({
  target: stage,
  dragSelector: '.stage',
  enabled: () => !open && !menuOpen,
  onStep: (dir) => go(k + dir),
  onDragStart: () => stage.classList.add('dragging'),
  onDragEnd: () => stage.classList.remove('dragging'),
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (menuOpen) { closeMenu(); return; }
    closeReader();
    return;
  }
  if (menuOpen) return;
  const t = e.target;
  const tag = t && t.tagName ? t.tagName.toLowerCase() : '';
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
    e.preventDefault();
    openMenu();
  }
});

if (LOCK_LOC) {
  document.documentElement.lang = LOCK_LOC === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('bc').classList.add('is-locked');
  document.getElementById('dual').remove();
}
document.getElementById('count').textContent = DATA[loc].length;

document.getElementById('close').addEventListener('click', closeReader);
/* 文末翻篇：留在阅读层里直接换稿，不用退出去再点折页 */
sheetBody.addEventListener('click', (e) => {
  const btn = e.target.closest('.nav');
  if (!btn || btn.disabled) return;
  const n = k + Number(btn.dataset.dir);
  if (n < 0 || n >= DATA[loc].length) return;
  go(n);
  openReader();
});
reader.addEventListener('click', (e) => { if (e.target === reader) closeReader(); });

document.getElementById('locale').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  loc = b.dataset.loc;
  k = 0;
  [...e.currentTarget.children].forEach((x) => x.setAttribute('aria-pressed', x === b));
  build();
});

/* ---------- 目录 ---------- */
const menu = document.getElementById('menu');
const menuBtn = document.getElementById('menuBtn');
const mlist = document.getElementById('mlist');
const mcount = document.getElementById('mcount');
const q = document.getElementById('q');

let mHits = [];   // 过滤后的 [{ a, i }]，i 是原文序号
let mAct = 0;     // 键盘高亮的那一行（在 mHits 里的下标）

const esc = (str) => String(str).replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderMenu() {
  const list = DATA[loc];
  const kw = q.value.trim().toLowerCase();
  mHits = list.map((a, i) => ({ a, i })).filter(({ a }) =>
    !kw || (a.t + ' ' + a.g + ' ' + a.d).toLowerCase().indexOf(kw) >= 0);
  mAct = Math.max(0, Math.min(mAct, mHits.length - 1));
  mcount.textContent = kw ? mHits.length + ' / ' + list.length : list.length + ' 篇';
  mlist.innerHTML = mHits.length
    ? mHits.map(({ a, i }, n) =>
        '<li class="row' + (i === k ? ' is-current' : '') + (n === mAct ? ' is-active' : '') +
        '" data-i="' + i + '">' +
          '<span class="row__n">' + pad2(i) + '</span>' +
          '<span class="row__t">' + esc(a.t) + '</span>' +
          '<span class="row__d">' + esc(a.d) + '</span>' +
        '</li>').join('')
    : '<li class="menu__empty">没有匹配「' + esc(q.value.trim()) + '」的文章</li>';
}

function openMenu() {
  if (menuOpen) return;
  closeReader();
  menuOpen = true;
  q.value = '';
  renderMenu();
  /* 光标落在"当前这篇"上：↑↓ 从你在的位置开始走，而不是从第一行重新数 */
  const here = mHits.findIndex((h) => h.i === k);
  if (here > 0) { mAct = here; renderMenu(); }
  menu.classList.add('is-open');
  menu.setAttribute('aria-hidden', 'false');
  menuBtn.setAttribute('aria-expanded', 'true');
  /* 等面板滑下来再聚焦：太早聚焦，移动端键盘会顶上来把面板挤掉一半 */
  setTimeout(() => {
    if (!menuOpen) return;
    q.focus();
    const el = mlist.querySelector('.is-active');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }, 120);
}

function closeMenu() {
  if (!menuOpen) return;
  menuOpen = false;
  menu.classList.remove('is-open');
  menu.setAttribute('aria-hidden', 'true');
  menuBtn.setAttribute('aria-expanded', 'false');
  q.blur();
}

/* 点一行 = 翻到它。折带自己会滑过去（go → render 带 0.66s 过渡）。 */
function pickRow(i) {
  closeMenu();
  go(i);
}

menuBtn.addEventListener('click', () => (menuOpen ? closeMenu() : openMenu()));
document.getElementById('menuScrim').addEventListener('click', closeMenu);
q.addEventListener('input', () => { mAct = 0; renderMenu(); });
mlist.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (row) pickRow(+row.dataset.i);
});

/* 面板自己的键盘：↑↓ 走、Enter 跳、Esc 关。
   Esc 要 stopPropagation —— window 上还有一个关阅读层的同名处理。 */
menu.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.stopPropagation(); closeMenu(); return; }
  if (!mHits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    mAct = (mAct + (e.key === 'ArrowDown' ? 1 : -1) + mHits.length) % mHits.length;
    renderMenu();
    const el = mlist.querySelector('.is-active');
    if (el) el.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    pickRow(mHits[mAct].i);
  }
});

/* ---------- 尘埃 ---------- */
const cv = document.getElementById('dust');
const cx = cv.getContext('2d');
let dust = [];
function resize() {
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  dust = Array.from({ length: 64 }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: 0.5 + Math.random() * 1.4,
    a: 0.05 + Math.random() * 0.18,
    vy: -0.05 - Math.random() * 0.16,
    vx: -0.02 - Math.random() * 0.08
  }));
}
addEventListener('resize', resize);
resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0 = performance.now();

/* 尘埃单独抽出来：减少动态偏好下只画一遍，不留一个永不停的 rAF 在跑。 */
function paint() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of dust) {
    cx.fillStyle = 'rgba(240,232,218,' + p.a + ')';
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
  }
}

function loop(t) {
  const dt = Math.min(64, t - t0) / 16.7;
  t0 = t;
  for (const p of dust) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y < -4) { p.y = innerHeight + 4; p.x = Math.random() * innerWidth; }
    if (p.x < -4) p.x = innerWidth + 4;
  }
  paint();
  /* 呼吸漂移：整条带子极缓慢地起伏，静止画面才不会像一张贴图 */
  const s = Math.sin(t * 0.00022);
  const c = Math.cos(t * 0.00016);
  ribbon.style.transform =
    'translate3d(calc(var(--sx) + ' + (s * 0.6) + '%), ' + (-1 + c * 0.5) + '%, 0) rotateX(-3deg) rotateY(' + (RIBBON_YAW + s * 1.1) + 'deg)';
  requestAnimationFrame(loop);
}

if (reduce) {
  paint();
  addEventListener('resize', paint);
} else {
  requestAnimationFrame(loop);
}

build();
</script>
</body>
</html>
