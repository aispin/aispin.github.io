<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数字滚动 · Animated Number Counter</title>
<meta name="description" content="不写一行补间循环：把 --num 注册成 <integer>，用 Web Animations 补间它，再由 counter() 渲染成数字。" />
<link rel="stylesheet" href="../../_lab.css" />
<script src="/demos/_from.js" defer></script>
<style>
    /* 关键：只有注册过的自定义属性才有"类型"，WAAPI 才补得动它。
       inherits:false ⇒ 每个元素各算各的，不会互相污染。 */
    @property --num {
        syntax: '<integer>';
        initial-value: 0;
        inherits: false;
    }

    .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 40px 56px;
        border-radius: 14px;
        background: #f3f4f6;
        color: #0f172a;
    }

    .counter {
        display: inline-flex;
        font-size: 3rem;
        font-weight: 800;
        line-height: 1;
        /* 等宽数字：滚动过程中宽度不跳 */
        font-variant-numeric: tabular-nums;
        /* 把 --num 变成一个 CSS 计数器，再交给 ::before 渲染 */
        counter-set: num var(--num);
    }

    .counter::before {
        content: counter(num);
    }

    .counter__suffix {
        font-size: 0.72em;
        align-self: flex-start;
        margin-top: 0.1em;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
    }

    .replay {
        padding: 8px 18px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #374151;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
    }

    .replay:hover {
        background: #f9fafb;
    }
</style>
</head>
<body>
<a class="lab-back" href="/demos/">← Demos</a>

<div class="stage">
    <span class="counter" id="counter">
        <span class="sr-only">1234</span>
        <span class="counter__suffix">+</span>
    </span>
    <button type="button" class="replay" id="replay">再跑一次</button>
</div>

<p class="lab-note">@property 注册 --num · WAAPI 补间自定义属性 · counter() 渲染</p>

<script>
    const TARGET = 1234
    const el = document.getElementById('counter')

    function run() {
        el.animate(
            [{ '--num': '0' }, { '--num': String(TARGET) }],
            { duration: 1000, easing: 'ease-out', fill: 'forwards' },
        )
    }

    // 进页面就自己跑一次
    run()
    document.getElementById('replay').addEventListener('click', run)
</script>
</body>
</html>
