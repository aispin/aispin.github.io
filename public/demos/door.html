<style>
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 12px;
    background:radial-gradient(ellipse at 50% 14%, #3a2a19 0%, #1a1008 55%, #080502 100%);
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  }
  svg{
    width:min(94vw, 920px);height:auto;display:block;
    filter:drop-shadow(0 24px 56px rgba(0,0,0,.88));
  }
  .door-god .eye-group{
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .18s ease;
  }
  .door-god:hover .eye-group{
    animation: blink .65s ease-in-out;
  }
  @keyframes blink{
    0%   { transform: scaleY(1); }
    40%  { transform: scaleY(.08); }
    55%  { transform: scaleY(.08); }
    100% { transform: scaleY(1); }
  }
</style>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';

  function vCol(str, cx, y0, gap, size, fill){
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('font-family', "'Songti SC','STSong','SimSun','Noto Serif SC',serif");
    g.setAttribute('font-weight', '700');
    g.setAttribute('font-size', size);
    g.setAttribute('fill', fill);
    g.setAttribute('text-anchor', 'middle');
    g.setAttribute('dominant-baseline', 'central');
    for (var i = 0; i < str.length; i++){
      if (!str[i].trim()) continue;
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', cx);
      t.setAttribute('y', y0 + i * gap);
      t.textContent = str[i];
      g.appendChild(t);
    }
    return g;
  }

  var right = document.getElementById('rightCouplet');
  right.appendChild(vCol('创大业千秋昌盛', 862, 152, 80, 46, '#f7e3a1'));

  var left = document.getElementById('leftCouplet');
  left.appendChild(vCol('展宏图再就辉煌', 138, 152, 80, 46, '#f7e3a1'));
})();
</script>
