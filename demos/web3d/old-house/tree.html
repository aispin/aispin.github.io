<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>程序化柿子树 · Three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f0}
  #info{position:fixed;left:16px;bottom:16px;font:12px/1.6 ui-monospace,monospace;
        color:#4a5a66;pointer-events:none;letter-spacing:.02em}
</style>
</head>
<body>
<div id="info">程序化柿子树 · 递归枝干 + InstancedMesh + GLSL 风动 · 拖动旋转</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ===================== 场景基础 ===================== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3f0);
scene.fog = new THREE.Fog(0xcfe3f0, 9, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.4, 2.6, 5.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.495;

/* ===================== 光照 ===================== */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xbfd8ea, 0x6b5a44, 0.7));

const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(4, 7, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { near:0.5, far:20, left:-4, right:4, top:4, bottom:-4 });
sun.shadow.bias = -0.0015;
scene.add(sun);

/* ===================== 地面 ===================== */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48),
  new THREE.MeshStandardMaterial({ color:0xb9c7ae, roughness:1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ===================== 树 ===================== */
const tree = new THREE.Group();
scene.add(tree);

const barkMat = new THREE.MeshStandardMaterial({
  color: 0x5c4632, roughness: 0.92, metalness: 0.0
});

const fruitPositions = [];
const fruitSizes = [];

/* 一段锥形枝干：start -> end，半径 r1 -> r2 */
function makeBranch(start, end, r1, r2) {
  const dir = end.clone().sub(start);
  const len = dir.length();
  if (len < 1e-4) return;

  const geo = new THREE.CylinderGeometry(r2, r1, len, 6, 1, true);
  geo.translate(0, len/2, 0);

  const mesh = new THREE.Mesh(geo, barkMat);
  mesh.position.copy(start);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0), dir.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  tree.add(mesh);
}

/* 递归生长 */
function grow(start, dir, length, radius, depth) {
  const end = start.clone().add(dir.clone().multiplyScalar(length));
  makeBranch(start, end, radius, radius * 0.72);

  // 到达末端 → 挂果
  if (depth <= 0) {
    const n = Math.random() < 0.75 ? 1 : 2;
    for (let i = 0; i < n; i++) {
      fruitPositions.push(end.clone().add(new THREE.Vector3(
        (Math.random()-0.5)*0.18,
        -0.12 - Math.random()*0.14,
        (Math.random()-0.5)*0.18
      )));
      fruitSizes.push(0.11 + Math.random()*0.05);
    }
    return;
  }

  const branches = Math.random() < 0.35 ? 3 : 2;
  for (let i = 0; i < branches; i++) {
    const nd = dir.clone();
    const axis = new THREE.Vector3(
      Math.random()-0.5, Math.random()-0.5, Math.random()-0.5
    ).normalize();
    const angle = (0.38 + Math.random()*0.5) * (i % 2 === 0 ? 1 : -1);
    nd.applyAxisAngle(axis, angle);
    nd.y += 0.22;            // 整体向上趋势，避免枝干下垂
    nd.normalize();

    // 子枝起点沿父枝偏移，避免所有枝都从末端长出
    const t = 0.72 + Math.random()*0.28;
    const bStart = start.clone().lerp(end, t);

    grow(bStart, nd, length*(0.66 + Math.random()*0.14), radius*0.64, depth-1);
  }
}

/* 主干 */
grow(
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(0.03, 1, 0.02).normalize(),
  1.25, 0.17, 5
);

/* ===================== 柿子（InstancedMesh） ===================== */
const fruitGeo = new THREE.SphereGeometry(1, 14, 12);
fruitGeo.scale(1, 0.82, 1);   // 略微压扁，像真柿子

const fruitMat = new THREE.MeshStandardMaterial({
  color: 0xff6a18, roughness: 0.34, metalness: 0.0
});

const fruits = new THREE.InstancedMesh(fruitGeo, fruitMat, fruitPositions.length);
fruits.castShadow = true;
fruits.receiveShadow = true;

const dummy = new THREE.Object3D();
fruitPositions.forEach((p, i) => {
  dummy.position.copy(p);
  dummy.scale.setScalar(fruitSizes[i]);
  dummy.rotation.set(
    Math.random()*0.6, Math.random()*Math.PI*2, Math.random()*0.6
  );
  dummy.updateMatrix();
  fruits.setMatrixAt(i, dummy.matrix);
});
fruits.instanceMatrix.needsUpdate = true;
tree.add(fruits);

/* ===================== 果蒂（绿色四棱锥） ===================== */
const calyxGeo = new THREE.ConeGeometry(1, 0.5, 4);
const calyxMat = new THREE.MeshStandardMaterial({ color: 0x4c7a34, roughness: 0.8 });

const calyxes = new THREE.InstancedMesh(calyxGeo, calyxMat, fruitPositions.length);
fruitPositions.forEach((p, i) => {
  const s = fruitSizes[i];
  dummy.position.set(p.x, p.y + s*0.82, p.z);
  dummy.scale.set(s*0.55, s*0.5, s*0.55);
  dummy.rotation.set(Math.PI, Math.random()*Math.PI, 0);
  dummy.updateMatrix();
  calyxes.setMatrixAt(i, dummy.matrix);
});
calyxes.instanceMatrix.needsUpdate = true;
tree.add(calyxes);

/* ===================== 叶子（贝塞尔轮廓 + ShapeGeometry） ===================== */
const leafShape = new THREE.Shape();
leafShape.moveTo(0, 0);
leafShape.bezierCurveTo(0.35, 0.35, 0.42, 0.95, 0, 1.25);
leafShape.bezierCurveTo(-0.42, 0.95, -0.35, 0.35, 0, 0);

const leafGeo = new THREE.ShapeGeometry(leafShape, 10);
leafGeo.scale(0.11, 0.14, 0.11);

const leafMat = new THREE.MeshStandardMaterial({
  color: 0x3f7a3a, roughness: 0.7, side: THREE.DoubleSide
});

const leafCount = 260;
const leaves = new THREE.InstancedMesh(leafGeo, leafMat, leafCount);
leaves.castShadow = true;

for (let i = 0; i < leafCount; i++) {
  const r = 0.5 + Math.random()*1.4;
  const a = Math.random()*Math.PI*2;
  dummy.position.set(
    Math.cos(a)*r,
    1.6 + Math.random()*2.0,
    Math.sin(a)*r
  );
  dummy.rotation.set(
    -Math.PI/2 + (Math.random()-0.5)*1.6,
    Math.random()*Math.PI*2,
    (Math.random()-0.5)*1.2
  );
  dummy.scale.setScalar(0.8 + Math.random()*0.7);
  dummy.updateMatrix();
  leaves.setMatrixAt(i, dummy.matrix);
}
leaves.instanceMatrix.needsUpdate = true;
tree.add(leaves);

/* ===================== GLSL 风动：onBeforeCompile 注入 ===================== */
const uTime = { value: 0 };
const uWindDir = { value: new THREE.Vector3(1, 0, 0.4).normalize() };

function applyWind(mesh, strength) {
  mesh.material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = uTime;
    shader.uniforms.uWindDir = uWindDir;
    shader.uniforms.uStrength = { value: strength };

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        uniform float uTime;
        uniform vec3  uWindDir;
        uniform float uStrength;
      `)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        // 取实例世界位置，让每片叶子/果子的相位不同
        vec3 wp = (instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        float sway =
            sin(uTime * 1.6 + wp.y * 1.2 + wp.x * 0.7) * 0.5
          + sin(uTime * 2.7 + wp.z * 1.5) * 0.5;
        transformed += uWindDir * sway * uStrength;
      `);
    mesh.userData.shader = shader;
  };
  mesh.material.needsUpdate = true;
}

applyWind(leaves, 0.035);
applyWind(fruits, 0.018);

/* ===================== 循环 ===================== */
const clock = new THREE.Clock();
function animate() {
  uTime.value = clock.getElapsedTime();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
